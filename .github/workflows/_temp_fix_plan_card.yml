              "SessionCard args",
          )
          replace_once(
              renderer,
              '  session: StructuredSession;\n  day?: StructuredDay;\n  defaultOpenBlocks?: boolean;',
              '  session: StructuredSession;\n  day?: StructuredDay;\n  /** Countdown used only to reconcile exact source prescription ranges. */\n  sourceCountdown?: string | null;\n  defaultOpenBlocks?: boolean;',
              "SessionCard source prop",
          )
          replace_once(
              renderer,
              '                  block={block}\n                  openWeekIntent={openWeekIntent}\n                />',
              '                  block={block}\n                  openWeekIntent={openWeekIntent}\n                  sourceCountdown={sourceCountdown}\n                />',
              "BlockCard source countdown",
          )
          replace_once(
              renderer,
              '                session={session}\n                day={index === 0 ? day : undefined}\n                defaultOpenBlocks={isCurrent}',
              '                session={session}\n                day={index === 0 ? day : undefined}\n                sourceCountdown={day.countdown_label}\n                defaultOpenBlocks={isCurrent}',
              "day countdown forwarding",
          )
          active_marker = '// Plan-level "active notes": the short, always-on reminders (weight cut,\n'
          if Path(renderer).read_text().count(active_marker) != 1:
              raise SystemExit("active notes marker mismatch")
          safety_helper = r'''function getSafetyPriorityTexts(plan: StructuredPlan): string[] {
  const rules = getDisplayableRedFlags(plan);
  if (rules.length > 0) {
    return rules.flatMap((rule) =>
      [cleanText(rule.display_text), cleanText(rule.action)].filter(
        (text): text is string => text !== null,
      ),
    );
  }
  return getFallbackSafetyNotes(plan)
    .map((note) => cleanText(note.text))
    .filter((text): text is string => text !== null);
}

'''
          p = Path(renderer)
          text = p.read_text()
          p.write_text(text.replace(active_marker, safety_helper + active_marker, 1))
          replace_once(
              renderer,
              '  const notes = getActiveNotesExcludingRedFlags(plan);',
              '  const safetyPriorityTexts = getSafetyPriorityTexts(plan);\n  const notes = getActiveNotesExcludingRedFlags(plan).flatMap((note) => {\n    const text = stripSafetyOwnedClause(cleanText(note.text) || "", safetyPriorityTexts);\n    return text ? [{ ...note, text }] : [];\n  });',
