      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run focused regression tests
        working-directory: web
        run: node --import tsx --test lib/block-display-guardrails.test.ts components/structured-plan-stop-rules.test.tsx

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

