name: Apply focused plan card fix

on:
  push:
    branches:
      - fix/plan-card-safety-volume-regression

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/plan-card-safety-volume-regression
          fetch-depth: 0
      - name: Apply patch
        run: python tools/_temp_fix_plan_card.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run focused tests
        working-directory: web
        run: node --import tsx --test lib/block-display-guardrails.test.ts components/structured-plan-stop-rules.test.tsx
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Commit final fix
        run: |
          rm .github/workflows/_temp_fix_plan_card.yml
          rm .github/workflows/_temp_fix_plan_card_v2.yml
          rm tools/_temp_fix_plan_card.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix plan card safety and prescription display"
          git push origin HEAD:fix/plan-card-safety-volume-regression
