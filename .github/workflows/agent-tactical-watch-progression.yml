name: Apply Tactical Watch Progression

on:
  push:
    branches:
      - agent/progress-tactical-watch-content
    paths:
      - .github/scripts/apply_tactical_watch_progression.py
      - .github/workflows/agent-tactical-watch-progression.yml
  pull_request:
    branches:
      - Main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/scripts/apply_tactical_watch_progression.py
      - .github/workflows/agent-tactical-watch-progression.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/progress-tactical-watch-content
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Apply phase progression patch
        run: python .github/scripts/apply_tactical_watch_progression.py

      - name: Install validation dependencies
        env:
          PIP_RETRIES: "5"
          PIP_DEFAULT_TIMEOUT: "60"
        run: |
          python -m pip install --upgrade pip
          n=0
          until pip install -r requirements-dev.txt; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install failed after $n attempts"; exit 1
            fi
            echo "Transient install failure; retry $n in $((n * 15))s..."
            sleep $((n * 15))
          done
          pip check

      - name: Validate Tactical Watch progression
        run: |
          ruff check \
            fightcamp/gap_fill_inserts.py \
            fightcamp/camp_week_fillers.py \
            tests/test_mandatory_weekly_tactical_watch.py
          pytest -q \
            tests/test_mandatory_weekly_tactical_watch.py \
            tests/test_gap_fill_inserts.py

      - name: Remove one-shot repair files
        run: |
          rm -f .github/scripts/apply_tactical_watch_progression.py
          rm -f .github/workflows/agent-tactical-watch-progression.yml

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            fightcamp/gap_fill_inserts.py \
            fightcamp/camp_week_fillers.py \
            tests/test_mandatory_weekly_tactical_watch.py \
            .github/scripts/apply_tactical_watch_progression.py \
            .github/workflows/agent-tactical-watch-progression.yml
          if git diff --cached --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git commit -m "Progress Tactical Watch content by camp phase"
          git push origin HEAD:agent/progress-tactical-watch-content
