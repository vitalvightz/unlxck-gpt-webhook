name: Apply audit regression patch

on:
  push:
    branches:
      - fix/audit-plan-access-injury-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/audit-plan-access-injury-state
          fetch-depth: 0

      - name: Update ownership regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_api_plan_access.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          targets = {
              "test_athlete_cannot_read_another_athlete_plan",
              "test_athlete_cannot_read_another_athlete_weekly_schedule",
              "test_plan_completions_rejects_another_athletes_plan",
          }
          current_test = None
          changed = set()
          for index, line in enumerate(lines):
              if line.startswith("def test_"):
                  current_test = line.split("(", 1)[0].removeprefix("def ")
              if current_test in targets and line.strip() == "assert response.status_code == 403":
                  lines[index] = line.replace("403", "404")
                  changed.add(current_test)

          missing = targets - changed
          if missing:
              raise SystemExit(f"Expected ownership assertions were not patched: {sorted(missing)}")

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-audit-test-expectations.yml

      - name: Commit regression updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_api_plan_access.py .github/workflows/apply-audit-test-expectations.yml
          git commit -m "Update plan ownership regression expectations"
          git push origin HEAD:fix/audit-plan-access-injury-state
