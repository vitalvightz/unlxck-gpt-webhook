name: Apply Join the beta CTA copy

on:
  push:
    branches:
      - codex/join-beta-cta

permissions:
  contents: write

jobs:
  update-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/join-beta-cta
          fetch-depth: 0

      - name: Replace CTA copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "Start free beta"
          new = "Join the beta"
          targets = {
              Path("web/app/page.tsx"): 2,
              Path("web/components/app-nav.tsx"): 1,
          }

          for path, expected_count in targets.items():
              text = path.read_text()
              actual_count = text.count(old)
              if actual_count != expected_count:
                  raise SystemExit(
                      f"{path}: expected {expected_count} occurrences of {old!r}, found {actual_count}"
                  )
              path.write_text(text.replace(old, new))

          workflow = Path(".github/workflows/apply-join-beta-cta.yml")
          workflow.unlink()
          PY

      - name: Commit CTA update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app/page.tsx web/components/app-nav.tsx .github/workflows/apply-join-beta-cta.yml
          git commit -m "Update public beta CTA copy"
          git push origin HEAD:codex/join-beta-cta
