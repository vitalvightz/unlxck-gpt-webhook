name: Apply stop-rule fix

on:
  push:
    branches:
      - fix/restore-block-stop-rules

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-block-stop-rules

      - name: Apply stop-rule contract and renderer fix
        run: python .github/apply_stop_rule_fix.py

      - name: Commit implementation
        run: |
          rm .github/workflows/apply-stop-rule-fix.yml .github/apply_stop_rule_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore block stop rules"
          git push origin HEAD:fix/restore-block-stop-rules
