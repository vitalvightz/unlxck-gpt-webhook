name: Apply Tag Registry Migration

on:
  push:
    branches:
      - codex/authoritative-tag-registry

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/authoritative-tag-registry
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Apply deterministic migration
        run: python tools/migrate_tag_registry_data.py

      - name: Commit migrated data
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- data fightcamp/strength.py)"
          if [ -z "$changed" ]; then
            echo "No migration changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while IFS= read -r path; do
            [ -n "$path" ] && git add -- "$path"
          done <<< "$changed"
          git commit -m "Apply canonical tag registry migration"
          git push origin HEAD:codex/authoritative-tag-registry
