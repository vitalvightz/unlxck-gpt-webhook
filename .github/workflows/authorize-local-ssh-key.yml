name: Authorize local SSH key

on:
  push:
    branches:
      - Main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize micha OPSEC key
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      LOCAL_KEY_B64: c3NoLWVkMjU1MTkgQUFBQUMzTnphQzFsWkRJMU5URTVBQUFBSUFFaTVvclBuQzRsa0V2U1RnVWMrOS9IUDY2QjJoUXRaZXozUWd2MWJ2dG8gbWljaGFAT1BTRUMK

    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/unlxck_deploy"
          chmod 600 "$HOME/.ssh/unlxck_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Add and verify local public key
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/unlxck_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          KEY="$(printf '%s' "$LOCAL_KEY_B64" | base64 --decode)"
          KEY_B64="$(printf '%s\n' "$KEY" | base64 -w0)"

          $SSH "$HETZNER_USER@$HETZNER_HOST" "KEY_B64='$KEY_B64' bash -s" <<'REMOTE_SCRIPT'
            set -euo pipefail
            umask 077
            install -d -m 700 "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            key="$(printf '%s' "$KEY_B64" | base64 --decode)"
            grep -qxF "$key" "$HOME/.ssh/authorized_keys" || printf '%s\n' "$key" >> "$HOME/.ssh/authorized_keys"
            chmod 700 "$HOME/.ssh"
            chmod 600 "$HOME/.ssh/authorized_keys"
            grep -qxF "$key" "$HOME/.ssh/authorized_keys"
            echo "Local SSH key authorized for $(whoami)."
          REMOTE_SCRIPT
