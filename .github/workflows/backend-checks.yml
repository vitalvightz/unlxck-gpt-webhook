name: Backend Checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: backend-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-pr-2152:
    if: github.head_ref == 'claude/year-rupture-leg-injury-opyabn' || github.ref_name == 'claude/year-rupture-leg-injury-opyabn'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Repair fixture regex boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("web/lib/today.test.ts")
          text = path.read_text(encoding="utf-8")
          start = text.index("function makeInjury(")
          end = text.index("\n}\n", start) + 3
          block = text[start:end]
          repaired = block.replace(r"\\b", r"\b").replace(r"\\s", r"\s")
          if repaired == block:
              raise SystemExit("fixture contained no escaped regex boundaries")
          path.write_text(text[:start] + repaired + text[end:], encoding="utf-8")
          PY

      - name: Restore workflow and commit repair
        run: |
          git show origin/Main:.github/workflows/backend-checks.yml > .github/workflows/backend-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Today fixture regex boundaries"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
