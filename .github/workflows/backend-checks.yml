name: Backend Checks

# Runs the Supabase runtime schema checker's tests: the checker unit tests
# (fake catalog data, no credentials) plus the static schema.sql test. The full
# backend test suite is already exercised by python-quality.yml, so this
# workflow stays scoped to the deploy-gate checker this PR introduces and
# remains a fast, self-contained signal.
#
# The LIVE Supabase runtime schema check below may skip on PRs and non-Main/main
# branches without credentials, but it is mandatory on protected Main/main
# deploys. Configure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY for protected
# Main/main before treating this workflow as a deploy gate.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  refactor-pr-2152:
    if: github.ref_name == 'claude/year-rupture-leg-injury-opyabn' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply backend-driven injury region refactor
        run: python tools/refactor_injury_regions_2152.py

      - name: Restore this workflow and validate generated Python
        run: |
          git show HEAD^:.github/workflows/backend-checks.yml > .github/workflows/backend-checks.yml
          python -m py_compile fightcamp/injury_body_region.py api/services/today_service.py

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use backend injury regions for safe sessions"
          git push origin HEAD:${GITHUB_REF_NAME}

  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run runtime schema checker tests
        run: pytest tests/test_supabase_runtime_schema_checker.py tests/test_supabase_schema.py

      # The service-role key is scoped to THIS step's env so the install/test
      # steps above never see it. The gate only permits missing credentials on
      # PRs or non-protected-Main/main branch runs; protected Main/main deploys must run
      # the live check and pass.
      - name: Live Supabase runtime schema check (staging)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/run_supabase_runtime_schema_gate.py
