name: Backend Checks

# Runs the Supabase runtime schema checker's tests: the checker unit tests
# (fake catalog data, no credentials) plus the static schema.sql test. The full
# backend test suite is already exercised by python-quality.yml, so this
# workflow stays scoped to the deploy-gate checker this PR introduces and
# remains a fast, self-contained signal.
#
# The LIVE Supabase runtime schema check below runs ONLY when the SUPABASE_URL
# and SUPABASE_SERVICE_ROLE_KEY repository secrets are configured (point them at
# a STAGING project, never production). Until those secrets exist the step skips
# itself, so this stays a fast, self-contained signal. Configure the secrets to
# turn it into a real deploy gate (see docs/supabase-runtime-schema-check.md).

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Mapped from secrets here so the live-check step's `if:` can test them via
    # the env context (the secrets context is not reliably usable in `if:`).
    # Both resolve to empty strings until the secrets are configured.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run runtime schema checker tests
        run: pytest tests/test_supabase_runtime_schema_checker.py tests/test_supabase_schema.py

      # Runs only when both secrets are configured (point them at STAGING). When
      # they are unset the env values are empty and this step is skipped, so the
      # workflow stays green on forks/PRs without credentials.
      - name: Live Supabase runtime schema check (staging)
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: python tools/check_supabase_runtime_schema.py
