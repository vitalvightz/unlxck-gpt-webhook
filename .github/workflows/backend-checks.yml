name: Backend Checks

# Runs the Supabase runtime schema checker's tests: the checker unit tests
# (fake catalog data, no credentials) plus the static schema.sql test. The full
# backend test suite is already exercised by python-quality.yml, so this
# workflow stays scoped to the deploy-gate checker this PR introduces and
# remains a fast, self-contained signal.
#
# The LIVE Supabase runtime schema check below may skip on PRs and non-Main/main
# branches without credentials, but it is mandatory on protected Main/main
# deploys. Configure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY for protected
# Main/main before treating this workflow as a deploy gate.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply exact-sport style preference on target branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/add-exact-sport-style-bonus'
        shell: bash
        run: |
          if grep -q "STYLE_EXACT_SPORT_BONUS = 0.5" fightcamp/conditioning.py; then
            echo "Exact-sport preference already present."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path('fightcamp/conditioning.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'PREFERRED_EXERCISE_NAME_BOOST = 3.0\n',
              'PREFERRED_EXERCISE_NAME_BOOST = 3.0\nSTYLE_EXACT_SPORT_BONUS = 0.5\n',
              'constant anchor',
          )

          helper_anchor = '''def _conditioning_clarification_bonus(tags: list[str], derived_clarification_tags: list[str]) -> tuple[float, list[str]]:\n    if not derived_clarification_tags:\n        return 0.0, []\n    hits = sorted(set(tags).intersection(derived_clarification_tags))\n    if not hits:\n        return 0.0, []\n    bonus = min(len(hits) * CONDITIONING_CLARIFICATION_TAG_BONUS, CONDITIONING_MAX_CLARIFICATION_TAG_BONUS)\n    return bonus, hits\n'''
          helper_replacement = helper_anchor + '''\n\ndef _style_exact_sport_bonus(raw_tags: list[str], selection_format: str) -> float:\n    \"\"\"Return the small preference for a raw exact-sport style-bank match.\n\n    Raw bank tags are inspected before compatibility rewrites so a rewritten\n    Muay Thai tag cannot masquerade as a native boxing tag.\n    \"\"\"\n    sport = str(selection_format or \"\").strip().lower()\n    if not sport:\n        return 0.0\n    return STYLE_EXACT_SPORT_BONUS if sport in set(normalize_tags(raw_tags or [])) else 0.0\n'''
          replace_once(helper_anchor, helper_replacement, 'helper anchor')

          replace_once(
              '        "entries_scored": 0,\n        "entries_selected": 0,\n',
              '        "entries_scored": 0,\n        "entries_exact_sport_bonus_applied": 0,\n        "entries_selected": 0,\n        "final_selected_exact_sport_names": [],\n',
              'diagnostics anchor',
          )

          replace_once(
              '            for drill in style_conditioning_bank:\n                d = drill.copy()\n',
              '            for drill in style_conditioning_bank:\n                # Compute specificity before any runtime sport-tag compatibility rewrite.\n                sport_specificity_bonus = _style_exact_sport_bonus(\n                    drill.get("tags", []), selection_format\n                )\n                d = drill.copy()\n',
              'raw sport anchor',
          )

          replace_once(
              '                score += equip_bonus\n                score += _conditioning_collision_safe_priority_bonus(\n',
              '                score += equip_bonus\n                score += sport_specificity_bonus\n                if sport_specificity_bonus:\n                    style_conditioning_diagnostics["entries_exact_sport_bonus_applied"] += 1\n                score += _conditioning_collision_safe_priority_bonus(\n',
              'score anchor',
          )

          replace_once(
              '                    "equipment_boost": equip_bonus,\n                    "preferred_exercise_name_match": PREFERRED_EXERCISE_NAME_BOOST if preferred_name_match else 0.0,\n',
              '                    "equipment_boost": equip_bonus,\n                    "sport_specificity_bonus": sport_specificity_bonus,\n                    "exact_sport_match": bool(sport_specificity_bonus),\n                    "preferred_exercise_name_match": PREFERRED_EXERCISE_NAME_BOOST if preferred_name_match else 0.0,\n',
              'reason metadata anchor',
          )

          replace_once(
              '                if preferred_name_match:\n                    reasons["reason_codes"].append(f"preferred_exercise_name_match:+{PREFERRED_EXERCISE_NAME_BOOST:.1f}")\n\n                entry = (d, score, reasons)\n',
              '                if preferred_name_match:\n                    reasons["reason_codes"].append(f"preferred_exercise_name_match:+{PREFERRED_EXERCISE_NAME_BOOST:.1f}")\n                if sport_specificity_bonus:\n                    reasons["reason_codes"].append(\n                        f"exact_sport_match:+{STYLE_EXACT_SPORT_BONUS:.1f}"\n                    )\n\n                entry = (d, score, reasons)\n',
              'reason code anchor',
          )

          replace_once(
              '    if reasons.get("equipment_boost"):\n        parts.append("equipment boost")\n    if reasons.get("load_adjustments"):\n',
              '    if reasons.get("equipment_boost"):\n        parts.append("equipment boost")\n    if reasons.get("sport_specificity_bonus"):\n        parts.append("exact sport match")\n    if reasons.get("load_adjustments"):\n',
              'explanation anchor',
          )

          replace_once(
              '    style_conditioning_diagnostics["entries_selected"] = len(final_style_conditioning_names)\n    style_conditioning_diagnostics["final_selected_style_conditioning_names"] = final_style_conditioning_names\n',
              '    style_conditioning_diagnostics["entries_selected"] = len(final_style_conditioning_names)\n    style_conditioning_diagnostics["final_selected_style_conditioning_names"] = final_style_conditioning_names\n    style_conditioning_diagnostics["final_selected_exact_sport_names"] = [\n        name\n        for name in final_style_conditioning_names\n        if reason_lookup.get(name, {}).get("sport_specificity_bonus", 0) > 0\n    ]\n',
              'selected diagnostics anchor',
          )

          path.write_text(text, encoding='utf-8')

          Path('tests/test_style_exact_sport_bonus.py').write_text(r'''import pytest

from fightcamp import conditioning


TACTICAL_STYLES = (
    "distance_striker",
    "counter_striker",
    "pressure_fighter",
    "brawler",
    "clinch_fighter",
    "kicker",
    "wrestler",
    "grappler",
    "scrambler",
    "submission_hunter",
)


def _style_drill(name: str, style: str, sport: str | None) -> dict:
    tags = [style]
    if sport:
        tags.insert(0, sport)
    return {
        "name": name,
        "equipment": ["bodyweight"],
        "phases": ["GPP", "SPP"],
        "system": "aerobic",
        "modality": "controlled technical conditioning",
        "duration": "180s work / 60s rest x 3 rounds",
        "intensity": "moderate",
        "tags": tags,
        "notes": "Sustainable technical conditioning with clean mechanics.",
        "equipment_note": "Bodyweight only.",
        "work_sec": 180,
        "rest_sec": 60,
        "rounds": 3,
        "rpe": 5,
        "impact_cost": "low",
        "lactate_load": "low",
        "movement_cost": "low",
        "mechanical_risk_tags": [],
    }


def _flags(style: str, sport: str = "mma") -> dict:
    technical = {"mma": "mma", "boxing": "boxing", "kickboxing": "kickboxing", "muay_thai": "muay thai"}[sport]
    return {
        "phase": "GPP",
        "sport": sport,
        "style_technical": [technical],
        "style_tactical": [style.replace("_", " ")],
        "key_goals": ["conditioning"],
        "weaknesses": [],
        "fatigue": "low",
        "equipment": [],
        "training_frequency": 2,
        "days_available": 2,
        "days_until_fight": 35,
        "time_to_fight_days": 35,
        "injuries": [],
        "restrictions": [],
    }


def _run_pair(monkeypatch, style: str, sport: str = "mma", other_sport: str | None = None):
    exact = _style_drill(f"Exact {style}", style, sport)
    other = _style_drill(f"Other {style}", style, other_sport)
    monkeypatch.setattr(conditioning, "get_style_conditioning_bank", lambda: [other, exact])
    monkeypatch.setattr(conditioning, "get_conditioning_bank", lambda: [])
    result = conditioning.generate_conditioning_block(_flags(style, sport))
    reservoir = result[5]
    candidates = {
        entry["drill"]["name"]: entry
        for entry in reservoir.get("aerobic", [])
        if entry.get("drill", {}).get("name") in {exact["name"], other["name"]}
    }
    return exact, other, candidates, reservoir["__style_conditioning__"]


def test_raw_exact_sport_helper_uses_pre_rewrite_tags():
    assert conditioning._style_exact_sport_bonus(["boxing", "counter_striker"], "boxing") == 0.5
    assert conditioning._style_exact_sport_bonus(["muay_thai", "counter_striker"], "boxing") == 0.0
    assert conditioning._style_exact_sport_bonus(["kickboxing", "muay_thai", "brawler"], "kickboxing") == 0.5
    assert conditioning._style_exact_sport_bonus(["kickboxing", "muay_thai", "brawler"], "muay_thai") == 0.5
    assert conditioning._style_exact_sport_bonus(["brawler"], "mma") == 0.0


@pytest.mark.parametrize("style", TACTICAL_STYLES)
def test_exact_sport_bonus_is_global_across_all_tactical_styles(monkeypatch, style):
    exact, other, candidates, diagnostics = _run_pair(monkeypatch, style)
    assert set(candidates) == {exact["name"], other["name"]}
    exact_entry = candidates[exact["name"]]
    other_entry = candidates[other["name"]]
    assert exact_entry["score"] == pytest.approx(other_entry["score"] + 0.5)
    assert exact_entry["reasons"]["sport_specificity_bonus"] == 0.5
    assert exact_entry["reasons"]["exact_sport_match"] is True
    assert "exact_sport_match:+0.5" in exact_entry["reasons"]["reason_codes"]
    assert other_entry["reasons"]["sport_specificity_bonus"] == 0.0
    assert other_entry["reasons"]["exact_sport_match"] is False
    assert diagnostics["entries_exact_sport_bonus_applied"] == 1
    assert exact["name"] in diagnostics["final_selected_style_conditioning_names"]
    assert exact["name"] in diagnostics["final_selected_exact_sport_names"]


def test_cross_sport_tie_is_broken_by_exact_sport(monkeypatch):
    exact, other, candidates, _ = _run_pair(monkeypatch, "counter_striker", "mma", "boxing")
    assert candidates[exact["name"]]["score"] == pytest.approx(candidates[other["name"]]["score"] + 0.5)


def test_boxing_runtime_rewrite_cannot_fake_exact_sport_bonus(monkeypatch):
    exact, converted, candidates, diagnostics = _run_pair(monkeypatch, "counter_striker", "boxing", "muay_thai")
    assert set(candidates) == {exact["name"], converted["name"]}
    assert candidates[exact["name"]]["reasons"]["sport_specificity_bonus"] == 0.5
    assert candidates[converted["name"]]["reasons"]["sport_specificity_bonus"] == 0.0
    assert candidates[exact["name"]]["score"] == pytest.approx(candidates[converted["name"]]["score"] + 0.5)
    assert diagnostics["entries_exact_sport_bonus_applied"] == 1
''', encoding='utf-8')
          PY
          python -m py_compile fightcamp/conditioning.py
          pytest -q tests/test_style_exact_sport_bonus.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fightcamp/conditioning.py tests/test_style_exact_sport_bonus.py
          git commit -m "[sport-bonus-applied] Add exact sport style preference"
          git push origin HEAD:codex/add-exact-sport-style-bonus

      - name: Run runtime schema checker tests
        run: pytest tests/test_supabase_runtime_schema_checker.py tests/test_supabase_schema.py

      # The service-role key is scoped to THIS step's env so the install/test
      # steps above never see it. The gate only permits missing credentials on
      # PRs or non-protected-Main/main branch runs; protected Main/main deploys must run
      # the live check and pass.
      - name: Live Supabase runtime schema check (staging)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/run_supabase_runtime_schema_gate.py
