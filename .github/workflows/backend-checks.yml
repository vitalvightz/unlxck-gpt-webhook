name: Backend Checks

# Runs the Supabase runtime schema checker's tests: the checker unit tests
# (fake catalog data, no credentials) plus the static schema.sql test. The full
# backend test suite is already exercised by python-quality.yml, so this
# workflow stays scoped to the deploy-gate checker this PR introduces and
# remains a fast, self-contained signal.
#
# The LIVE Supabase runtime schema check below may skip on PRs and non-Main/main
# branches without credentials, but it is mandatory on protected Main/main
# deploys. Configure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY for protected
# Main/main before treating this workflow as a deploy gate.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical D14 role-authority patch
        if: github.ref == 'refs/heads/codex/d14-role-authority-surgical'
        run: python tools/_apply_d14_role_authority_patch.py

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run surgical role-authority regressions
        if: github.ref == 'refs/heads/codex/d14-role-authority-surgical'
        run: |
          pytest -q tests/test_d14_role_authority_surgical.py tests/test_sparse_combat_week_hard_conditioning.py tests/test_late_camp_role_morph.py tests/test_camp_tail_allocator_handoff.py tests/test_late_fight_tail_finalizer_contracts.py tests/test_stage2_payload_late_fight_roles.py
          python -m compileall -q fightcamp tests/test_d14_role_authority_surgical.py
          ruff check fightcamp/stage2_role_map.py fightcamp/camp_week_fillers.py fightcamp/late_fight_tail.py fightcamp/stage2_payload_late_fight.py fightcamp/stage2_finalizer_packet_impl.py fightcamp/stage2_policy.py tests/test_d14_role_authority_surgical.py

      - name: Commit surgical patch and restore workflow
        if: github.ref == 'refs/heads/codex/d14-role-authority-surgical'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin Main
          git checkout origin/Main -- .github/workflows/backend-checks.yml
          git rm tools/_apply_d14_role_authority_patch.py
          git add .github/workflows/backend-checks.yml fightcamp/stage2_role_map.py fightcamp/camp_week_fillers.py fightcamp/late_fight_tail.py fightcamp/stage2_payload_late_fight.py fightcamp/stage2_finalizer_packet_impl.py fightcamp/stage2_policy.py tests/test_d14_role_authority_surgical.py
          git commit -m "Preserve role authority across D14 handoff"
          git push origin HEAD:codex/d14-role-authority-surgical

      - name: Run runtime schema checker tests
        run: pytest tests/test_supabase_runtime_schema_checker.py tests/test_supabase_schema.py

      # The service-role key is scoped to THIS step's env so the install/test
      # steps above never see it. The gate only permits missing credentials on
      # PRs or non-protected-Main/main branch runs; protected Main/main deploys must run
      # the live check and pass.
      - name: Live Supabase runtime schema check (staging)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/run_supabase_runtime_schema_gate.py
