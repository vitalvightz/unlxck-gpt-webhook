name: Backend Checks

# Runs the Supabase runtime schema checker's tests: the checker unit tests
# (fake catalog data, no credentials) plus the static schema.sql test. The full
# backend test suite is already exercised by python-quality.yml, so this
# workflow stays scoped to the deploy-gate checker this PR introduces and
# remains a fast, self-contained signal.
#
# The LIVE Supabase runtime schema check is intentionally NOT run here by
# default, because it requires service-role credentials and a migrated target
# database. To enable it, add the SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY
# repository secrets and uncomment the "Live Supabase runtime schema check" step
# below (see docs/supabase-runtime-schema-check.md).

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run runtime schema checker tests
        run: pytest tests/test_supabase_runtime_schema_checker.py tests/test_supabase_schema.py

      # To enable the live Supabase runtime schema check, configure the
      # SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY repository secrets and
      # uncomment the step below. It only runs when both secrets are present.
      #
      # - name: Live Supabase runtime schema check
      #   if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      #     SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      #   run: python tools/check_supabase_runtime_schema.py
