name: Backend Checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: backend-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch-pr-2152:
    if: github.head_ref == 'claude/year-rupture-leg-injury-opyabn' || github.ref_name == 'claude/year-rupture-leg-injury-opyabn'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Align fixture with backend consequence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("web/lib/today.test.ts")
          lines = path.read_text(encoding="utf-8").splitlines()
          start = next(i for i, line in enumerate(lines) if line == "  const consequence =")
          end = next(i for i in range(start + 1, len(lines)) if lines[i] == "  return {")
          replacement = [
              "  const consequence =",
              "    overrides.consequence !== undefined",
              "      ? overrides.consequence",
              r"      : /\b(?:concussion|concussed)\b/.test(text)",
              '        ? "neuro"',
              r"        : !deniedStructural && /\b(?:fracture|fractures|rupture|ruptures|tear|tears|torn|dislocation|dislocations|avulsion)\b/.test(text)",
              '          ? "structural"',
              "          : null;",
              "  return {",
          ]
          updated = lines[:start] + replacement + lines[end + 1 :]
          path.write_text("\n".join(updated) + "\n", encoding="utf-8")
          PY

      - name: Restore workflow and commit correction
        run: |
          git show origin/Main:.github/workflows/backend-checks.yml > .github/workflows/backend-checks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align Today tests with backend injury consequence"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
