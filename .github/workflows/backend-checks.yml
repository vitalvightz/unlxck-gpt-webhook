name: Backend Checks

on:
  push:
    branches:
      - chatgpt/fix-effective-spar-late-taper

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-effective-spar-late-taper
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Apply patch
        run: python tools/_temp_apply_effective_spar_patch.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test patch
        run: |
          pytest -q tests/test_late_camp_architecture_cliff.py tests/test_stage2_planning_brief.py
          python -m py_compile fightcamp/stage2_role_map.py fightcamp/weekly_plan_render.py

      - name: Commit patch
        run: |
          git show e8ccdd1f4918bf95d3859114a87ecbe3873868c3:.github/workflows/backend-checks.yml > .github/workflows/backend-checks.yml
          rm -f .github/workflows/_temp_apply_effective_spar_patch.yml
          rm -f tools/_temp_apply_effective_spar_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix late-camp effective sparring allocation [surgical-patch-applied]"
          git push origin HEAD:chatgpt/fix-effective-spar-late-taper
