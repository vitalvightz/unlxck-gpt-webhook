name: Clean PR 2426 bank diff

on:
  push:
    branches:
      - codex/expand-technical-footwork-bank

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-2426-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/expand-technical-footwork-bank
          fetch-depth: 0
      - name: Restore clean bank formatting and apply surgical metadata edits
        shell: bash
        run: |
          git show 719cd5038e96bfeee4a09eb0c12e3aed9187d0a7:data/technical_footwork_bank.json > data/technical_footwork_bank.json
          python - <<'PY'
          from pathlib import Path

          path = Path('data/technical_footwork_bank.json')
          text = path.read_text()

          old_fence = '''      "mma",\n      "counter_striker",\n      "distance_striker",\n      "mech_change_of_direction",\n      "mech_lower_limb_weight_bearing"'''
          new_fence = '''      "mma",\n      "mech_change_of_direction",\n      "mech_lower_limb_weight_bearing"'''
          if old_fence not in text:
              raise SystemExit('Fence style-tag block not found')
          text = text.replace(old_fence, new_fence, 1)

          old_fn = '    "tactical_function": ["takedown_setup", "base_recovery", "angle_creation"],'
          new_fn = '    "tactical_function": ["base_recovery", "angle_creation"],'
          if old_fn not in text:
              raise SystemExit('Wrestling stance tactical-function line not found')
          text = text.replace(old_fn, new_fn, 1)

          path.write_text(text)
          PY

          rm -f .github/workflows/cleanup-pr2426.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/technical_footwork_bank.json .github/workflows/cleanup-pr2426.yml
          git diff --cached --check
          git commit -m "chore: keep PR 2426 bank diff surgical [cleanup-2426-done]"
          git push origin HEAD:codex/expand-technical-footwork-bank
