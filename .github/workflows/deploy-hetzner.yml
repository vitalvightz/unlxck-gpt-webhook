name: Deploy Backend to Hetzner

on:
  push:
    branches:
      - Main
  workflow_dispatch:

# Least privilege: the job only needs to read the repository so the runner can
# check out the commit. No GitHub token ever leaves the runner or reaches the
# server; the server is updated from a git bundle over SSH.
permissions:
  contents: read

# Serialize deployments so two runs can never touch /opt/unlxck at the same
# time. cancel-in-progress: false queues newer runs behind the running one
# instead of interrupting a deploy midway (which could leave a half-applied
# state or the worker stopped).
concurrency:
  group: hetzner-backend-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API and worker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      EXPECTED_COMMIT: ${{ github.sha }}
      # Unique per run; numeric run_id is safe to interpolate into a path.
      REMOTE_BUNDLE: /tmp/unlxck-deploy-${{ github.run_id }}.bundle

    steps:
      # Full history is required so the git bundle is complete and can be
      # applied on the server regardless of what history it already has.
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/unlxck_deploy
          chmod 600 ~/.ssh/unlxck_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/unlxck_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          if ! $SSH "$HETZNER_USER@$HETZNER_HOST" "echo 'SSH connection successful'"; then
            echo "ERROR: SSH connection to the deployment server failed." >&2
            exit 1
          fi

      # Package the exact checked-out commit (github.sha) as a self-contained
      # git bundle. This is the source of truth that gets deployed; the server
      # never contacts GitHub.
      - name: Package commit as git bundle
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/unlxck-deploy.bundle" HEAD
          if ! git bundle verify "$RUNNER_TEMP/unlxck-deploy.bundle"; then
            echo "ERROR: generated git bundle failed verification." >&2
            exit 1
          fi

      # Stream the bundle to the server over the same authenticated SSH
      # channel. The bundle contains only public source, so no secret is moved.
      - name: Upload commit bundle to server
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/unlxck_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          if ! $SSH "$HETZNER_USER@$HETZNER_HOST" "cat > '$REMOTE_BUNDLE'" < "$RUNNER_TEMP/unlxck-deploy.bundle"; then
            echo "ERROR: failed to transfer the commit bundle to the server." >&2
            exit 1
          fi

      - name: Deploy backend
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/unlxck_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          $SSH "$HETZNER_USER@$HETZNER_HOST" \
            "EXPECTED_COMMIT='$EXPECTED_COMMIT' BUNDLE_PATH='$REMOTE_BUNDLE' bash -s" <<'REMOTE_SCRIPT'
              set -Eeuo pipefail

              HEALTH_HOST="api.unlxck.com"
              HEALTH_URL="https://${HEALTH_HOST}/health"
              CADDY_CONFIG="/etc/caddy/Caddyfile"

              worker_running() { [ -n "$(docker compose ps --status running -q worker)" ]; }
              caddy_running()  { [ -n "$(docker compose ps --status running -q caddy)" ]; }
              api_healthy() {
                # Exercise the local TLS proxy without routing the server's own
                # readiness probe through Cloudflare, whose security policy can
                # reject origin-host traffic even while the API is healthy.
                curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 10 \
                  --noproxy "$HEALTH_HOST" \
                  --resolve "${HEALTH_HOST}:443:127.0.0.1" \
                  "$HEALTH_URL" >/dev/null
              }
              validate_and_reload_caddy() {
                docker compose exec -T caddy caddy validate --config "$CADDY_CONFIG" &&
                  docker compose exec -T caddy caddy reload --config "$CADDY_CONFIG"
              }

              cd /opt/unlxck || { echo "ERROR: /opt/unlxck is missing on the server." >&2; exit 1; }

              # --- Pre-flight (nothing changed yet, so failures just abort;
              #     rollback is not armed and must not run) ---
              if [ ! -f "$BUNDLE_PATH" ]; then
                echo "ERROR: commit bundle not found at $BUNDLE_PATH." >&2
                exit 1
              fi
              if ! git bundle verify "$BUNDLE_PATH" >/dev/null 2>&1; then
                echo "ERROR: commit bundle failed verification on the server." >&2
                exit 1
              fi
              if [ ! -f .env.production ]; then
                echo "ERROR: /opt/unlxck/.env.production is missing; refusing to deploy." >&2
                exit 1
              fi

              PREVIOUS_COMMIT="$(git rev-parse HEAD)"
              DEPLOYMENT_SUCCEEDED=false

              rollback() {
                exit_code=$?
                trap - ERR
                # Best-effort inside rollback: keep going and collect
                # diagnostics even if an individual step fails.
                set +e

                # A late ERR after success must not trigger a destructive
                # rollback; just propagate the status.
                if [ "$DEPLOYMENT_SUCCEEDED" = true ]; then
                  exit "$exit_code"
                fi

                echo "Deployment failed (exit ${exit_code}). Restoring previous commit ${PREVIOUS_COMMIT}." >&2

                # Preserve diagnostics from the failed state before changing it.
                mkdir -p /opt/unlxck/deployment-logs
                LOG_FILE="/opt/unlxck/deployment-logs/failed-$(date +%Y%m%dT%H%M%S)-${EXPECTED_COMMIT}.log"
                {
                  echo "Deployment failed at $(date --iso-8601=seconds)"
                  echo "Failure exit code: ${exit_code}"
                  echo "Target commit:   ${EXPECTED_COMMIT}"
                  echo "Previous commit: ${PREVIOUS_COMMIT}"
                  echo "--- docker compose ps ---"
                  docker compose ps
                  echo "--- docker compose logs (api worker caddy) ---"
                  docker compose logs --tail=300 api worker caddy
                } > "$LOG_FILE" 2>&1
                echo "Saved failure diagnostics to ${LOG_FILE}." >&2

                # Restore the previous source and containers. Every step must
                # succeed: a rollback that leaves the old (healthy) containers
                # running but fails to restore the source must NOT be reported
                # as a successful restore.
                #
                # Stop the worker first so only one queue consumer exists during
                # the swap (best-effort: a stop failure is not itself fatal).
                rollback_steps_ok=true
                docker compose stop worker || true

                if ! git reset --hard "$PREVIOUS_COMMIT"; then
                  echo "ROLLBACK ERROR: git reset to ${PREVIOUS_COMMIT} failed." >&2
                  rollback_steps_ok=false
                fi
                if [ "$(git rev-parse HEAD 2>/dev/null)" != "$PREVIOUS_COMMIT" ]; then
                  echo "ROLLBACK ERROR: source is not at ${PREVIOUS_COMMIT} after reset (HEAD=$(git rev-parse HEAD 2>/dev/null))." >&2
                  rollback_steps_ok=false
                fi
                if ! docker compose config --quiet; then
                  echo "ROLLBACK ERROR: compose config invalid at ${PREVIOUS_COMMIT}." >&2
                  rollback_steps_ok=false
                fi
                if ! docker compose up -d --build --remove-orphans; then
                  echo "ROLLBACK ERROR: compose up failed during rollback." >&2
                  rollback_steps_ok=false
                fi
                if ! validate_and_reload_caddy; then
                  echo "ROLLBACK ERROR: restored Caddy configuration could not be reloaded." >&2
                  rollback_steps_ok=false
                fi

                # Only after every restore step succeeded do we probe the
                # services; a false restore must never pass on the strength of
                # the previous containers still answering.
                rollback_ok=false
                if [ "$rollback_steps_ok" = true ]; then
                  for attempt in $(seq 1 18); do
                    if api_healthy && worker_running && caddy_running; then
                      rollback_ok=true
                      break
                    fi
                    echo "Rollback: waiting for restored API, worker and caddy (${attempt}/18)." >&2
                    sleep 5
                  done
                else
                  echo "Rollback: one or more restore steps failed; not treating the deployment as restored." >&2
                fi

                if [ "$rollback_ok" = true ]; then
                  echo "Rollback successful: source restored to ${PREVIOUS_COMMIT}; API healthy, worker and caddy running." >&2
                else
                  echo "ROLLBACK FAILED: could not fully restore ${PREVIOUS_COMMIT} (source, API, worker and/or caddy not verified)." >&2
                  docker compose ps >&2
                  docker compose logs --tail=200 api worker caddy >&2
                fi

                # Always fail the workflow: a rollback still means this
                # deployment did not succeed.
                exit "$exit_code"
              }

              trap rollback ERR

              echo "Previous commit: ${PREVIOUS_COMMIT}"
              echo "Expected commit: ${EXPECTED_COMMIT}"

              # Import the exact commit from the local bundle. No network, no
              # credentials, immune to server-side git URL/credential config.
              # Force-update the staging ref so a revert or an out-of-order
              # re-run (non-fast-forward) is still accepted.
              git fetch --no-tags "$BUNDLE_PATH" "+HEAD:refs/deploy/incoming"
              git reset --hard refs/deploy/incoming

              ACTUAL_COMMIT="$(git rev-parse HEAD)"
              if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
                echo "ERROR: commit mismatch. Expected ${EXPECTED_COMMIT} but tree is at ${ACTUAL_COMMIT}." >&2
                false
              fi

              echo "Validating docker compose configuration..."
              docker compose config --quiet

              echo "Building and (re)starting api, worker and caddy..."
              docker compose up -d --build --remove-orphans
              if ! validate_and_reload_caddy; then
                echo "ERROR: Caddy configuration validation or reload failed." >&2
                false
              fi
              docker compose ps

              echo "Waiting for API health and worker readiness..."
              healthy=false
              for attempt in $(seq 1 18); do
                if api_healthy; then
                  if worker_running; then
                    healthy=true
                    break
                  fi
                  echo "API healthy but worker not running yet (${attempt}/18)."
                else
                  echo "Waiting for API health via Caddy (${attempt}/18)."
                fi
                sleep 5
              done

              if [ "$healthy" != true ]; then
                echo "ERROR: health checks failed (API and/or worker not ready after 18 attempts)." >&2
                docker compose ps
                docker compose logs --tail=200 api worker caddy
                false
              fi

              # Caddy is the public TLS entrypoint; a 200 above implies it is up,
              # but assert explicitly so its absence is reported clearly.
              if ! caddy_running; then
                echo "ERROR: caddy container is not running after deployment." >&2
                docker compose ps
                false
              fi

              DEPLOYMENT_SUCCEEDED=true
              echo "Deployment successful: ${ACTUAL_COMMIT} (API healthy, worker running, caddy running)."
              docker compose ps
          REMOTE_SCRIPT

      # Always remove the transferred bundle, even if the deploy failed.
      - name: Remove transferred bundle from server
        if: always()
        run: |
          set -uo pipefail
          SSH="ssh -i $HOME/.ssh/unlxck_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          $SSH "$HETZNER_USER@$HETZNER_HOST" "rm -f '$REMOTE_BUNDLE'" || true

      # Independent external check after the authoritative local TLS Caddy gate.
      # A runner-specific Cloudflare 403 is reported without rolling back a
      # healthy deployment; transport errors and all other non-200 responses fail.
      - name: Verify public health endpoint
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --retry-connrefused \
              --connect-timeout 10 \
              --max-time 20 \
              --output "$response_file" \
              --write-out "%{http_code}" \
              https://api.unlxck.com/health
          )" || {
            echo "ERROR: public health request could not be completed." >&2
            exit 1
          }

          case "$status" in
            200)
              echo "Public health endpoint returned 200."
              ;;
            403)
              echo "::warning::Cloudflare returned 403 to the GitHub Actions runner. The authoritative local TLS Caddy health check already passed."
              ;;
            *)
              echo "ERROR: public health endpoint returned HTTP ${status}." >&2
              cat "$response_file" >&2 || true
              exit 1
              ;;
          esac
