name: Deploy Hetzner

on:
  push:
    branches:
      - Main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hetzner-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/unlxck
  DEPLOY_HEALTH_URL: https://unlxck-staging.167.233.47.121.sslip.io/health

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}

    steps:
      - name: Checkout Main deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'Main' || github.sha }}

      - name: Record tested commit
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Run deployment quality gate
        run: |
          ruff check api fightcamp tests tools
          pytest -q \
            tests/test_api_generation_flows.py \
            tests/test_generation_runtime.py \
            tests/test_worker_shutdown.py \
            tests/test_hetzner_deployment_assets.py
          python tools/validate_banks.py

      - name: Validate deployment shell
        run: |
          bash -n scripts/deploy_hetzner.sh tests/test_deploy_hetzner.sh
          shellcheck -x scripts/deploy_hetzner.sh tests/test_deploy_hetzner.sh
          bash tests/test_deploy_hetzner.sh

      - name: Validate Compose and build production images
        run: |
          cp .env.example .env.production
          printf '\nAPI_DOMAIN=ci.invalid\n' >> .env.production
          docker compose config --quiet
          docker compose build api worker

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout tested deployment code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}

      - name: Configure strict SSH authentication
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$HETZNER_SSH_PRIVATE_KEY"
          test -n "$HETZNER_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > "$HOME/.ssh/hetzner_deploy"
          printf '%s\n' "$HETZNER_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hetzner_deploy" "$HOME/.ssh/known_hosts"

      - name: Deploy tested commit
        id: deployment
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
        run: |
          test -n "$HETZNER_HOST"
          test -n "$HETZNER_USER"
          test -n "$HETZNER_SSH_PORT"

          set +e
          ssh \
            -i "$HOME/.ssh/hetzner_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -p "$HETZNER_SSH_PORT" \
            "$HETZNER_USER@$HETZNER_HOST" \
            "bash -s -- '$TARGET_SHA' '$DEPLOY_PATH' '$DEPLOY_HEALTH_URL'" \
            < scripts/deploy_hetzner.sh \
            | tee "$RUNNER_TEMP/hetzner-deploy.log"
          deploy_status=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$deploy_status" >> "$GITHUB_OUTPUT"
          exit "$deploy_status"

      - name: Publish deployment summary
        if: ${{ always() }}
        env:
          DEPLOY_EXIT_CODE: ${{ steps.deployment.outputs.exit_code }}
        run: |
          report_file="$RUNNER_TEMP/hetzner-deploy.log"
          report_value() {
            local key="$1"
            if [[ -f "$report_file" ]]; then
              sed -n "s/^::UNLXCK_REPORT::${key}=//p" "$report_file" | tail -1
            fi
          }

          target_sha="$(report_value target_sha)"
          previous_sha="$(report_value previous_sha)"
          deployed_sha="$(report_value deployed_sha)"
          result="$(report_value result)"
          api_health="$(report_value api_health)"
          api_status="$(report_value api_status)"
          worker_status="$(report_value worker_status)"
          rollback="$(report_value rollback)"

          {
            echo "## Hetzner deployment"
            echo
            echo "| Field | Result |"
            echo "| --- | --- |"
            echo "| Target commit | \`${target_sha:-unavailable}\` |"
            echo "| Previous commit | \`${previous_sha:-unavailable}\` |"
            echo "| Deployed commit | \`${deployed_sha:-unavailable}\` |"
            echo "| Deployment result | ${result:-connection_failed} |"
            echo "| API health | ${api_health:-not_checked} |"
            echo "| API container | ${api_status:-unknown} |"
            echo "| Worker container | ${worker_status:-unknown} |"
            echo "| Rollback | ${rollback:-unknown} |"
            echo "| SSH exit code | ${DEPLOY_EXIT_CODE:-unavailable} |"
          } >> "$GITHUB_STEP_SUMMARY"
