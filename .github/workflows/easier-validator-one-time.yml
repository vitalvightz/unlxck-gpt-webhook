name: One-time Easier validator patch
on:
  push:
    branches: [codex/fix-easier-validator-label]
    paths: [.github/workflows/easier-validator-one-time.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-easier-validator-label
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
      - name: Apply exact validator-only patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('fightcamp/stage2_validator.py')
          s = p.read_text()
          changes = [
              (r'r"^\s*(?:"', r'r"^\s*(?:[-*•]\s*)?(?:\*\*)?(?:"', 1),
          ]
          # Patch the named annotation regex only, never all regexes in the module.
          start = s.index('_LATE_FIGHT_ANNOTATION_LABEL = re.compile(')
          end = s.index('\n\n# Non-physical countdown tasks', start)
          block = s[start:end]
          replacements = [
              (r'r"^\s*(?:"', r'r"^\s*(?:[-*•]\s*)?(?:\*\*)?(?:"'),
              (r'r"(?:progress(?:ion)s?|regress(?:ion)s?|stop)"', r'r"(?:progress(?:ion)s?|regress(?:ion)s?|stop|easier)"'),
              (r'r"(?:\s*[\/\-]\s*(?:progress(?:ion)s?|regress(?:ion)s?|stop))*|"', r'r"(?:\s*[\/\-]\s*(?:progress(?:ion)s?|regress(?:ion)s?|stop|easier))*|"'),
              (r'r")\s*(?:\([^)]*\))?\s*[:\-–—]"', r'r")\s*(?:\([^)]*\))?\s*(?:\*\*)?\s*[:\-–—]"'),
          ]
          for old, new in replacements:
              assert block.count(old) == 1, old
              block = block.replace(old, new)
          s = s[:start] + block + s[end:]
          # Easier is also inspected by the existing progression lockout. A
          # mislabeled instruction to increase work must not bypass that guard.
          start = s.index('_LATE_FIGHT_PROGRESSION_LINE = re.compile(')
          end = s.index('\n\n_LATE_FIGHT_BARE_ADJUSTMENT_LABEL', start)
          block = s[start:end]
          old = r'r"(?:progress(?:ion)?s?(?:\s*[\/\-]\s*regress(?:ion)?s?)?|regress(?:ion)?s?)"'
          new = r'r"(?:progress(?:ion)?s?(?:\s*[\/\-]\s*regress(?:ion)?s?)?|regress(?:ion)?s?|easier(?:\s*[\/-]\s*(?:regress(?:ion)?s?|stop))?)"'
          assert block.count(old) == 1
          block = block.replace(old, new)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
      - name: Add focused regression tests
        run: |
          cat > tests/test_stage2_easier_annotations.py <<'PY'
          """Easier labels are annotations, not newly selected exercises."""
          import pytest

          from fightcamp.stage2_validator import (
              _late_fight_allowed_exercise_warnings,
              _late_fight_line_is_exercise_like,
              _late_fight_progression_suggested_warnings,
              _late_camp_effective_prescription_warnings,
          )

          @pytest.mark.parametrize('line', [
              'Easier: reduce to 2 x 3 @ RPE 5.',
              '- Easier — drop one set of Trap Bar Deadlift.',
              '- **Easier:** reduce the punch volume to 2 rounds.',
              'Easier/Stop: remove the final set if speed drops.',
              'Regression: reduce to 2 x 3.',
          ])
          def test_reduction_annotation_is_not_an_exercise(line):
              assert not _late_fight_line_is_exercise_like(line)

          def test_easier_does_not_create_an_unapproved_exercise():
              spec = {'allowed_exercises_by_day': {'D-12': ['Trap Bar Deadlift']}}
              text = ('D-12 (Monday) — Strength\n'
                      '- Trap Bar Deadlift — 2 x 3 @ RPE 6\n'
                      '- Easier: reduce to 1 x 3 @ RPE 5.\n')
              assert _late_fight_allowed_exercise_warnings(spec, text, []) == []

          def test_easier_does_not_create_a_complete_allow_list_violation():
              brief = {'weekly_role_map': {'weeks': [{'session_roles': [{
                  'role_key': 'primary_strength_day',
                  'effective_strength_envelope': {
                      'scheduled_d_day': 12,
                      'complete_exercise_allow_list': True,
                      'allowed_exercise_names': ['Trap Bar Deadlift'],
                  },
              }]}]}}
              text = ('D-12 (Monday) — Strength\n'
                      '- Trap Bar Deadlift — 2 x 3 @ RPE 6\n'
                      '- Easier: reduce to 1 x 3 @ RPE 5.\n')
              assert _late_camp_effective_prescription_warnings(brief, text) == []

          def test_actual_unapproved_exercise_still_blocks():
              spec = {'allowed_exercises_by_day': {'D-12': ['Trap Bar Deadlift']}}
              text = 'D-12 (Monday) — Strength\n- Sandbag Shouldering — 3 x 3\n'
              findings = _late_fight_allowed_exercise_warnings(spec, text, [])
              assert any(f['code'] == 'late_fight_unapproved_exercise_rendered' for f in findings)
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verify focused changes
        run: |
          python -m compileall -q fightcamp/stage2_validator.py tests/test_stage2_easier_annotations.py
          python -m pytest tests/test_stage2_easier_annotations.py tests/test_stage2_validator.py tests/test_prescription_resolver_e2e.py -q
          python -m ruff check fightcamp/stage2_validator.py tests/test_stage2_easier_annotations.py
          git diff --check
      - name: Commit only production and regression files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/easier-validator-one-time.yml
          git add fightcamp/stage2_validator.py tests/test_stage2_easier_annotations.py
          git commit -m 'Recognize Easier reductions without bypassing progression checks'
          git push origin HEAD:codex/fix-easier-validator-label
