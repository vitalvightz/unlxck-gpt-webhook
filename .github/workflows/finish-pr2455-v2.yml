name: Finish PR 2455 surgical role authority v2

on:
  push:
    branches:
      - codex/d14-d13-role-handoff-surgical

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d14-d13-role-handoff-surgical
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Apply remaining surgical changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/finish-pr2455.yml').read_text()
          start = workflow.index("          from pathlib import Path\n")
          end = workflow.index("          PY\n", start)
          block = workflow[start:end]
          script = textwrap.dedent(block)
          Path('/tmp/apply_pr2455.py').write_text(script)
          PY
          python /tmp/apply_pr2455.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Focused regression suite
        run: |
          pytest -q \
            tests/test_d14_d13_role_handoff_surgical.py \
            tests/test_camp_tail_allocator_handoff.py \
            tests/test_stage2_payload_late_fight_roles.py \
            tests/test_stage2_payload_modes.py \
            tests/test_stage2_finalizer_packet.py \
            tests/test_sparse_combat_week_hard_conditioning.py
      - name: Lint and syntax
        run: |
          ruff check fightcamp/stage2_role_map.py fightcamp/weekly_plan_render.py fightcamp/stage2_finalizer_packet.py tests/test_d14_d13_role_handoff_surgical.py tests/test_stage2_finalizer_packet.py
          python -m compileall -q fightcamp
      - name: Commit verified implementation and remove temporary workflows
        run: |
          git rm .github/workflows/finish-pr2455.yml .github/workflows/finish-pr2455-v2.yml
          git add fightcamp/stage2_role_map.py fightcamp/weekly_plan_render.py fightcamp/stage2_finalizer_packet.py tests/test_d14_d13_role_handoff_surgical.py tests/test_stage2_finalizer_packet.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve adaptive role authority through finalizer"
          git push origin HEAD:codex/d14-d13-role-handoff-surgical
