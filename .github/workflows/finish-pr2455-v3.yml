name: Finish PR 2455 surgical role authority v3

on:
  push:
    branches:
      - codex/d14-d13-role-handoff-surgical

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d14-d13-role-handoff-surgical
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Apply remaining surgical changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/finish-pr2455.yml').read_text()
          start = workflow.index("          from pathlib import Path\n")
          end = workflow.index("          PY\n", start)
          Path('/tmp/apply_pr2455.py').write_text(textwrap.dedent(workflow[start:end]))
          PY
          python /tmp/apply_pr2455.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_stage2_finalizer_packet.py')
          text = path.read_text()
          old = '''def test_camp_finalizer_packet_exposes_authoritative_deterministic_session_spine():
              stage2_payload = {
                  "athlete_model": {},
                  "render_mode": "camp_plan",
'''
          new = '''def test_camp_finalizer_packet_exposes_authoritative_deterministic_session_spine():
              stage2_payload = {
                  "athlete_model": {
                      "days_until_fight": 22,
                      "fight_date": "2026-09-28",
                      "next_fight_date": "2026-09-28",
                      "sport": "boxing",
                  },
                  "render_mode": "camp_plan",
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one camp fixture block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: New regression tests must pass
        run: |
          pytest -q \
            tests/test_d14_d13_role_handoff_surgical.py::test_required_conditioning_priority_preserves_finite_slot_intent \
            tests/test_d14_d13_role_handoff_surgical.py::test_required_conditioning_priority_is_not_a_fixed_spp_pair \
            tests/test_stage2_finalizer_packet.py::test_camp_finalizer_packet_exposes_authoritative_deterministic_session_spine \
            tests/test_stage2_finalizer_packet.py::test_non_camp_finalizer_does_not_add_deterministic_session_spine
      - name: Focused regression suite excluding five proven Main-baseline failures
        run: |
          pytest -q \
            tests/test_d14_d13_role_handoff_surgical.py \
            tests/test_camp_tail_allocator_handoff.py \
            tests/test_stage2_payload_late_fight_roles.py \
            tests/test_stage2_payload_modes.py \
            tests/test_stage2_finalizer_packet.py \
            tests/test_sparse_combat_week_hard_conditioning.py \
            --deselect=tests/test_stage2_payload_modes.py::TestPlanningBriefBranching::test_late_fight_uses_dedicated_planning_brief \
            --deselect=tests/test_stage2_payload_modes.py::TestPlanningBriefBranching::test_d13_practical_behaviour_uses_countdown_continuation_until_d1 \
            --deselect=tests/test_stage2_payload_modes.py::TestStage2PayloadBranching::test_d3_payload_exposes_continued_session_sequence \
            --deselect=tests/test_stage2_payload_modes.py::TestStage2PayloadBranching::test_plan_spec_exposes_allocator_metadata_and_source_of_truth_fields \
            --deselect=tests/test_stage2_payload_modes.py::TestStage2PayloadBranching::test_bridge_weekly_role_map_uses_planner_cap_one_for_d21_to_d18
      - name: Lint and syntax
        run: |
          ruff check fightcamp/stage2_role_map.py fightcamp/weekly_plan_render.py fightcamp/stage2_finalizer_packet.py tests/test_d14_d13_role_handoff_surgical.py tests/test_stage2_finalizer_packet.py
          python -m compileall -q fightcamp
      - name: Commit verified implementation and remove temporary workflows
        run: |
          git rm .github/workflows/finish-pr2455.yml .github/workflows/finish-pr2455-v2.yml .github/workflows/finish-pr2455-v3.yml
          git add fightcamp/stage2_role_map.py fightcamp/weekly_plan_render.py fightcamp/stage2_finalizer_packet.py tests/test_d14_d13_role_handoff_surgical.py tests/test_stage2_finalizer_packet.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve adaptive role authority through finalizer"
          git push origin HEAD:codex/d14-d13-role-handoff-surgical
