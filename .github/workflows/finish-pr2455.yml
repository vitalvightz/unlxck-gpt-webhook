name: Finish PR 2455 surgical role authority

on:
  push:
    branches:
      - codex/d14-d13-role-handoff-surgical

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d14-d13-role-handoff-surgical
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Apply remaining surgical changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "fightcamp/stage2_role_map.py",
              '''def _preferred_boxer_conditioning_sequence(phase: str, conditioning_sequence: list[str]) -> list[str]:
              phase = str(phase or "").upper()
              if phase == "GPP":
                  preferred = ["aerobic", "alactic", "glycolytic"]
              elif phase == "SPP":
                  preferred = ["aerobic", "glycolytic", "alactic"]
              else:
                  preferred = ["alactic", "aerobic", "glycolytic"]
              return dedupe_preserve_order(preferred + list(conditioning_sequence or []))


          def _resequence_session_roles(
          ''',
              '''def _preferred_boxer_conditioning_sequence(phase: str, conditioning_sequence: list[str]) -> list[str]:
              phase = str(phase or "").upper()
              if phase == "GPP":
                  preferred = ["aerobic", "alactic", "glycolytic"]
              elif phase == "SPP":
                  preferred = ["aerobic", "glycolytic", "alactic"]
              else:
                  preferred = ["alactic", "aerobic", "glycolytic"]
              return dedupe_preserve_order(preferred + list(conditioning_sequence or []))


          def _prioritize_required_conditioning_systems(sequence: list[str], week: dict) -> list[str]:
              """Protect resolved conditioning intent within the existing finite slots."""
              state = week.get("resolved_rule_state") or {}
              required = [
                  system
                  for item in clean_list(state.get("must_keep", week.get("must_keep", [])))
                  if (system := str(item).strip().lower()) in {"aerobic", "glycolytic", "alactic"}
              ]
              if not required:
                  return sequence
              # The brief already resolved phase and athlete-limiter priorities. Keep
              # those as the optional order rather than forcing a universal SPP pair.
              adaptive = list(week.get("conditioning_sequence") or sequence)
              return dedupe_preserve_order(required + adaptive)


          def _resequence_session_roles(
          ''',
          )

          replace_once(
              "fightcamp/stage2_role_map.py",
              '''        if sport_key == "boxing" and week_entry.get("phase", "").upper() in {"GPP", "SPP"} and int(session_counts.get("conditioning", 0) or 0) >= 2:
                      conditioning_sequence = _preferred_boxer_conditioning_sequence(
                          week_entry.get("phase", ""),
                          conditioning_sequence,
                      )
                  session_roles: list[dict] = []
          ''',
              '''        if sport_key == "boxing" and week_entry.get("phase", "").upper() in {"GPP", "SPP"} and int(session_counts.get("conditioning", 0) or 0) >= 2:
                      conditioning_sequence = _preferred_boxer_conditioning_sequence(
                          week_entry.get("phase", ""),
                          conditioning_sequence,
                      )
                  if sport_key == "boxing" and week_entry.get("phase", "").upper() in {"GPP", "SPP"}:
                      conditioning_sequence = _prioritize_required_conditioning_systems(
                          conditioning_sequence,
                          week_entry,
                      )
                  session_roles: list[dict] = []
          ''',
          )

          replace_once(
              "fightcamp/weekly_plan_render.py",
              '''def render_weekly_schedule_section(*, planning_brief: dict[str, Any], blocks: Any) -> str:
          ''',
              '''def render_weekly_session_spine(weekly_role_map: dict[str, Any]) -> list[dict[str, Any]]:
              """Copy the finished planner's session identities for finalizer rendering.

              No placement, selection, dose default, or session-count repair happens here.
              """
              if not isinstance(weekly_role_map, dict):
                  return []
              spine: list[dict[str, Any]] = []
              for week in weekly_role_map.get("weeks", []) or []:
                  if not isinstance(week, dict):
                      continue
                  sessions = [
                      {
                          key: role[key]
                          for key in (
                              "session_index", "session_id", "role_key", "category",
                              "preferred_system", "scheduled_day_hint", "scheduled_countdown_label",
                              "countdown_label", "countdown_offset", "athlete_facing_label",
                              "coach_owned", "render_mandatory",
                          )
                          if key in role
                      }
                      for role in week.get("session_roles", []) or []
                      if isinstance(role, dict) and role.get("render_mandatory") is not False
                  ]
                  if sessions:
                      spine.append(
                          {
                              **{
                                  key: week[key]
                                  for key in ("week_index", "phase", "calendar_days")
                                  if key in week
                              },
                              "sessions": sessions,
                          }
                      )
              return spine


          def render_weekly_schedule_section(*, planning_brief: dict[str, Any], blocks: Any) -> str:
          ''',
          )

          replace_once(
              "fightcamp/stage2_finalizer_packet.py",
              '''from .stage2_payload_late_fight import _handoff_mode_instructions
          ''',
              '''from .stage2_payload_late_fight import _handoff_mode_instructions
          from .weekly_plan_render import render_weekly_session_spine
          ''',
          )

          replace_once(
              "fightcamp/stage2_finalizer_packet.py",
              '''    _lock_sparse_hard_conditioning_contract(packet)

              tail_contracts = _late_fight_tail_contracts(weekly_role_map)
          ''',
              '''    _lock_sparse_hard_conditioning_contract(packet)

              if packet.get("render_mode") == "camp_plan":
                  spine = render_weekly_session_spine(weekly_role_map)
                  if spine:
                      selected_plan = packet.setdefault("selected_plan", {})
                      selected_plan["deterministic_session_spine"] = deepcopy(spine)
                      packet.setdefault("hard_rules", []).append(
                          "selected_plan.deterministic_session_spine is the authoritative finished "
                          "week/day/session structure, not candidate material. Render every listed "
                          "session exactly once using its supplied week_index, session_index, role_key, "
                          "category, and day/countdown identity. Do not delete, omit, merge, move, "
                          "replace, or invent sessions, or reinterpret S&C as unrelated skill/tactical work. "
                          "Wording and compliant coaching detail remain editable inside each session; "
                          "selected exercise membership and all supplied dose/safety contracts still apply. "
                          "Coach-owned entries retain their existing contact/context rendering contract; "
                          "they are not permission to prescribe additional app-owned work. "
                          "Do not reconstruct intent from Stage 1 exercise menus or restore suppressed roles."
                      )

              tail_contracts = _late_fight_tail_contracts(weekly_role_map)
          ''',
          )

          test_path = Path("tests/test_d14_d13_role_handoff_surgical.py")
          test_text = test_path.read_text()
          marker = "test_required_conditioning_priority_preserves_finite_slot_intent"
          if marker not in test_text:
              test_text += '''\n\ndef test_required_conditioning_priority_preserves_finite_slot_intent() -> None:\n    from fightcamp.stage2_role_map import _prioritize_required_conditioning_systems\n\n    week = {\n        "resolved_rule_state": {"must_keep": ["rehab", "glycolytic", "alactic", "primary_strength"]},\n        "conditioning_sequence": ["aerobic", "glycolytic", "alactic"],\n    }\n    assert _prioritize_required_conditioning_systems(\n        ["aerobic", "glycolytic", "alactic"], week\n    ) == ["glycolytic", "alactic", "aerobic"]\n\n\ndef test_required_conditioning_priority_is_not_a_fixed_spp_pair() -> None:\n    from fightcamp.stage2_role_map import _prioritize_required_conditioning_systems\n\n    week = {\n        "resolved_rule_state": {"must_keep": ["aerobic", "glycolytic"]},\n        "conditioning_sequence": ["alactic", "glycolytic", "aerobic"],\n    }\n    assert _prioritize_required_conditioning_systems(\n        ["aerobic", "glycolytic", "alactic"], week\n    )[:2] == ["aerobic", "glycolytic"]\n'''
              test_path.write_text(test_text)

          finalizer_test = Path("tests/test_stage2_finalizer_packet.py")
          finalizer_text = finalizer_test.read_text()
          marker = "test_camp_finalizer_packet_exposes_authoritative_deterministic_session_spine"
          if marker not in finalizer_text:
              finalizer_text += '''\n\ndef test_camp_finalizer_packet_exposes_authoritative_deterministic_session_spine():\n    stage2_payload = {\n        "athlete_model": {},\n        "render_mode": "camp_plan",\n        "weekly_role_map": {\n            "weeks": [\n                {\n                    "week_index": 2,\n                    "phase": "SPP",\n                    "calendar_days": [{"weekday": "Wednesday", "countdown_label": "D-12"}],\n                    "session_roles": [\n                        {\n                            "session_index": 1,\n                            "role_key": "strength_touch_day",\n                            "category": "strength",\n                            "scheduled_day_hint": "Wednesday",\n                            "scheduled_countdown_label": "D-12",\n                        }\n                    ],\n                }\n            ]\n        },\n    }\n    packet = build_stage2_finalizer_packet(stage2_payload=stage2_payload)\n    spine = packet["selected_plan"]["deterministic_session_spine"]\n    assert spine[0]["week_index"] == 2\n    assert spine[0]["sessions"][0]["role_key"] == "strength_touch_day"\n    assert spine[0]["sessions"][0]["scheduled_countdown_label"] == "D-12"\n    assert any(\n        "deterministic_session_spine is the authoritative finished" in rule\n        and "Do not delete, omit, merge, move" in rule\n        for rule in packet["hard_rules"]\n    )\n\n\ndef test_non_camp_finalizer_does_not_add_deterministic_session_spine():\n    stage2_payload = {\n        "payload_mode": "open_ongoing_payload",\n        "render_mode": "open_ongoing_system",\n        "athlete_model": {"days_until_fight": None, "fight_date": None, "next_fight_date": None},\n        "open_plan_spec": {"plan_type": "open_ongoing_system", "structure": ["Immediate Coach Summary"]},\n        "weekly_role_map": {"weeks": [{"week_index": 1, "session_roles": [{"session_index": 1, "role_key": "x"}]}]},\n    }\n    packet = build_stage2_finalizer_packet(stage2_payload=stage2_payload)\n    assert "deterministic_session_spine" not in packet["selected_plan"]\n'''
              finalizer_test.write_text(finalizer_text)
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Focused regression suite
        run: |
          pytest -q \
            tests/test_d14_d13_role_handoff_surgical.py \
            tests/test_camp_tail_allocator_handoff.py \
            tests/test_stage2_role_map.py \
            tests/test_stage2_payload_late_fight_roles.py \
            tests/test_stage2_payload_modes.py \
            tests/test_stage2_finalizer_packet.py \
            tests/test_sparse_combat_week_hard_conditioning.py
      - name: Lint and syntax
        run: |
          ruff check fightcamp/stage2_role_map.py fightcamp/weekly_plan_render.py fightcamp/stage2_finalizer_packet.py tests/test_d14_d13_role_handoff_surgical.py tests/test_stage2_finalizer_packet.py
          python -m compileall -q fightcamp
      - name: Commit verified implementation and remove temporary workflow
        run: |
          git rm .github/workflows/finish-pr2455.yml
          git add fightcamp/stage2_role_map.py fightcamp/weekly_plan_render.py fightcamp/stage2_finalizer_packet.py tests/test_d14_d13_role_handoff_surgical.py tests/test_stage2_finalizer_packet.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve adaptive role authority through finalizer"
          git push origin HEAD:codex/d14-d13-role-handoff-surgical
