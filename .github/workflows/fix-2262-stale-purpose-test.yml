name: Fix PR 2262 stale purpose test

on:
  push:
    branches:
      - fix/restore-block-stop-rules

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-block-stop-rules
          fetch-depth: 0

      - name: Align stale renderer test with execution-first contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('web/components/structured-plan-renderer.test.tsx')
          text = path.read_text()
          old = '''  // Generic plan rationale is not Context; it stays only where the block itself\n  // needs its athlete-facing purpose.\n  assert.equal(countOccurrences(html, "Pocket planning."), 1);\n  assert.equal(html.includes("Choose a clean exit"), true);\n  assert.equal(html.includes("Stay calm as you exit the exchange."), true);\n'''
          new = '''  // Block purpose is retained as structured planning context, not rendered on\n  // the athlete execution card. Genuine mindset/execution cues remain visible.\n  assert.equal(html.includes("Pocket planning."), false);\n  assert.equal(html.includes("Choose a clean exit"), true);\n  assert.equal(html.includes("Stay calm as you exit the exchange."), false);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale assertion block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run affected renderer test
        run: |
          cd web
          npm ci --ignore-scripts
          node --import tsx --test --test-name-pattern="keeps engine rationale out of athlete-facing mindset and block copy" components/structured-plan-renderer.test.tsx

      - name: Commit test correction and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-2262-stale-purpose-test.yml
          git add web/components/structured-plan-renderer.test.tsx
          git commit -m "Align rationale test with execution-first cards"
          git push origin HEAD:fix/restore-block-stop-rules
