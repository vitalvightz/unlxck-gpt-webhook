name: Fix late strength pool authority v2
on:
  push:
    branches:
      - fix/late-strength-role-pool-authority
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/late-strength-role-pool-authority
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/fix_late_strength_role_pool.py
      - run: python -m pip install pytest ruff
      - run: pytest -q tests/test_canonical_session_composition.py --maxfail=1
      - run: ruff check fightcamp/stage2_payload.py
      - run: |
          rm -f .github/workflows/fix-late-strength-role-pool-authority.yml
          rm -f .github/workflows/fix-late-strength-role-pool-authority-v2.yml
          rm -f .github/scripts/fix_late_strength_role_pool.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fightcamp/stage2_payload.py .github
          git commit -m 'fix: keep late strength touches in strength pool authority'
          git push origin HEAD:fix/late-strength-role-pool-authority
