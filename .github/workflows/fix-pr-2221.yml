name: Repair PR 2221

on:
  push:
    branches:
      - agent/mandatory-weekly-tactical-watch
    paths:
      - .github/scripts/fix_pr_2221.py
      - .github/scripts/run_fix_pr_2221.py
      - .github/workflows/fix-pr-2221.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mandatory-weekly-tactical-watch
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          n=0
          until pip install -r requirements-dev.txt; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install failed after $n attempts"
              exit 1
            fi
            sleep $((n * 15))
          done
          pip check

      - name: Apply repair
        run: |
          python .github/scripts/run_fix_pr_2221.py
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_stage2_payload_modes.py")
          text = test_path.read_text(encoding="utf-8")
          start_marker = "    def test_bridge_d16_practical_spacing_avoids_adjacent_app_owned_sessions(self):"
          end_marker = "    def test_bridge_d16_avoids_meaningful_app_owned_work_on_declared_hard_days(self):"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = "\n".join(
              [
                  "    def test_bridge_d16_practical_spacing_avoids_adjacent_app_owned_sessions(self):",
                  "        brief = _build_brief_for(",
                  "            16,",
                  "            athlete_overrides={",
                  '                "plan_creation_weekday": "monday",',
                  '                "hard_sparring_days": [],',
                  "            },",
                  "        )",
                  '        visible_sequence = brief["late_fight_plan_spec"]["visible_session_sequence"]',
                  "        non_watch_offsets = [",
                  '            entry["countdown_offset"]',
                  "            for entry in visible_sequence",
                  '            if isinstance(entry.get("countdown_offset"), int)',
                  '            and not entry.get("mandatory_tactical_watch")',
                  "        ]",
                  "",
                  "        assert all(",
                  "            first - second > 1",
                  "            for first, second in zip(non_watch_offsets, non_watch_offsets[1:])",
                  "        )",
                  "        all_visible_offsets = sorted(",
                  "            {",
                  '                entry["countdown_offset"]',
                  "                for entry in visible_sequence",
                  '                if isinstance(entry.get("countdown_offset"), int)',
                  "            },",
                  "            reverse=True,",
                  "        )",
                  "        sequence_debug = [",
                  "            (",
                  '                entry.get("role_key"),',
                  '                entry.get("countdown_offset"),',
                  '                entry.get("mandatory_tactical_watch"),',
                  '                entry.get("tactical_watch_segment"),',
                  "            )",
                  "            for entry in visible_sequence",
                  "        ]",
                  "        assert all(",
                  "            first - second > 1",
                  "            for first, second in zip(all_visible_offsets, all_visible_offsets[1:])",
                  "        ), sequence_debug",
                  "        outer_watch_offsets = [",
                  '            entry["countdown_offset"]',
                  "            for entry in visible_sequence",
                  '            if entry.get("mandatory_tactical_watch")',
                  '            and entry.get("tactical_watch_segment") == 2',
                  "        ]",
                  "        assert outer_watch_offsets == [16]",
                  "        assert outer_watch_offsets[0] in non_watch_offsets",
                  "",
                  "",
              ]
          )
          test_path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          gap_path = Path("fightcamp/gap_fill_inserts.py")
          gap_text = gap_path.read_text(encoding="utf-8")
          old = "\n".join(
              [
                  "        if (",
                  "            target_offset <= 0",
                  "            or target_offset in existing_exclusive_offsets",
                  "            or target_offset in mandatory_watch_offsets",
                  "        ):",
                  "            continue",
              ]
          )
          new = "\n".join(
              [
                  "        if (",
                  "            target_offset <= 0",
                  "            or target_offset in existing_exclusive_offsets",
                  "            or target_offset in mandatory_watch_offsets",
                  "            or (",
                  "                days_until_fight > 13",
                  "                and any(",
                  "                    abs(target_offset - watch_offset) <= 1",
                  "                    for watch_offset in mandatory_watch_offsets",
                  "                )",
                  "            )",
                  "        ):",
                  "            continue",
              ]
          )
          if gap_text.count(old) != 1:
              raise RuntimeError("Expected one late-fight candidate spacing guard")
          gap_path.write_text(gap_text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Compile changed Python
        run: |
          python -m py_compile \
            fightcamp/camp_week_fillers.py \
            fightcamp/gap_fill_inserts.py \
            fightcamp/stage2_finalizer_packet.py \
            tests/test_mandatory_weekly_tactical_watch.py \
            tests/test_stage2_payload_modes.py \
            tests/test_stage2_planning_brief.py

      - name: Run targeted regression tests
        run: |
          set -o pipefail
          pytest -vv --tb=long \
            tests/test_mandatory_weekly_tactical_watch.py \
            tests/test_camp_week_fillers.py \
            tests/test_gap_fill_inserts.py \
            tests/test_stage2_finalizer_packet.py \
            tests/test_stage2_payload_modes.py \
            tests/test_stage2_planning_brief.py \
            2>&1 | tee targeted-failures.txt

      - name: Upload targeted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-2221-targeted-report
          path: targeted-failures.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Run Ruff
        run: |
          ruff check \
            fightcamp/camp_week_fillers.py \
            fightcamp/gap_fill_inserts.py \
            fightcamp/stage2_finalizer_packet.py \
            tests/test_mandatory_weekly_tactical_watch.py \
            tests/test_stage2_payload_modes.py \
            tests/test_stage2_planning_brief.py

      - name: Run full Python suite
        run: pytest tests/ -q

      - name: Commit validated repair and remove scaffolding
        run: |
          rm -f \
            .github/scripts/fix_pr_2221.py \
            .github/scripts/run_fix_pr_2221.py \
            .github/workflows/fix-pr-2221.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            fightcamp/camp_week_fillers.py \
            fightcamp/gap_fill_inserts.py \
            fightcamp/stage2_finalizer_packet.py \
            tests/test_mandatory_weekly_tactical_watch.py \
            tests/test_stage2_payload_modes.py \
            tests/test_stage2_planning_brief.py \
            .github/scripts/fix_pr_2221.py \
            .github/scripts/run_fix_pr_2221.py \
            .github/workflows/fix-pr-2221.yml
          git commit -m "Harden mandatory weekly Tactical Watch"
          git push origin HEAD:agent/mandatory-weekly-tactical-watch
