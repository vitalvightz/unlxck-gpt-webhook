name: Repair PR 2221

on:
  push:
    branches:
      - agent/mandatory-weekly-tactical-watch
    paths:
      - .github/scripts/fix_pr_2221.py
      - .github/scripts/run_fix_pr_2221.py
      - .github/workflows/fix-pr-2221.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mandatory-weekly-tactical-watch
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          n=0
          until pip install -r requirements-dev.txt; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install failed after $n attempts"
              exit 1
            fi
            sleep $((n * 15))
          done
          pip check

      - name: Apply repair
        run: python .github/scripts/run_fix_pr_2221.py

      - name: Compile changed Python
        run: |
          python -m py_compile \
            fightcamp/camp_week_fillers.py \
            fightcamp/gap_fill_inserts.py \
            fightcamp/stage2_finalizer_packet.py \
            tests/test_mandatory_weekly_tactical_watch.py \
            tests/test_stage2_payload_modes.py \
            tests/test_stage2_planning_brief.py

      - name: Run targeted regression tests
        id: targeted
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -vv --tb=long \
            tests/test_mandatory_weekly_tactical_watch.py \
            tests/test_camp_week_fillers.py \
            tests/test_gap_fill_inserts.py \
            tests/test_stage2_finalizer_packet.py \
            tests/test_stage2_payload_modes.py \
            tests/test_stage2_planning_brief.py \
            2>&1 | tee targeted-failures.txt

      - name: Upload targeted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-2221-targeted-report
          path: targeted-failures.txt
          if-no-files-found: error
          retention-days: 3

      - name: Stop on targeted failures
        if: steps.targeted.outcome != 'success'
        run: exit 1

      - name: Run Ruff
        run: |
          ruff check \
            fightcamp/camp_week_fillers.py \
            fightcamp/gap_fill_inserts.py \
            fightcamp/stage2_finalizer_packet.py \
            tests/test_mandatory_weekly_tactical_watch.py \
            tests/test_stage2_payload_modes.py \
            tests/test_stage2_planning_brief.py

      - name: Run full Python suite
        run: pytest tests/ -q

      - name: Commit validated repair and remove scaffolding
        run: |
          rm -f \
            .github/scripts/fix_pr_2221.py \
            .github/scripts/run_fix_pr_2221.py \
            .github/workflows/fix-pr-2221.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            fightcamp/camp_week_fillers.py \
            fightcamp/gap_fill_inserts.py \
            fightcamp/stage2_finalizer_packet.py \
            tests/test_mandatory_weekly_tactical_watch.py \
            tests/test_stage2_payload_modes.py \
            tests/test_stage2_planning_brief.py \
            .github/scripts/fix_pr_2221.py \
            .github/scripts/run_fix_pr_2221.py \
            .github/workflows/fix-pr-2221.yml
          git commit -m "Harden mandatory weekly Tactical Watch"
          git push origin HEAD:agent/mandatory-weekly-tactical-watch
