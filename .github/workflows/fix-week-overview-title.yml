name: Fix Week Overview Title

on:
  push:
    branches:
      - codex/week-overview-title-only

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/week-overview-title-only
          fetch-depth: 0

      - name: Apply source fix
        run: |
          python - <<'PY'
          from pathlib import Path

          renderer = Path('web/components/structured-plan-renderer.tsx')
          text = renderer.read_text()
          old = '    : baseHeading;'
          new = '    : `Week ${weekNumber}`;'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one fight-camp heading fallback, found {count}')
          renderer.write_text(text.replace(old, new, 1))

          css_path = Path('web/app/plan-display-polish.css')
          css = css_path.read_text()
          marker = '\n/* Keep the selected fight-camp overview title factual: Week X only.\n'
          if marker not in css:
              raise SystemExit('CSS workaround marker not found')
          css_path.write_text(css.split(marker, 1)[0].rstrip() + '\n')

          workflow = Path('.github/workflows/fix-week-overview-title.yml')
          workflow.unlink()
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/components/structured-plan-renderer.tsx web/app/plan-display-polish.css .github/workflows/fix-week-overview-title.yml
          git commit -m "Render fight-camp Week X title in React"
          git push origin HEAD:codex/week-overview-title-only
