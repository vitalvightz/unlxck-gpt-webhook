name: UNLXCK Outreach Migration Read-Only Preflight

on:
  push:
    branches:
      - ops/outreach-counter-preflight
    paths:
      - .github/workflows/install-outreach-worker-ops.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/unlxck_deploy
          chmod 600 ~/.ssh/unlxck_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only log and Notion legacy qualification inventory
        run: |
          set -Eeuo pipefail
          SSH="ssh -i $HOME/.ssh/unlxck_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          $SSH "$HETZNER_USER@$HETZNER_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          BASE=/opt/unlxck/outreach-worker
          ENVFILE=/opt/unlxck/.env.production
          test -d "$BASE/current" || test -L "$BASE/current"
          test -f "$ENVFILE"
          test -f "$BASE/outreach.log"
          echo "worker_current_exists=yes"
          echo "worker_log_bytes=$(stat -c%s "$BASE/outreach.log")"
          echo "ready_event_total=$(grep -Ec '^Ready to Send: .* — score [0-9]+' "$BASE/outreach.log" || true)"
          echo "old_cron_present=$(crontab -l 2>/dev/null | grep -c 'unlxck-outreach' || true)"
          (
            set -a
            . "$ENVFILE"
            set +a
            cd "$BASE/current"
            export PYTHONPATH="$PWD/vendor"
            python3 - <<'PY'
          import collections, os, re
          import requests
          from core import _notion_headers, candidate_from_page
          ds = '08d8b476-129a-42b0-b980-102b08ce4bd8'
          url = f'https://api.notion.com/v1/data_sources/{ds}/query'
          headers = _notion_headers(os.environ['NOTION_API_KEY'])
          results, cursor = [], None
          while True:
              payload = {'page_size': 100}
              if cursor:
                  payload['start_cursor'] = cursor
              r = requests.post(url, headers=headers, json=payload, timeout=40)
              r.raise_for_status()
              d = r.json()
              results.extend(d['results'])
              if not d['has_more']:
                  break
              cursor = d['next_cursor']
              if not cursor:
                  raise RuntimeError('Missing pagination cursor')
          log = open('/opt/unlxck/outreach-worker/outreach.log', encoding='utf-8', errors='replace').read()
          events = re.findall(r'^Ready to Send: (.*?) — score \d+', log, flags=re.MULTILINE)
          frequency = collections.Counter(events)
          stages = collections.Counter()
          rows = []
          for page in results:
              p = page['properties']
              stage = (p.get('Stage (AI Fills First)', {}).get('select') or {}).get('name') or '(blank)'
              if (p.get('Source Detail', {}).get('rich_text') or [{}])[0].get('plain_text') == 'SYSTEM_COUNTER':
                  continue
              stages[stage] += 1
              if stage in {'Ready to Send', 'Contacted', 'Replied', 'Applied', 'Accepted', 'Reserve', 'Activated'}:
                  rows.append(candidate_from_page(page))
          names = collections.Counter(c['candidate'] for c in rows if c['candidate'])
          matched = sum(1 for c in rows if names[c['candidate']] == 1 and frequency[c['candidate']] >= 1)
          print('notion_total_rows=', len(results))
          print('notion_stage_totals=', dict(sorted(stages.items())))
          print('completed_stage_rows=', len(rows))
          print('unique_name_log_matches=', matched)
          print('without_unique_name_log_evidence=', len(rows)-matched)
          print('ready_events_in_log=', len(events))
          PY
          )
          REMOTE
