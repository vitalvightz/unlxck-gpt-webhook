name: Install Forward-only Outreach Counter on Hetzner

on:
  push:
    branches:
      - ops/forward-only-counter-rollout
    paths:
      - ".github/workflows/install-outreach-worker-ops.yml"

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      REMOTE_ARCHIVE: /tmp/unlxck-outreach-${{ github.run_id }}.tgz
      RELEASE_ID: ${{ github.run_id }}

    steps:
      - name: Check out approved outreach worker
        uses: actions/checkout@v4
        with:
          repository: vitalvightz/ig-outreach
          ref: 42851ba17149ed1c2435b6a6bb0fb7e8ce4b9112
          path: outreach-src

      - name: Vendor Python dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Package release
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r outreach-src/requirements.txt -t outreach-src/vendor
          tar --exclude='.git' -czf "$RUNNER_TEMP/unlxck-outreach.tgz" -C outreach-src .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/unlxck_deploy
          chmod 600 ~/.ssh/unlxck_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload worker release
        run: |
          set -Eeuo pipefail
          SSH="ssh -i $HOME/.ssh/unlxck_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          $SSH "$HETZNER_USER@$HETZNER_HOST" "cat > '$REMOTE_ARCHIVE'" < "$RUNNER_TEMP/unlxck-outreach.tgz"

      - name: Validate and activate forward-only counter
        run: |
          set -Eeuo pipefail
          SSH="ssh -i $HOME/.ssh/unlxck_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          $SSH "$HETZNER_USER@$HETZNER_HOST" \
            "ARCHIVE='$REMOTE_ARCHIVE' RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          BASE=/opt/unlxck/outreach-worker
          RELEASES="$BASE/releases"
          RELEASE="$RELEASES/$RELEASE_ID"
          CURRENT="$BASE/current"
          MAIN_ENV=/opt/unlxck/.env.production
          CUTOVER_FILE="$BASE/counter-cutover.env"
          STATE="$BASE/state/daily-counter.sqlite3"
          DATA_SOURCE_ID=08d8b476-129a-42b0-b980-102b08ce4bd8
          
          for cmd in python3 flock crontab tar; do
            command -v "$cmd" >/dev/null || { echo "Missing required command $cmd"; exit 1; }
          done
          test -s "$MAIN_ENV"
          test -L "$CURRENT"
          test ! -e "$RELEASE"
          mkdir -p "$RELEASES" "$BASE/state"
          chmod 700 "$BASE/state"
          umask 077
          
          OLD_CURRENT="$(readlink -f "$CURRENT")"
          OLD_CRON="$BASE/cron-before-$RELEASE_ID"
          crontab -l > "$OLD_CRON" 2>/dev/null || : > "$OLD_CRON"
          if [ -f "$BASE/run.sh" ]; then cp -p "$BASE/run.sh" "$BASE/run.sh.before-$RELEASE_ID"; fi
          if [ -f "$BASE/run-counter.sh" ]; then cp -p "$BASE/run-counter.sh" "$BASE/run-counter.sh.before-$RELEASE_ID"; fi
          ROLLBACK_READY=0
          rollback() {
            status="$?"
            trap - ERR
            if [ "$ROLLBACK_READY" = "1" ]; then
              ln -sfn "$OLD_CURRENT" "$CURRENT"
              if [ -f "$BASE/run.sh.before-$RELEASE_ID" ]; then cp -p "$BASE/run.sh.before-$RELEASE_ID" "$BASE/run.sh"; fi
              if [ -f "$BASE/run-counter.sh.before-$RELEASE_ID" ]; then cp -p "$BASE/run-counter.sh.before-$RELEASE_ID" "$BASE/run-counter.sh"; else rm -f "$BASE/run-counter.sh"; fi
              crontab "$OLD_CRON"
              echo "ROLLED BACK worker release and scheduler after failure"
            fi
            exit "$status"
          }
          trap rollback ERR
          
          mkdir -p "$RELEASE"
          tar -xzf "$ARCHIVE" -C "$RELEASE"
          (
            set -a
            . "$MAIN_ENV"
            set +a
            cd "$RELEASE"
            export PYTHONPATH="$RELEASE/vendor"
            export NOTION_DATA_SOURCE_ID="$DATA_SOURCE_ID"
            python3 -m unittest discover -s tests -q
          )
          if [ ! -s "$CUTOVER_FILE" ]; then
            printf 'export OUTREACH_COUNTER_CUTOVER_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$CUTOVER_FILE"
            chmod 600 "$CUTOVER_FILE"
          fi
          . "$CUTOVER_FILE"
          python3 -c 'import os; from datetime import datetime; s=os.environ["OUTREACH_COUNTER_CUTOVER_AT"]; assert datetime.fromisoformat(s.replace("Z","+00:00")).utcoffset() is not None'
          echo "Forward-only cutover recorded (UTC): $OUTREACH_COUNTER_CUTOVER_AT"
          
          (
            set -a
            . "$MAIN_ENV"
            set +a
            cd "$RELEASE"
            export PYTHONPATH="$RELEASE/vendor"
            export NOTION_DATA_SOURCE_ID="$DATA_SOURCE_ID"
            export OUTREACH_COUNTER_STATE="$STATE"
            export COUNTER_ONLY=true
            export DRY_RUN=true
            export OUTREACH_COUNTER_CUTOVER_AT
            python3 pipeline.py
          )
          echo "Counter read-only preview passed; old prospect stages remain untouched"
          
          cat > "$BASE/run.sh" <<'WORKER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec 9>/tmp/unlxck-outreach.lock
          flock -n 9 || exit 0
          set -a
          . /opt/unlxck/.env.production
          . /opt/unlxck/outreach-worker/counter-cutover.env
          set +a
          export NOTION_DATA_SOURCE_ID=08d8b476-129a-42b0-b980-102b08ce4bd8
          export MAX_CANDIDATES_PER_RUN=100
          export COUNTER_ONLY=false
          export OUTREACH_EXTERNAL_COUNTER=true
          export DRY_RUN=false
          cd /opt/unlxck/outreach-worker/current
          export PYTHONPATH="$PWD/vendor"
          exec python3 pipeline.py
          WORKER
          cat > "$BASE/run-counter.sh" <<'COUNTER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec 8>/tmp/unlxck-outreach-counter.lock
          flock -n 8 || exit 0
          set -a
          . /opt/unlxck/.env.production
          . /opt/unlxck/outreach-worker/counter-cutover.env
          set +a
          export NOTION_DATA_SOURCE_ID=08d8b476-129a-42b0-b980-102b08ce4bd8
          export OUTREACH_COUNTER_STATE=/opt/unlxck/outreach-worker/state/daily-counter.sqlite3
          export COUNTER_ONLY=true
          export DRY_RUN=false
          cd /opt/unlxck/outreach-worker/current
          export PYTHONPATH="$PWD/vendor"
          exec python3 pipeline.py
          COUNTER
          chmod 700 "$BASE/run.sh" "$BASE/run-counter.sh"
          touch "$BASE/outreach.log" "$BASE/counter.log"
          chmod 600 "$BASE/outreach.log" "$BASE/counter.log"
          ROLLBACK_READY=1
          ln -sfn "$RELEASE" "$CURRENT"
          
          "$BASE/run-counter.sh"
          
          NEW_CRON="$(mktemp)"
          {
            cat "$OLD_CRON" | awk '
              BEGIN {skip=0}
              /^# BEGIN UNLXCK OUTREACH WORKER$/ {skip=1; next}
              /^# END UNLXCK OUTREACH WORKER$/ {skip=0; next}
              skip==0 {print}
            '
            echo "# BEGIN UNLXCK OUTREACH WORKER"
            echo "*/2 * * * 1-5 $BASE/run.sh >> $BASE/outreach.log 2>&1"
            echo "*/2 * * * * $BASE/run-counter.sh >> $BASE/counter.log 2>&1"
            echo "# END UNLXCK OUTREACH WORKER"
          } > "$NEW_CRON"
          crontab "$NEW_CRON"
          rm -f "$NEW_CRON"
          trap - ERR
          echo "FORWARD_ONLY_DEPLOY_SUCCESS release=$RELEASE_ID"
          echo "cutover=$OUTREACH_COUNTER_CUTOVER_AT"
          crontab -l | sed -n '/BEGIN UNLXCK OUTREACH WORKER/,/END UNLXCK OUTREACH WORKER/p'
          echo "latest counter output:"
          tail -n 8 "$BASE/counter.log" || true
          REMOTE

      - name: Remove uploaded release archive
        if: always()
        run: |
          SSH="ssh -i $HOME/.ssh/unlxck_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          $SSH "$HETZNER_USER@$HETZNER_HOST" "rm -f '$REMOTE_ARCHIVE'" || true
