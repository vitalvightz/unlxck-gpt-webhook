name: One-shot Cubic 2419 fix

"on":
  push:
    branches:
      - codex/remove-stage1-athlete-fallback
    paths:
      - ".github/workflows/one-shot-cubic-2419.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-stage1-athlete-fallback
          fetch-depth: 0
      - name: Apply reviewed fixes and commit
        shell: bash
        run: |
          echo '' | base64 -d | python
          rm .github/workflows/one-shot-cubic-2419.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/stage2_automation.py tests/test_generation_runtime.py tests/test_stage2_no_stage1_fallback.py .github/workflows/one-shot-cubic-2419.yml
          git diff --cached --check
          git commit -m "Address Cubic review findings"
          git push origin HEAD:codex/remove-stage1-athlete-fallback
