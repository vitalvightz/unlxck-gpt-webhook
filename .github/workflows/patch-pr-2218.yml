name: Patch PR 2218 boundary

on:
  push:
    branches:
      - "claude/hard-sparring-deload-timing-4ianz9"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: claude/hard-sparring-deload-timing-4ianz9
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply boundary fix
        run: python tools/patch_pr_2218.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run focused regression suite
        run: pytest -q tests/test_late_fight_calendar_regression.py tests/test_countdown_calendar_spine.py

      - name: Commit fix and remove temporary patch files
        run: |
          rm .github/workflows/patch-pr-2218.yml tools/patch_pr_2218.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fightcamp/stage2_payload_late_fight.py tests/test_late_fight_calendar_regression.py .github/workflows/patch-pr-2218.yml tools/patch_pr_2218.py
          git commit -m "Fix D-21 bridge sparring boundary"
          git push origin HEAD:claude/hard-sparring-deload-timing-4ianz9
