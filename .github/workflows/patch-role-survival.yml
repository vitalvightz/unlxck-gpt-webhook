name: Patch role-specific Stage 2 survival

on:
  push:
    branches:
      - fix/gap-fill-available-days
    paths:
      - .github/patch_role_survival.py
      - .github/workflows/patch-role-survival.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Patch role-aware survival guard
        run: python .github/patch_role_survival.py
      - name: Run focused regressions
        run: python -m pytest -q tests/test_stage2_required_gap_fill_survival.py tests/test_late_fight_availability_contract.py
      - name: Remove temporary patch files
        run: rm .github/patch_role_survival.py .github/workflows/patch-role-survival.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fightcamp/stage2_pipeline.py tests/test_stage2_required_gap_fill_survival.py .github
          git commit -m "Verify required late-fight roles survive rendering"
          git push
