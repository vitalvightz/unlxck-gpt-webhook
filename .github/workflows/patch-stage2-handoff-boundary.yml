name: Patch Stage 2 handoff boundary

on:
  push:
    branches:
      - agent/preserve-athlete-tactical-style-labels
    paths:
      - .github/workflows/patch-stage2-handoff-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-athlete-tactical-style-labels
      - name: Move sanitizer to handoff boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          payload_path = Path("fightcamp/stage2_payload.py")
          payload = payload_path.read_text()
          boundary_import = "from .stage2_llm_boundary import build_stage2_llm_planning_brief\n"
          finalizer_import = "from .stage2_finalizer_packet import build_stage2_finalizer_packet\n"
          if boundary_import not in payload:
              if finalizer_import not in payload:
                  raise SystemExit("stage2 finalizer import anchor not found")
              payload = payload.replace(
                  finalizer_import,
                  finalizer_import + boundary_import,
                  1,
              )

          tree = ast.parse(payload)
          handoff = next(
              (
                  node
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == "build_stage2_handoff_text"
              ),
              None,
          )
          if handoff is None or not handoff.body:
              raise SystemExit("build_stage2_handoff_text not found")

          insertion_line = handoff.body[0].lineno
          first = handoff.body[0]
          if (
              isinstance(first, ast.Expr)
              and isinstance(first.value, ast.Constant)
              and isinstance(first.value.value, str)
          ):
              insertion_line = first.end_lineno + 1

          guard_line = "    planning_brief = build_stage2_llm_planning_brief(planning_brief)\n"
          function_slice = payload.splitlines(True)[handoff.lineno - 1 : handoff.end_lineno]
          if not any("build_stage2_llm_planning_brief(planning_brief)" in line for line in function_slice):
              lines = payload.splitlines(True)
              lines.insert(insertion_line - 1, guard_line)
              payload = "".join(lines)
          payload_path.write_text(payload)

          rendering_path = Path("fightcamp/plan_pipeline_rendering.py")
          rendering = rendering_path.read_text()
          rendering = rendering.replace(
              "from .stage2_llm_boundary import build_stage2_llm_planning_brief\n",
              "",
              1,
          )
          rendering = rendering.replace(
              "    llm_planning_brief = build_stage2_llm_planning_brief(planning_brief)\n",
              "",
              1,
          )
          rendering = rendering.replace(
              "        planning_brief=llm_planning_brief,",
              "        planning_brief=planning_brief,",
              1,
          )
          if "llm_planning_brief" in rendering:
              raise SystemExit("stale llm_planning_brief reference remains")
          rendering_path.write_text(rendering)
          PY
      - name: Verify syntax
        run: python -m py_compile fightcamp/stage2_payload.py fightcamp/plan_pipeline_rendering.py
      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-stage2-handoff-boundary.yml
          git add fightcamp/stage2_payload.py fightcamp/plan_pipeline_rendering.py
          git commit -m "Enforce tactical identity at Stage 2 handoff"
          git push origin HEAD:agent/preserve-athlete-tactical-style-labels
