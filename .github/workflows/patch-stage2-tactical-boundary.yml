name: Patch Stage 2 tactical boundary

on:
  push:
    branches:
      - agent/preserve-athlete-tactical-style-labels
    paths:
      - .github/workflows/patch-stage2-tactical-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preserve-athlete-tactical-style-labels
      - name: Apply boundary projection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("fightcamp/plan_pipeline_rendering.py")
          text = path.read_text()

          weight_import = "from .weight_cut import parse_optional_weight_value"
          boundary_import = "from .stage2_llm_boundary import build_stage2_llm_planning_brief"
          if boundary_import not in text:
              if weight_import not in text:
                  raise SystemExit("weight-cut import anchor not found")
              text = text.replace(
                  weight_import,
                  boundary_import + "\n" + weight_import,
                  1,
              )

          handoff_call = "    stage2_handoff_text = build_stage2_handoff_text("
          handoff_index = text.rfind(handoff_call)
          if handoff_index < 0:
              raise SystemExit("Stage 2 handoff call not found")

          prefix = text[:handoff_index]
          suffix = text[handoff_index:]
          if "llm_planning_brief = build_stage2_llm_planning_brief(planning_brief)" not in prefix[-300:]:
              prefix += "    llm_planning_brief = build_stage2_llm_planning_brief(planning_brief)\n"

          old_arg = "        planning_brief=planning_brief,"
          new_arg = "        planning_brief=llm_planning_brief,"
          if old_arg not in suffix:
              raise SystemExit("Stage 2 planning-brief argument not found")
          suffix = suffix.replace(old_arg, new_arg, 1)

          path.write_text(prefix + suffix)
          PY
      - name: Remove temporary patch workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-stage2-tactical-boundary.yml
          git add fightcamp/plan_pipeline_rendering.py
          git commit -m "Wire tactical identity sanitizer into Stage 2 handoff"
          git push origin HEAD:agent/preserve-athlete-tactical-style-labels
