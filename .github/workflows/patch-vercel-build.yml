name: One-shot Vercel build patch

on:
  push:
    branches:
      - codex/footwork-bank-style-coverage

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'vitalvightz/unlxck-gpt-webhook'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/footwork-bank-style-coverage
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Vercel build blockers
        run: |
          python - <<'PY'
          from pathlib import Path

          intake = Path("web/components/plan-intake-form.tsx")
          text = intake.read_text(encoding="utf-8")
          broken = '''                      "Select days that can carry light technical combat: pads, drills, shadowboxing, movement, or non-hard contact. The app may still place low-noise support work here if it fits. Do not include hard sparring or fight day."
                  </p>'''
          fixed = '''                      "Select days that can carry light technical combat: pads, drills, shadowboxing, movement, or non-hard contact. The app may still place low-noise support work here if it fits. Do not include hard sparring or fight day."}
                  </p>'''
          if broken in text:
              text = text.replace(broken, fixed, 1)
              intake.write_text(text, encoding="utf-8")
          elif fixed not in text:
              raise SystemExit("Expected support_work_days helper text block not found")

          for file_name in ("web/package.json", "web/package-lock.json"):
              path = Path(file_name)
              content = path.read_text(encoding="utf-8")
              updated = content.replace('"node": "20.x"', '"node": "24.x"')
              if updated != content:
                  path.write_text(updated, encoding="utf-8")

          workflow = Path(".github/workflows/patch-vercel-build.yml")
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/components/plan-intake-form.tsx web/package.json web/package-lock.json .github/workflows/patch-vercel-build.yml
          git commit -m "[codex] fix vercel build blockers"
          git push origin HEAD:codex/footwork-bank-style-coverage
