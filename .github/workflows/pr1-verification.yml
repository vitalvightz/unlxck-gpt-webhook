name: PR1 Integration Verification

on:
  push:
    branches:
      - codex/repair-conditioning-render-retry
    paths:
      - .github/workflows/pr1-verification.yml
      - tools/pr1_apply.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/repair-conditioning-render-retry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Apply existing PR1 integration
        run: python tools/pr1_apply.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile and lint
        run: |
          python -m compileall -q fightcamp api
          ruff check fightcamp/conditioning_render_repair.py fightcamp/stage2_pipeline.py fightcamp/stage2_policy.py fightcamp/stage2_repair.py fightcamp/stage2_payload.py api/stage2_automation.py
      - name: Run focused regression suite
        run: pytest -q tests/test_conditioning_render_membership.py tests/test_closed_session_composition.py tests/test_stage2_repair.py tests/test_stage2_automation.py
      - name: Preserve integration and test evidence
        if: always()
        run: |
          mkdir -p /tmp/pr1-evidence
          git diff --binary > /tmp/pr1-evidence/integration.patch
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('/tmp/pr1-evidence/source')
          for name in ('fightcamp/conditioning_render_repair.py', 'fightcamp/stage2_pipeline.py', 'fightcamp/stage2_policy.py', 'fightcamp/stage2_repair.py', 'fightcamp/stage2_payload.py', 'api/stage2_automation.py'):
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(name, target)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1-integration-evidence
          path: /tmp/pr1-evidence
          retention-days: 3
