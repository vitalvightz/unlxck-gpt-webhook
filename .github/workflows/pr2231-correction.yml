name: PR2231 focused correction

on:
  push:
    branches:
      - fix/late-fight-availability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/late-fight-availability
          fetch-depth: 0

      - name: Apply focused correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_function(text: str, name: str, replacement: str) -> str:
              pattern = rf"^def {re.escape(name)}\(.*?(?=^def |\Z)"
              updated, count = re.subn(
                  pattern,
                  replacement.rstrip() + "\n\n\n",
                  text,
                  count=1,
                  flags=re.M | re.S,
              )
              if count != 1:
                  raise RuntimeError(f"expected one function {name}, replaced {count}")
              return updated

          # Keep PR2 about calendar availability. Undo the tactical-support
          # redesign that accidentally crept into this branch.
          gap_path = Path("fightcamp/gap_fill_inserts.py")
          text = gap_path.read_text()
          tactical_same_day = '''    if role_key in TACTICAL_INSERTS and any(
              int(previous) == insert_offset
              for tactical_key in TACTICAL_INSERTS
              for previous in usage_ledger.get("role_key_offsets", {}).get(tactical_key, [])
          ):
              return True
'''
          if tactical_same_day not in text:
              raise RuntimeError("tactical same-day repeat block not found")
          text = text.replace(tactical_same_day, "", 1)

          text = replace_function(text, "_ensure_weekly_tactical_watches", '''def _ensure_weekly_tactical_watches(
              session_sequence: list[dict[str, Any]],
              athlete_model: dict[str, Any],
              countdown_map: dict[str, str],
              usage_ledger: dict[str, Any],
          ) -> list[dict[str, Any]]:
              """Add one banked Tactical Watch per visible seven-day countdown segment.

              The watch always shares a day already present in the countdown sequence, so
              this requirement adds a zero-load card, not a new training day.
              """
              if not _is_fight_sport(athlete_model):
                  return []

              additions: list[dict[str, Any]] = []
              segments = sorted(
                  {
                      _segment_for_offset(offset)
                      for role in session_sequence
                      if (offset := _role_offset(role)) is not None and 0 < offset <= 21
                  }
              )
              used_watch_keys = usage_ledger.setdefault("used_tactical_watch_keys", set())

              for segment in segments:
                  segment_roles = [
                      role
                      for role in session_sequence
                      if (offset := _role_offset(role)) is not None
                      and offset > 0
                      and _segment_for_offset(offset) == segment
                  ]
                  watch = next(
                      (
                          role
                          for role in segment_roles
                          if str(role.get("role_key") or "") == "tactical_watch"
                      ),
                      None,
                  )
                  if watch is None:
                      anchor = max(segment_roles, key=lambda role: int(_role_offset(role) or 0))
                      offset = int(_role_offset(anchor) or 0)
                      weekday = str(
                          anchor.get("scheduled_day_hint")
                          or anchor.get("real_weekday")
                          or countdown_map.get(f"D-{offset}")
                          or ""
                      ).strip() or None
                      watch = _build_insert_role(
                          "tactical_watch",
                          athlete_model,
                          offset,
                          weekday,
                          usage_ledger=usage_ledger,
                      )
                      additions.append(watch)
                      _record_insert_usage(usage_ledger, "tactical_watch", offset)
                  elif not watch.get("tactical_watch_key"):
                      offset = int(_role_offset(watch) or 0)
                      _apply_bank_watch(
                          watch,
                          athlete_model,
                          phase=_watch_phase_for_offset(athlete_model, offset),
                          used_watch_keys=used_watch_keys,
                      )

                  watch["mandatory_tactical_watch"] = True
                  watch["weekly_requirement"] = "fight_tactical_watch"
                  watch["governance"] = {
                      **dict(watch.get("governance") or {}),
                      "mandatory": True,
                      "meaningful_stress": False,
                  }

              return additions''')
          gap_path.write_text(text)

          # Declared light combat is coach-owned context, not an app-owned
          # technical_touch_day. Use the existing canonical light_combat_day key.
          late_path = Path("fightcamp/stage2_payload_late_fight.py")
          text = late_path.read_text()

          old = '    return str(role_key or "").strip().lower() not in {"hard_sparring_day"}\n'
          new = '    return str(role_key or "").strip().lower() not in {"hard_sparring_day", "light_combat_day"}\n'
          if old not in text:
              raise RuntimeError("app-owned role predicate marker not found")
          text = text.replace(old, new, 1)

          day_slots = '''_DAY_SLOT_SESSION_ROLE_KEYS = _DAY_EXCLUSIVE_STRESSOR_ROLE_KEYS | {
              "hard_sparring_day",
              "technical_touch_day",
              "fight_week_freshness_day",
          }'''
          day_slots_new = '''_DAY_SLOT_SESSION_ROLE_KEYS = _DAY_EXCLUSIVE_STRESSOR_ROLE_KEYS | {
              "hard_sparring_day",
              "light_combat_day",
              "technical_touch_day",
              "fight_week_freshness_day",
          }'''
          if day_slots not in text:
              raise RuntimeError("day-slot role set marker not found")
          text = text.replace(day_slots, day_slots_new, 1)

          old = '        is_light_context = bool(session.get("coach_owned")) and role_key == "technical_touch_day"\n'
          new = '        is_light_context = bool(session.get("coach_owned")) and role_key == "light_combat_day"\n'
          if old not in text:
              raise RuntimeError("light-context predicate marker not found")
          text = text.replace(old, new, 1)

          old = '''        if role.get("coach_owned") is True
              and str(role.get("role_key") or "").strip().lower() == "technical_touch_day"
          }'''
          new = '''        if role.get("coach_owned") is True
              and str(role.get("role_key") or "").strip().lower() == "light_combat_day"
          }'''
          if old not in text:
              raise RuntimeError("existing support ownership marker not found")
          text = text.replace(old, new, 1)

          old = '''            "category": "technical",
              "role_key": "technical_touch_day",
              "preferred_pool": "declared_support_work_days",'''
          new = '''            "category": "technical",
              "role_key": "light_combat_day",
              "preferred_pool": "declared_support_work_days",'''
          if old not in text:
              raise RuntimeError("declared light-combat role marker not found")
          text = text.replace(old, new, 1)
          late_path.write_text(text)

          test_path = Path("tests/test_late_fight_availability_contract.py")
          test_text = test_path.read_text()
          test_text = test_text.replace(
              'and role.get("role_key") == "technical_touch_day"',
              'and role.get("role_key") == "light_combat_day"',
          )
          test_path.write_text(test_text)
          PY

          git diff --check
          git config user.name "unlxck-pr-patcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fightcamp/gap_fill_inserts.py fightcamp/stage2_payload_late_fight.py tests/test_late_fight_availability_contract.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix PR2231 scope regressions"
          git push origin HEAD:fix/late-fight-availability
