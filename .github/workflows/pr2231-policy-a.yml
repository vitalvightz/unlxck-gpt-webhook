name: PR2231 Policy A Patch

on:
  push:
    branches:
      - "fix/late-fight-availability"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/late-fight-availability
          fetch-depth: 0
      - name: Apply availability-wins policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          stage2 = Path('fightcamp/stage2_payload_late_fight.py')
          text = stage2.read_text()

          old = '    if required_roles and not best_roles:\n'
          new = '    if required_roles and not best_roles and eligible_countdown_labels:\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one required-role warning guard, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        if role.get("stress_class") == "meaningful_stress" and isinstance(max_meaningful_stress_exposures, int):\n            reason = f"Meaningful stress is capped at {max_meaningful_stress_exposures} in this window, so higher-priority stress roles kept the slot."\n        elif role.get("role_key") == "technical_touch_day":\n'''
          new = '''        if not eligible_countdown_labels:\n            reason = "No declared training availability in this countdown window."\n        elif role.get("stress_class") == "meaningful_stress" and isinstance(max_meaningful_stress_exposures, int):\n            reason = f"Meaningful stress is capped at {max_meaningful_stress_exposures} in this window, so higher-priority stress roles kept the slot."\n        elif role.get("role_key") == "technical_touch_day":\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one suppression block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          stage2.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr2231-policy-a.yml
          git add fightcamp/stage2_payload_late_fight.py
          git diff --cached --check
          git commit -m "Let availability win empty late-fight windows"
          git push origin HEAD:fix/late-fight-availability
