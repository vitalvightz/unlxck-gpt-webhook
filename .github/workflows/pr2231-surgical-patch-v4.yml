name: PR2231 surgical patch v4

on:
  push:
    branches:
      - fix/late-fight-availability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/late-fight-availability
          fetch-depth: 0

      - name: Run corrected v3 production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr2231-surgical-patch-v3.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          # v3 expected four inner comprehension lines; the actual nearest-day
          # mapping block has three. Correct only that extraction-time pattern.
          needle = r'(?:        .*\n){4}    \}\n'
          replacement = r'(?:        .*\n){3}    \}\n'
          if needle not in script:
              raise RuntimeError('v3 bridge regex marker not found')
          script = script.replace(needle, replacement, 1)
          exec(compile(script, '<pr2231-v3-corrected>', 'exec'))
          PY

          git diff --check
          git status --short

      - name: Commit fix and remove temporary patch workflows
        shell: bash
        run: |
          git config user.name "unlxck-pr-patcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr2231-surgical-patch.yml
          git rm .github/workflows/pr2231-surgical-patch-v2.yml
          git rm .github/workflows/pr2231-surgical-patch-v3.yml
          git rm .github/workflows/pr2231-surgical-patch-v4.yml
          git add fightcamp tests
          git commit -m "Fix late-fight availability and combat-day ownership"
          git push origin HEAD:fix/late-fight-availability
