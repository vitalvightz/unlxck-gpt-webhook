name: PR 2428 edge fix

on:
  push:
    branches:
      - codex/dynamic-sparring-safety
    paths:
      - .github/workflows/pr2428-edge-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dynamic-sparring-safety
          fetch-depth: 0

      - name: Patch restore guard and null-safe injury flags
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("fightcamp/stage2_payload_late_fight.py")
          text = path.read_text()
          old = '''        and cap == rules.get("hard_sparring_cap_default")\n        and declared > cap\n    ):'''
          new = '''        and cap == rules.get("hard_sparring_cap_default")\n        and "serious_contact_safety" not in set(rules.get("reason_codes", []))\n        and declared > cap\n    ):'''
          if text.count(old) != 1:
              raise SystemExit(f"bridge restore guard match count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1))

          path = Path("fightcamp/sparring_readiness.py")
          text = path.read_text()
          text = text.replace('row.get("flags", []) if str(value).strip()', '(row.get("flags") or []) if str(value).strip()')
          text = text.replace('row.get("blocked_training_tags", []) if str(value).strip()', '(row.get("blocked_training_tags") or []) if str(value).strip()')
          path.write_text(text)
          PY
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fightcamp/stage2_payload_late_fight.py fightcamp/sparring_readiness.py
          git commit -m "Guard blocked sparring from declaration restore"
          git push origin HEAD:codex/dynamic-sparring-safety
