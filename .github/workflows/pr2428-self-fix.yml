name: PR 2428 audit fix

on:
  push:
    branches:
      - codex/dynamic-sparring-safety
    paths:
      - .github/workflows/pr2428-self-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dynamic-sparring-safety
          fetch-depth: 0

      - name: Apply audited fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str, minimum: int = 1) -> int:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} matches, found {count}")
              p.write_text(text.replace(old, new))
              return count

          # 1) Canonical hard-contact wording must remain hard. "controlled" is
          # part of Unlxck's production hard-sparring label, while explicit
          # light/technical/reduced/managed wording remains a downgrade.
          replace_once(
              "api/services/sparring_readiness_snapshot.py",
              '''                if completion.get("status") == "done" and re.search(r"\\bhard spar(?:ring)?\\b", text) and not re.search(r"\\b(?:no|avoid) hard\\b|\\b(?:light|technical|controlled|reduced|managed)\\b", text):\n                    return "hard"\n                return "reduced"''',
              '''                effective_load = str(session.get("effective_load") or "").strip().lower()\n                if completion.get("status") == "done" and effective_load == "hard":\n                    return "hard"\n                if effective_load in {"technical", "reduced", "light", "none"}:\n                    return "reduced" if effective_load != "none" else "none"\n                if (\n                    completion.get("status") == "done"\n                    and re.search(r"\\bhard spar(?:ring)?\\b", text)\n                    and not re.search(r"\\b(?:no|avoid) hard\\b|\\b(?:light|technical|reduced|managed)\\b", text)\n                ):\n                    return "hard"\n                return "reduced"''',
          )

          # 2) Convert persisted serious injury evidence into durable derived flags
          # before the raw seven-day snapshot is discarded from the athlete model.
          replace_once(
              "fightcamp/sparring_readiness.py",
              '''    if any(row.get("surface_class") == "surface_no_contact" for row in context.get("active_injuries", [])):\n        flags.add("medical_contact_restriction")\n    if context.get("reduced_contact_requested") is True:''',
              '''    active_injuries = context.get("active_injuries", [])\n    if any(row.get("surface_class") == "surface_no_contact" for row in active_injuries):\n        flags.add("medical_contact_restriction")\n    serious_categories = {"concussion", "suspected_concussion", "acute_nerve_issue", "nerve_involvement"}\n    serious_flag_names = {\n        "suspected_concussion", "concussion_symptoms", "neurological_symptoms",\n        "recent_ko", "recent_head_injury", "medical_contact_restriction", "no_contact",\n    }\n    blocked_contact_tags = {"contact", "sparring", "hard_contact", "head_impact"}\n    for row in active_injuries:\n        category = str(row.get("triage_category") or row.get("injury_type") or "").strip().lower()\n        row_flags = {str(value).strip().lower() for value in row.get("flags", []) if str(value).strip()}\n        blocked_tags = {str(value).strip().lower() for value in row.get("blocked_training_tags", []) if str(value).strip()}\n        description = str(row.get("description") or "").strip().lower()\n        if (\n            category in serious_categories\n            or row_flags & serious_flag_names\n            or any(token in description for token in ("concussion", "knocked out", "knockout", "neurological"))\n        ):\n            flags.add("suspected_concussion")\n        if blocked_tags & blocked_contact_tags:\n            flags.add("medical_contact_restriction")\n    if context.get("reduced_contact_requested") is True:''',
          )

          # Raw check-ins/completions/injury rows are generation-time evidence only.
          replace_once(
              "fightcamp/athlete_model.py",
              '''        "sparring_readiness": dict(training_context.sparring_readiness),\n        "has_active_injury": has_active_injury,''',
              '''        "has_active_injury": has_active_injury,''',
          )

          # 3) Bridge rules may receive the full canonical athlete model. When they
          # do, use its readiness/contact flags rather than reconstructing risk from
          # fatigue/cut/injury scalars only.
          replace_once(
              "fightcamp/stage2_payload_late_fight.py",
              '''    hard_sparring_days_declared: Any = 0,\n    athlete_pct_above_class: float | None = None,''',
              '''    hard_sparring_days_declared: Any = 0,\n    athlete_model: dict[str, Any] | None = None,\n    athlete_pct_above_class: float | None = None,''',
          )
          replace_once(
              "fightcamp/stage2_payload_late_fight.py",
              '''    baseline = _bridge_baseline(state, days_until_fight)\n    sparring_cutoff = hard_sparring_cutoff({\n        "fatigue": fatigue_norm, "cut_severity_bucket": bucket_norm,\n        "readiness_flags": ["moderate_injury"] if injury_norm != "full_plan" else [],\n    })\n    if state == TIMING_STATE_BRIDGE and days is not None and days <= sparring_cutoff:\n        baseline["hard_sparring_cap_default"] = 0''',
              '''    baseline = _bridge_baseline(state, days_until_fight)\n    cutoff_snapshot = dict(athlete_model or {})\n    cutoff_snapshot.setdefault("fatigue", fatigue_norm)\n    cutoff_snapshot.setdefault("cut_severity_bucket", bucket_norm)\n    cutoff_flags = set(clean_list(cutoff_snapshot.get("readiness_flags", [])))\n    if injury_norm != "full_plan":\n        cutoff_flags.add("moderate_injury")\n    cutoff_snapshot["readiness_flags"] = sorted(cutoff_flags)\n    sparring_cutoff = hard_sparring_cutoff(cutoff_snapshot)\n    contact_blocked = bool(contact_safety_reasons(cutoff_snapshot))\n    if contact_blocked or (state == TIMING_STATE_BRIDGE and days is not None and days <= sparring_cutoff):\n        baseline["hard_sparring_cap_default"] = 0''',
          )
          replace_once(
              "fightcamp/stage2_payload_late_fight.py",
              '''        "unsafe_weight_flag": unsafe,\n    }\n    rules = _bridge_apply_injury(rules, injury_norm)''',
              '''        "unsafe_weight_flag": unsafe,\n    }\n    if contact_blocked:\n        rules["reason_codes"].append("serious_contact_safety")\n    rules = _bridge_apply_injury(rules, injury_norm)''',
          )

          role_map_path = Path("fightcamp/stage2_role_map.py")
          role_map = role_map_path.read_text()
          bridge_tail = '''        hard_sparring_days_declared=len(clean_list(athlete_model.get("hard_sparring_days", []))),\n    )'''
          bridge_tail_new = '''        hard_sparring_days_declared=len(clean_list(athlete_model.get("hard_sparring_days", []))),\n        athlete_model=athlete_model,\n    )'''
          bridge_count = role_map.count(bridge_tail)
          if bridge_count < 1:
              raise SystemExit(f"stage2_role_map.py: expected bridge call using athlete_model, found {bridge_count}")
          role_map_path.write_text(role_map.replace(bridge_tail, bridge_tail_new))

          # Tests: production label, durable derived state/no raw history, canonical
          # bridge risk state, and contact-blocked bridge behavior.
          boundary = Path("tests/test_sparring_readiness_boundary.py")
          text = boundary.read_text()
          text = text.replace('''    assert not model["sparring_readiness"]["unavailable"]\n    assert hard_sparring_risk_state(model) == "ELEVATED"''', '''    assert "sparring_readiness" not in model\n    assert hard_sparring_risk_state(model) == "ELEVATED"''')
          text = text.replace('''    assert "list_today_checkins" in model["sparring_readiness"]["unavailable"]\n    assert hard_sparring_cutoff(model) == 17''', '''    assert "sparring_history_unavailable" in model["readiness_flags"]\n    assert "sparring_readiness" not in model\n    assert hard_sparring_cutoff(model) == 17''')
          text = text.replace('''    assert "completion_plan" in model["sparring_readiness"]["unavailable"]\n    assert model["sparring_readiness"]["sessions"][0]["contact_load"] == "unknown"\n    assert hard_sparring_cutoff(model) == 17''', '''    assert "sparring_history_unavailable" in model["readiness_flags"]\n    assert "sparring_readiness" not in model\n    assert hard_sparring_cutoff(model) == 17''')
          addition = '''\n\ndef test_canonical_controlled_hard_contact_counts_as_hard(monkeypatch):\n    store = FakeStore()\n    for age in [0, 2]:\n        _session(store, age, title="Hard sparring — controlled hard contact")\n    model = _model(store, monkeypatch)\n    assert "high_contact_load" in model["readiness_flags"]\n    assert hard_sparring_cutoff(model) == 17\n\n\ndef test_raw_sparring_history_is_not_copied_into_athlete_model(monkeypatch):\n    store = FakeStore()\n    for age in [0, 1, 2]:\n        _checkin(store, age)\n    model = _model(store, monkeypatch)\n    assert "poor_recovery" in model["readiness_flags"]\n    assert "sparring_readiness" not in model\n'''
          if "test_canonical_controlled_hard_contact_counts_as_hard" not in text:
              text += addition
          boundary.write_text(text)

          bridge_tests = Path("tests/test_bridge_rules.py")
          text = bridge_tests.read_text()
          addition = '''\n\ndef test_bridge_uses_full_canonical_sparring_risk_state():\n    athlete_model = {\n        "readiness_flags": ["high_contact_load"],\n        "fatigue": "low",\n        "cut_severity_bucket": "low",\n    }\n    result = compute_bridge_rules(\n        days_until_fight=16,\n        sport="boxing",\n        fatigue="low",\n        weight_cut_bucket="low",\n        injury_mode="full_plan",\n        hard_sparring_days_declared=1,\n        athlete_model=athlete_model,\n    )\n    assert result["hard_sparring_cutoff_d_day"] == 17\n    assert result["hard_sparring_cap"] == 0\n\n\ndef test_bridge_blocks_hard_contact_when_canonical_state_is_contact_blocked():\n    athlete_model = {\n        "readiness_flags": ["medical_contact_restriction"],\n        "fatigue": "low",\n        "cut_severity_bucket": "low",\n    }\n    result = compute_bridge_rules(\n        days_until_fight=20,\n        sport="boxing",\n        fatigue="low",\n        weight_cut_bucket="low",\n        injury_mode="full_plan",\n        hard_sparring_days_declared=1,\n        athlete_model=athlete_model,\n    )\n    assert result["hard_sparring_cap"] == 0\n    assert "serious_contact_safety" in result["reason_codes"]\n'''
          if "test_bridge_uses_full_canonical_sparring_risk_state" not in text:
              text += addition
          bridge_tests.write_text(text)

          docs = Path("docs/hard_sparring_cutoff.md")
          text = docs.read_text()
          text = text.replace(
              "`PlanInput` and\n`TrainingContext` carry it into the canonical athlete model. This does not write\nhistory back into intake or change the database schema.",
              "`PlanInput` and `TrainingContext` carry it only long enough to derive canonical\nreadiness/contact flags. The raw seven-day snapshot is not copied into the athlete\nmodel or persisted planning brief. This does not write history back into intake or\nchange the database schema.",
          )
          docs.write_text(text)
          PY

          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/services/sparring_readiness_snapshot.py fightcamp/sparring_readiness.py fightcamp/athlete_model.py fightcamp/stage2_payload_late_fight.py fightcamp/stage2_role_map.py tests/test_sparring_readiness_boundary.py tests/test_bridge_rules.py docs/hard_sparring_cutoff.md
          git commit -m "Fix sparring risk audit findings"
          git push origin HEAD:codex/dynamic-sparring-safety
