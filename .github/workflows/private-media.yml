name: Private media security
on:
  pull_request:
    paths:
      - 'api/**private_media*.py'
      - 'media_processor/**'
      - 'tools/*private_media*'
      - 'tools/*community_exercise*'
      - 'api/**community*.py'
      - 'supabase/migrations/*community_exercise*.sql'
      - 'supabase/migrations/*community_review*.sql'
      - 'supabase/migrations/*private_exercise_media.sql'
      - 'supabase/migrations/*private_media*.sql'
      - '.github/workflows/private-media.yml'
jobs:
  processing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build fresh malware scanner and decoder
        run: docker build --pull -t unlxck-private-media ./media_processor
      - name: Exercise isolated processing with real fixtures
        run: python tools/test_private_media_processor.py --image "$(docker image inspect unlxck-private-media --format '{{.Id}}')"
  storage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
      - name: Install isolated PostgreSQL runtime outside the checkout
        run: npm install --prefix "$RUNNER_TEMP/media-sql" @electric-sql/pglite@0.5.8
      - name: Check ownership, storage RLS, quotas and retention
        run: |
          node tools/test_private_media_migration.mjs "$RUNNER_TEMP/media-sql"
          node tools/test_community_exercise_migration.mjs "$RUNNER_TEMP/media-sql"
