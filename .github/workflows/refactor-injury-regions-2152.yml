name: Refactor injury regions for PR 2152

on:
  push:
    branches:
      - claude/year-rupture-leg-injury-opyabn

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply refactor
        run: python tools/refactor_injury_regions_2152.py

      - name: Validate generated Python
        run: python -m py_compile fightcamp/injury_body_region.py api/services/today_service.py

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use backend injury regions for safe sessions"
          git push origin HEAD:${GITHUB_REF_NAME}
