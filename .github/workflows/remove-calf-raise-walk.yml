name: Remove Calf Raise Walk

on:
  push:
    branches:
      - chore/remove-calf-raise-walk

permissions:
  contents: write

jobs:
  remove-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove exact conditioning-bank entry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/conditioning_bank.json")
          text = path.read_text()
          marker = '    "name": "Calf Raise Walk",'
          assert text.count(marker) == 1, "Expected exactly one Calf Raise Walk entry"

          marker_at = text.index(marker)
          start = text.rfind("  {\n", 0, marker_at)
          end = text.find("\n  },", marker_at)
          assert start >= 0 and end >= 0, "Could not isolate Calf Raise Walk object"
          end += len("\n  },")
          if text[end:end + 2] == "\n\n":
              end += 2
          elif text[end:end + 1] == "\n":
              end += 1

          updated = text[:start] + text[end:]
          assert marker not in updated
          json.loads(updated)
          path.write_text(updated)
          PY

          rm .github/workflows/remove-calf-raise-walk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/conditioning_bank.json .github/workflows/remove-calf-raise-walk.yml
          git commit -m "Remove Calf Raise Walk from conditioning bank"
          git push origin HEAD
