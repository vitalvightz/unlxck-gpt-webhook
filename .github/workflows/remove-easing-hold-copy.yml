name: Remove easing hold copy

on:
  push:
    branches:
      - agent/remove-easing-hold-copy

permissions:
  contents: write

jobs:
  remove-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-easing-hold-copy

      - name: Remove clause everywhere
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          needle = " — marking it easing does not lift the hold".encode("utf-8")
          changed: list[tuple[str, int]] = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              data = path.read_bytes()
              count = data.count(needle)
              if count:
                  path.write_bytes(data.replace(needle, b""))
                  changed.append((str(path), count))

          if not changed:
              raise SystemExit("No matching clause found")

          print(f"Removed {sum(count for _, count in changed)} occurrence(s):")
          for path, count in changed:
              print(f"- {path}: {count}")
          PY

          git rm .github/workflows/remove-easing-hold-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove easing hold copy"
          git push origin HEAD:agent/remove-easing-hold-copy
