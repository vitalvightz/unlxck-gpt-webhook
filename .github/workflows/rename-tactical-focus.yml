name: Rename Tactical Focus
on: push
permissions:
  contents: write
jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/rename-tactical-focus
      - name: Rename athlete-facing label
        run: |
          git grep -Il 'Fight Tactical Watch' -- ':!*.lock' | xargs -r sed -i 's/Fight Tactical Watch/Tactical Focus/g'
          git grep -Il 'fight tactical watch' -- ':!*.lock' | xargs -r sed -i 's/fight tactical watch/tactical focus/g'
          rm .github/workflows/rename-tactical-focus.yml
          ! git grep -n -i 'fight tactical watch' -- ':!*.lock'
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Rename Fight Tactical Watch to Tactical Focus'
          git push