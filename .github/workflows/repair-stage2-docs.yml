name: Repair Stage 2 contract docs

on:
  push:
    branches:
      - codex/remove-stage1-athlete-fallback

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/remove-stage1-athlete-fallback
      - name: Repair stale Stage 1 fallback paragraph
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("docs/state_machine.md")
          text = p.read_text()
          start = text.index("#### Technical Stage 2 failures\n")
          end = text.index("#### What can still block a release\n", start)
          replacement = '''#### Technical Stage 2 failures\n\nThe rows above describe a Stage 2 plan that *exists*. If Stage 2 fails before\nproducing usable athlete-facing text — for example a timeout, provider error,\nunavailable finalizer, empty response, or unexpected finalizer crash — the\ngeneration attempt fails and no plan row is created. Stage 1 remains internal\nplanner input only; it is never promoted to the athlete-facing final plan.\n\nAn `incomplete` provider response is handled by content, not by status alone. If\nit still contains usable Stage 2 text, that Stage 2 text continues through the\nvalidator and releases as `publishable_with_flags` with an admin-visible\n`stage2_incomplete_response` warning. If it contains no usable Stage 2 text, the\ngeneration attempt fails.\n\nThe historical `stage2_failed_stage1_fallback` audit value may still appear on\nold plan rows created before this contract changed. New generations do not write\nthat outcome.\n\n'''
          p.write_text(text[:start] + replacement + text[end:])
          Path(".github/workflows/repair-stage2-docs.yml").unlink()
          PY
      - name: Commit repaired docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Stage 2 failure state-machine docs"
          git push origin HEAD:codex/remove-stage1-athlete-fallback
