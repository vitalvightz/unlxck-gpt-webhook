name: Rotate UNLXCK logos 180 degrees

on:
  push:
    branches:
      - codex/rotate-unlxck-logos-180
    paths:
      - .github/workflows/rotate-unlxck-logos-180.yml

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/rotate-unlxck-logos-180
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Rotate and validate logo assets
        run: python scripts/rotate_unlxck_logos_180.py

      - name: Remove one-off automation files
        run: |
          git rm scripts/rotate_unlxck_logos_180.py
          git rm .github/workflows/rotate-unlxck-logos-180.yml

      - name: Commit rotated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add web/public
          git commit -m "Rotate UNLXCK logo assets 180 degrees"
          git push origin HEAD:codex/rotate-unlxck-logos-180
