name: Run execution-card cleanup

on:
  push:
    branches:
      - fix/restore-block-stop-rules

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-block-stop-rules
          fetch-depth: 0

      - name: Apply execution-first block cleanup
        run: python .github/scripts/apply_execution_card_cleanup.py

      - name: Run focused backend tests
        run: |
          python -m pip install -q -r requirements.txt pytest
          pytest -q tests/test_structured_plan_stop_rules.py

      - name: Run focused frontend tests
        run: |
          cd web
          npm ci --ignore-scripts
          npm run typecheck
          node --import tsx --test lib/structured-plan-stop-rules.test.ts components/structured-plan-stop-rules.test.tsx

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-execution-card-cleanup.yml .github/workflows/run-execution-card-cleanup.yml .github/scripts/apply_execution_card_cleanup.py
          git add api/structured_plan_generation.py api/structured_plan_models.py tests/test_structured_plan_stop_rules.py web/lib/types.ts web/lib/structured-plan.ts web/lib/structured-plan-stop-rules.test.ts web/components/structured-plan-renderer.tsx web/components/structured-plan-stop-rules.test.tsx
          git commit -m "Make exercise cards execution-first"
          git push origin HEAD:fix/restore-block-stop-rules
