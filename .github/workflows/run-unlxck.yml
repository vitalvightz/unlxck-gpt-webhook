name: Run Unlxck

on:
  push:
    branches:
      - fix/controlled-fight-speed-technical-rounds
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-label:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace label and restore workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "Fight-intensity technical rounds"
          new = "Controlled fight-speed technical rounds"
          changed = []
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if old not in text:
                  continue
              path.write_text(text.replace(old, new), encoding="utf-8")
              changed.append(str(path))

          print("changed files:")
          for item in changed:
              print(item)
          PY

          git fetch origin Main --depth=1
          git checkout origin/Main -- .github/workflows/run-unlxck.yml

          git config user.name "unlxck-label-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Rename fight-speed technical label"
            git push
          fi
