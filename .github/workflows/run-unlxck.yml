name: Run Unlxck

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-dev.txt
          pip check
          # Smoke test: confirm the production spaCy model loads
          python -c "import spacy; spacy.load('en_core_web_sm'); print('spaCy model OK')"

      - name: Preflight Supabase URL
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          python - <<'PY'
          import os

          raw = os.environ["SUPABASE_URL"]
          cleaned = raw.strip()
          if not cleaned:
              raise SystemExit("SUPABASE_URL is empty")
          print("SUPABASE_URL present")
          if cleaned.lower().startswith("supabase_url="):
              raise SystemExit("GitHub var still contains prefix")
          cleaned = cleaned.rstrip("/")
          if not cleaned.startswith("https://"):
              raise SystemExit("SUPABASE_URL must start with https://")
          print("SUPABASE_URL_CLEANED looks valid")
          PY

      - name: Run tests
        run: python -m pytest -x -vv
