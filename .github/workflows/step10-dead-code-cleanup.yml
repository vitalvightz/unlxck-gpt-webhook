name: Step 10 dead-code cleanup

on:
  push:
    branches:
      - codex/audit-and-close-architecture-migration

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[step10-cleanup-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/audit-and-close-architecture-migration
          fetch-depth: 0

      - name: Remove proven-dead Stage 2 payload policy copies
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          payload_path = Path('fightcamp/stage2_payload.py')
          raw = payload_path.read_bytes()
          had_bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')
          tree = ast.parse(text)

          dead_functions = {
              '_role_anchor',
              '_recovery_role_key',
              '_role_selection_rule',
              '_is_optional_alactic_role',
              '_dedupe_clean_strings',
              '_append_week_coach_note_flag',
              '_is_final_week_capped_sparring_entry',
              '_lock_declared_hard_sparring_roles',
              '_compressed_priority_for_role',
              '_intentional_compression_stub',
              '_active_weight_cut_is_meaningful',
              '_cut_severity_compression_points',
              '_active_injury_affects_generic_compression',
              '_active_injury_is_moderate_plus',
              '_compute_readiness_compression',
              '_non_spar_role_priority_rank',
              '_build_spar_allocation_reason_codes',
              '_boxing_crowded_week_policy_state',
              '_boxing_crowded_week_summary',
              '_select_boxing_crowded_week_non_spar_roles',
              '_apply_boxing_crowded_week_compression',
              '_forbidden_between_effective_hard_contacts',
              '_suppress_sandwiched_glycolytic',
              '_apply_high_fatigue_week_compression',
              '_apply_legacy_high_fatigue_compression',
          }
          dead_assignments = {
              '_OPTIONAL_ALACTIC_ROLE_KEYS',
              '_SANDWICHED_HARD_CONTACT_SCOPE',
              '_HARD_CONTACT_PROFILE',
              '_SANDWICHED_HARD_CONTACT_EVENTS',
          }

          spans: list[tuple[int, int, str]] = []
          found_functions: set[str] = set()
          found_assignments: set[str] = set()

          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in dead_functions:
                  found_functions.add(node.name)
                  spans.append((node.lineno, node.end_lineno or node.lineno, node.name))
                  continue
              if isinstance(node, (ast.Assign, ast.AnnAssign)):
                  names: set[str] = set()
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  for target in targets:
                      if isinstance(target, ast.Name):
                          names.add(target.id)
                  matches = names & dead_assignments
                  if matches:
                      found_assignments.update(matches)
                      spans.append((node.lineno, node.end_lineno or node.lineno, ','.join(sorted(matches))))

          missing_functions = dead_functions - found_functions
          missing_assignments = dead_assignments - found_assignments
          if missing_functions or missing_assignments:
              raise SystemExit(
                  f'cleanup guard failed; missing functions={sorted(missing_functions)} '
                  f'assignments={sorted(missing_assignments)}'
              )

          lines = text.splitlines(keepends=True)
          for start, end, _name in sorted(spans, reverse=True):
              del lines[start - 1:end]
          cleaned = ''.join(lines)

          # These imports existed only for the dead payload-side collision/compression copies.
          # Fail loudly if the expected blocks have drifted rather than guessing at cleanup.
          old_spar = '''from .sparring_dose_planner import (\n    effective_hard_day_count,\n    effective_hard_days,\n    sandwiched_training_days,\n)\n'''
          old_calendar = 'from .calendar_context import classify_role, contact_profile_for_load\n'
          old_policy = 'from .combat_load_policy import CalendarEvent, evaluate_candidate_at_position\n'
          for block in (old_spar, old_calendar, old_policy):
              if cleaned.count(block) != 1:
                  raise SystemExit(f'cleanup guard failed; expected import block exactly once: {block!r}')
              cleaned = cleaned.replace(block, '', 1)

          encoded = cleaned.encode('utf-8')
          if had_bom:
              encoded = b'\xef\xbb\xbf' + encoded
          payload_path.write_bytes(encoded)

          test_path = Path('tests/test_stage2_planning_brief.py')
          test_raw = test_path.read_bytes()
          test_had_bom = test_raw.startswith(b'\xef\xbb\xbf')
          test_text = test_raw.decode('utf-8-sig')

          moved = (
              '    _apply_high_fatigue_week_compression,\n',
              '    _compute_readiness_compression,\n',
              '    _non_spar_role_priority_rank,\n',
          )
          for line in moved:
              if test_text.count(line) != 1:
                  raise SystemExit(f'test import cleanup guard failed for {line!r}')
              test_text = test_text.replace(line, '', 1)

          marker = 'from fightcamp.stage2_payload import (\n'
          if test_text.count(marker) != 1:
              raise SystemExit('test import cleanup guard failed: payload import marker drifted')
          owner_import = (
              'from fightcamp.stage2_role_map import (\n'
              '    _apply_high_fatigue_week_compression,\n'
              '    _compute_readiness_compression,\n'
              '    _non_spar_role_priority_rank,\n'
              ')\n'
          )
          test_text = test_text.replace(marker, owner_import + marker, 1)
          test_encoded = test_text.encode('utf-8')
          if test_had_bom:
              test_encoded = b'\xef\xbb\xbf' + test_encoded
          test_path.write_bytes(test_encoded)
          PY

      - name: Verify syntax and scoped dead-code absence
        shell: bash
        run: |
          python -m py_compile fightcamp/stage2_payload.py tests/test_stage2_planning_brief.py
          python - <<'PY'
          import ast
          from pathlib import Path

          tree = ast.parse(Path('fightcamp/stage2_payload.py').read_text(encoding='utf-8-sig'))
          forbidden = {
              '_apply_high_fatigue_week_compression',
              '_apply_legacy_high_fatigue_compression',
              '_apply_boxing_crowded_week_compression',
              '_boxing_crowded_week_policy_state',
              '_suppress_sandwiched_glycolytic',
              '_forbidden_between_effective_hard_contacts',
          }
          present = {
              node.name for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in forbidden
          }
          if present:
              raise SystemExit(f'dead payload policy functions remain: {sorted(present)}')
          PY
          git diff --check

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/step10-dead-code-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "refactor: remove dead Stage 2 payload policy copies [step10-cleanup-done]"
          git push origin HEAD:codex/audit-and-close-architecture-migration
