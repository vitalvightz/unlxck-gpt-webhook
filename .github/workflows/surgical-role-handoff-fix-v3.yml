name: Surgical role handoff verification v3

on:
  push:
    branches:
      - codex/d14-d13-role-handoff-surgical

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d14-d13-role-handoff-surgical
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Apply corrected patch
        run: python .github/scripts/surgical_role_handoff_fix_v2.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Focused regression tests
        run: |
          pytest -q \
            tests/test_d14_d13_role_handoff_surgical.py \
            tests/test_camp_tail_allocator_handoff.py \
            tests/test_stage2_payload_late_fight_roles.py \
            tests/test_stage2_payload_modes.py \
            tests/test_stage2_finalizer_packet.py \
            tests/test_sparse_combat_week_hard_conditioning.py
      - name: Lint and compile
        run: |
          ruff check \
            fightcamp/stage2_role_map.py \
            fightcamp/camp_week_fillers.py \
            fightcamp/stage2_payload_late_fight.py \
            fightcamp/stage2_finalizer_packet.py \
            tests/test_d14_d13_role_handoff_surgical.py
          python -m compileall -q fightcamp
      - name: Commit verified patch and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/surgical-role-handoff-fix.yml \
            .github/workflows/surgical-role-handoff-fix-v2.yml \
            .github/workflows/surgical-role-handoff-fix-v3.yml \
            .github/workflows/debug-late-handoff.yml \
            .github/scripts/surgical_role_handoff_fix.py \
            .github/scripts/surgical_role_handoff_fix_v2.py
          git add \
            fightcamp/stage2_role_map.py \
            fightcamp/camp_week_fillers.py \
            fightcamp/stage2_payload_late_fight.py \
            fightcamp/stage2_finalizer_packet.py \
            tests/test_d14_d13_role_handoff_surgical.py
          git commit -m "fix: preserve required intent across D13 handoff"
          git push origin codex/d14-d13-role-handoff-surgical
