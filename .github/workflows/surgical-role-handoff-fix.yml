name: Surgical D14-D13 role handoff fix

on:
  push:
    branches:
      - codex/d14-d13-role-handoff-surgical

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/d14-d13-role-handoff-surgical
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Apply surgical patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))

          role_map = "fightcamp/stage2_role_map.py"
          replace_once(
              role_map,
              "def _preferred_boxer_conditioning_sequence(phase: str, conditioning_sequence: list[str]) -> list[str]:\n",
              '''def _prioritize_must_keep_conditioning_systems(\n    conditioning_sequence: list[str],\n    week_entry: dict,\n) -> list[str]:\n    """Give existing must-keep conditioning systems first claim on finite slots.\n\n    This does not choose a universal SPP/GPP pair. It only reorders the existing\n    phase/limiter sequence so systems the canonical weekly rule state already\n    marks must-keep are represented before optional systems.\n    """\n    sequence = [\n        str(system).strip().lower()\n        for system in conditioning_sequence\n        if str(system).strip()\n    ]\n    resolved_rule_state = dict(week_entry.get("resolved_rule_state") or {})\n    must_keep = resolved_rule_state.get("must_keep", week_entry.get("must_keep", []))\n    required = [\n        str(system).strip().lower()\n        for system in (must_keep or [])\n        if str(system).strip().lower() in {"aerobic", "glycolytic", "alactic"}\n    ]\n    return dedupe_preserve_order([*required, *sequence])\n\n\ndef _preferred_boxer_conditioning_sequence(phase: str, conditioning_sequence: list[str]) -> list[str]:\n''',
          )
          replace_once(
              role_map,
              '''            conditioning_sequence = _preferred_boxer_conditioning_sequence(\n                week_entry.get("phase", ""),\n                conditioning_sequence,\n            )\n        session_roles: list[dict] = []\n''',
              '''            conditioning_sequence = _preferred_boxer_conditioning_sequence(\n                week_entry.get("phase", ""),\n                conditioning_sequence,\n            )\n        conditioning_sequence = _prioritize_must_keep_conditioning_systems(\n            conditioning_sequence,\n            week_entry,\n        )\n        session_roles: list[dict] = []\n''',
          )

          fillers = "fightcamp/camp_week_fillers.py"
          replace_once(
              fillers,
              '''    if not weeks or _week_for_d_day(weeks, 13) is None:\n        return False\n\n    finished_tail = build_finished_late_fight_tail(\n        days_until_fight,\n        athlete_model,\n        start_day=13,\n    )\n''',
              '''    handoff_week = _week_for_d_day(weeks, 13) if weeks else None\n    if handoff_week is None:\n        return False\n\n    resolved_rule_state = dict(handoff_week.get("resolved_rule_state") or {})\n    must_keep = resolved_rule_state.get("must_keep", handoff_week.get("must_keep", []))\n    if not isinstance(must_keep, (list, tuple, set)):\n        must_keep = []\n    parent_required_conditioning_systems = []\n    for raw_system in must_keep:\n        system = str(raw_system).strip().lower()\n        if system in {"aerobic", "glycolytic", "alactic"} and system not in parent_required_conditioning_systems:\n            parent_required_conditioning_systems.append(system)\n\n    tail_athlete_model = dict(athlete_model)\n    if parent_required_conditioning_systems:\n        # Handoff context only: the existing D-13 allocator remains the owner of\n        # role legality/placement and may still reject work its countdown rules ban.\n        tail_athlete_model["handoff_required_conditioning_systems"] = parent_required_conditioning_systems\n\n    finished_tail = build_finished_late_fight_tail(\n        days_until_fight,\n        tail_athlete_model,\n        start_day=13,\n    )\n''',
          )

          late = "fightcamp/stage2_payload_late_fight.py"
          replace_once(
              late,
              "def _late_fight_candidate_roles(\n",
              '''def _handoff_required_alactic_labels(\n    legal_countdown_labels: list[str],\n    athlete_model: dict[str, Any],\n) -> list[str]:\n    """Keep a parent-required alactic touch inside the D-13..D-8 handoff band.\n\n    The parent week can require alactic work, but D-13 inward remains owned by\n    the late-fight allocator. We therefore narrow only that already-legal\n    alactic candidate to the parent SPP sub-window; we never resurrect\n    glycolytic work or bypass countdown safety.\n    """\n    required = {\n        str(system).strip().lower()\n        for system in clean_list(\n            athlete_model.get("handoff_required_conditioning_systems", [])\n        )\n    }\n    if "alactic" not in required:\n        return legal_countdown_labels\n\n    scoped: list[str] = []\n    for label in legal_countdown_labels:\n        text = str(label or "").strip().upper()\n        if not text.startswith("D-"):\n            continue\n        try:\n            offset = int(text[2:])\n        except ValueError:\n            continue\n        if 8 <= offset <= 13:\n            scoped.append(label)\n    return scoped or legal_countdown_labels\n\n\ndef _late_fight_candidate_roles(\n''',
          )
          replace_once(
              late,
              '''                    selection_rule="Use one alactic sharpness exposure instead of a normal conditioning build.",\n                    placement_rule="Keep this brief and crisp; do not turn it into density work.",\n                    selection_priority=106,\n                    required=True,\n                    legal_countdown_labels=legal_countdown_labels,\n''',
              '''                    selection_rule="Use one alactic sharpness exposure instead of a normal conditioning build.",\n                    placement_rule="Keep this brief and crisp; do not turn it into density work.",\n                    selection_priority=106,\n                    required=True,\n                    legal_countdown_labels=_handoff_required_alactic_labels(\n                        legal_countdown_labels,\n                        athlete_model,\n                    ),\n''',
          )

          finalizer = "fightcamp/stage2_finalizer_packet.py"
          replace_once(
              finalizer,
              "def build_stage2_finalizer_packet(\n",
              '''def _lock_weekly_session_spine(packet: dict[str, Any]) -> None:\n    """Expose the compact role map as an exact render spine for the finalizer."""\n    selected_plan = packet.get("selected_plan")\n    if not isinstance(selected_plan, dict):\n        return\n    compact_map = selected_plan.get("weekly_role_map")\n    if not isinstance(compact_map, dict):\n        return\n\n    spine: list[dict[str, Any]] = []\n    for week in compact_map.get("weeks", []) or []:\n        if not isinstance(week, dict):\n            continue\n        sessions: list[dict[str, Any]] = []\n        for role in week.get("session_roles", []) or []:\n            if not isinstance(role, dict) or role.get("render_mandatory") is False:\n                continue\n            if role.get("coach_owned") and str(role.get("category") or "").lower() == "sparring":\n                continue\n            session = {\n                "role_key": role.get("role_key"),\n                "category": role.get("category"),\n                "athlete_facing_label": role.get("athlete_facing_label"),\n                "scheduled_day_hint": role.get("scheduled_day_hint"),\n                "scheduled_countdown_label": (\n                    role.get("scheduled_countdown_label")\n                    or role.get("countdown_label")\n                ),\n            }\n            sessions.append({key: value for key, value in session.items() if value not in (None, "")})\n        if sessions:\n            spine.append(\n                {\n                    "week_index": week.get("week_index"),\n                    "phase": week.get("phase"),\n                    "sessions": sessions,\n                }\n            )\n\n    if not spine:\n        return\n    selected_plan["deterministic_session_spine"] = spine\n    packet.setdefault("hard_rules", []).append(\n        "selected_plan.deterministic_session_spine is the exact athlete-visible "\n        "week/day/session structure produced by deterministic planning. Render every "\n        "listed session exactly once at its supplied day/countdown. Do not drop, merge, "\n        "move, or invent session roles. Exercise wording may vary only inside the "\n        "selected assignments and downstream safety/render contracts."\n    )\n\n\ndef build_stage2_finalizer_packet(\n''',
          )
          replace_once(
              finalizer,
              '''    _lock_sparse_hard_conditioning_contract(packet)\n\n    tail_contracts = _late_fight_tail_contracts(weekly_role_map)\n''',
              '''    _lock_sparse_hard_conditioning_contract(packet)\n    _lock_weekly_session_spine(packet)\n\n    tail_contracts = _late_fight_tail_contracts(weekly_role_map)\n''',
          )

          Path("tests/test_d14_d13_role_handoff_surgical.py").write_text(r'''from __future__ import annotations

import fightcamp.camp_week_fillers as fillers
from fightcamp.camp_week_fillers import _splice_late_fight_tail
from fightcamp.late_fight_tail import build_finished_late_fight_tail
from fightcamp.stage2_finalizer_packet import build_stage2_finalizer_packet
from fightcamp.stage2_role_map import _prioritize_must_keep_conditioning_systems


def _role(role_key: str, d_day: int, weekday: str, category: str = "conditioning") -> dict:
    return {
        "role_key": role_key,
        "category": category,
        "scheduled_countdown_label": f"D-{d_day}",
        "countdown_label": f"D-{d_day}",
        "countdown_offset": d_day,
        "scheduled_day_hint": weekday,
        "athlete_facing_label": role_key.replace("_", " ").title(),
    }


def test_must_keep_conditioning_gets_first_claim_without_fixed_spp_pair() -> None:
    week = {
        "must_keep": ["rehab", "glycolytic", "alactic", "primary_strength"],
        "resolved_rule_state": {
            "must_keep": ["rehab", "glycolytic", "alactic", "primary_strength"]
        },
    }
    assert _prioritize_must_keep_conditioning_systems(
        ["aerobic", "glycolytic", "alactic"], week
    ) == ["glycolytic", "alactic", "aerobic"]

    aerobic_week = {"resolved_rule_state": {"must_keep": ["aerobic", "glycolytic"]}}
    assert _prioritize_must_keep_conditioning_systems(
        ["alactic", "glycolytic", "aerobic"], aerobic_week
    ) == ["aerobic", "glycolytic", "alactic"]


def test_d13_splice_passes_parent_required_systems_to_existing_tail_owner(monkeypatch) -> None:
    weekly_role_map = {
        "weeks": [
            {
                "week_index": 2,
                "phase": "SPP",
                "calendar_days": [
                    {"weekday": "monday", "d_day": 14},
                    {"weekday": "tuesday", "d_day": 13},
                ],
                "resolved_rule_state": {
                    "must_keep": ["rehab", "glycolytic", "alactic", "primary_strength"]
                },
                "session_roles": [_role("normal_d13", 13, "tuesday")],
                "intentionally_unused_days": [],
            }
        ]
    }
    captured: dict = {}

    def fake_finished_tail(days_until_fight, model, *, start_day):
        captured["systems"] = model.get("handoff_required_conditioning_systems")
        return {
            "session_sequence": [_role("late_d13", 13, "tuesday")],
            "day_metadata": {
                13: {"stage_key": "d13_to_d8", "payload_mode": "pre_fight_compressed_payload"}
            },
            "segments": [
                {
                    "stage_key": "d13_to_d8",
                    "payload_mode": "pre_fight_compressed_payload",
                    "countdown_span": {"start_day": 13, "end_day": 8},
                }
            ],
        }

    monkeypatch.setattr(fillers, "build_finished_late_fight_tail", fake_finished_tail)
    assert _splice_late_fight_tail(
        weekly_role_map,
        {"days_until_fight": 22, "training_days": ["monday", "tuesday"]},
    ) is True
    assert captured["systems"] == ["glycolytic", "alactic"]


def test_production_shaped_d22_handoff_keeps_required_alactic_inside_d13_to_d8() -> None:
    athlete = {
        "sport": "boxing",
        "fight_format": "boxing",
        "days_until_fight": 22,
        "fight_date": "2026-09-28",
        "next_fight_date": "2026-09-28",
        "plan_creation_weekday": "sunday",
        "training_frequency": 4,
        "weekly_training_frequency": 4,
        "days_available": 4,
        "training_days": ["monday", "wednesday", "thursday", "friday"],
        "hard_sparring_days": [],
        "support_work_days": [],
        "fatigue": "moderate",
        "fatigue_level": "moderate",
        "readiness_flags": [],
        "injuries": [],
        "restrictions": [],
        "weight_cut_risk": False,
        "cut_severity_bucket": "low",
        "key_goals": ["conditioning", "speed"],
        "weaknesses": ["conditioning"],
        "equipment": ["bodyweight", "bands", "medicine_ball", "assault_bike", "rower"],
        "handoff_required_conditioning_systems": ["glycolytic", "alactic"],
    }
    tail = build_finished_late_fight_tail(22, athlete, start_day=13)
    alactic_offsets = [
        int(role.get("countdown_offset"))
        for role in tail.get("session_sequence", [])
        if isinstance(role, dict)
        and role.get("role_key") == "alactic_sharpness_day"
        and isinstance(role.get("countdown_offset"), int)
    ]
    assert alactic_offsets
    assert any(8 <= offset <= 13 for offset in alactic_offsets)

    hard_glycolytic_keys = {
        "fight_pace_repeatability_day",
        "main_fight_pace_day",
        "highest_glycolytic_day",
        "controlled_repeatability_day",
    }
    assert not any(
        isinstance(role, dict)
        and role.get("role_key") in hard_glycolytic_keys
        and isinstance(role.get("countdown_offset"), int)
        and 8 <= role["countdown_offset"] <= 13
        for role in tail.get("session_sequence", [])
    )


def test_finalizer_packet_exposes_exact_compact_session_spine() -> None:
    weekly_role_map = {
        "weeks": [
            {
                "week_index": 2,
                "phase": "SPP",
                "session_roles": [
                    _role("alactic_sharpness_day", 12, "wednesday"),
                    _role("tactical_watch", 10, "friday", category="support_insert"),
                ],
            }
        ]
    }
    packet = build_stage2_finalizer_packet(
        stage2_payload={"weekly_role_map": weekly_role_map},
        planning_brief={
            "weekly_role_map": weekly_role_map,
            "candidate_pools": {},
            "athlete_snapshot": {},
        },
    )
    spine = packet["selected_plan"]["deterministic_session_spine"]
    assert [session["role_key"] for session in spine[0]["sessions"]] == [
        "alactic_sharpness_day",
        "tactical_watch",
    ]
    assert spine[0]["sessions"][0]["scheduled_countdown_label"] == "D-12"
    assert any("Do not drop, merge, move, or invent session roles" in rule for rule in packet["hard_rules"])
''')
          PY

      - name: Install test dependencies
        env:
          PIP_RETRIES: "5"
          PIP_DEFAULT_TIMEOUT: "60"
        run: |
          python -m pip install --upgrade pip
          n=0
          until pip install -r requirements-dev.txt; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "pip install failed after $n attempts"; exit 1
            fi
            sleep $((n * 15))
          done

      - name: Focused regression tests
        run: |
          pytest -q \
            tests/test_d14_d13_role_handoff_surgical.py \
            tests/test_camp_tail_allocator_handoff.py \
            tests/test_stage2_finalizer_packet.py \
            tests/test_sparse_combat_week_hard_conditioning.py

      - name: Lint and compile
        run: |
          ruff check \
            fightcamp/stage2_role_map.py \
            fightcamp/camp_week_fillers.py \
            fightcamp/stage2_payload_late_fight.py \
            fightcamp/stage2_finalizer_packet.py \
            tests/test_d14_d13_role_handoff_surgical.py
          python -m compileall -q fightcamp

      - name: Commit verified patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/surgical-role-handoff-fix.yml
          git add \
            fightcamp/stage2_role_map.py \
            fightcamp/camp_week_fillers.py \
            fightcamp/stage2_payload_late_fight.py \
            fightcamp/stage2_finalizer_packet.py \
            tests/test_d14_d13_role_handoff_surgical.py
          git commit -m "fix: preserve required intent across D13 handoff"
          git push origin codex/d14-d13-role-handoff-surgical
