name: Surgical sparse-week follow-up

on:
  push:
    branches:
      - codex/sparse-week-hard-conditioning-surgical

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/sparse-week-hard-conditioning-surgical
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply narrow production patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("fightcamp/stage2_role_map.py")
          text = p.read_text()
          start = text.index("def _is_sparse_combat_week(")
          end = text.index("def _combat_pressure_floor_metadata(", start)
          sparse = (
              'def _is_sparse_combat_week(week_entry: dict, athlete_model: dict) -> bool:\n'
              '    """Return True only for zero resolved hard contact and <=1 light-combat day.\n\n'
              '    Hard-contact truth comes from the already-resolved sparring plan owned by\n'
              '    ``sparring_dose_planner``. Light-combat identity comes from the shared\n'
              '    declared-combat ownership helper. This function does not reinterpret raw\n'
              '    hard-sparring declarations.\n'
              '    """\n'
              '    if clean_list(week_entry.get("hard_sparring_plan", [])):\n'
              '        return False\n'
              '    if clean_list(week_entry.get("effective_hard_sparring_days", [])):\n'
              '        return False\n\n'
              '    light_days = declared_light_combat_weekdays(\n'
              '        athlete_model,\n'
              '        training_days=clean_list(athlete_model.get("training_days", [])),\n'
              '    )\n'
              '    return len(light_days) <= 1\n\n\n'
          )
          text = text[:start] + sparse + text[end:]

          anchor = "def _convert_role_to_combat_pressure(role: dict, phase: str) -> None:\n"
          helper = (
              'def _pick_sparse_combat_floor_upgrade_target(\n'
              '    session_roles: list[dict], must_keep: set[str]\n'
              ') -> dict | None:\n'
              '    """Relax only the sole aerobic must-keep for a genuinely sparse week."""\n'
              '    if "aerobic" not in must_keep:\n'
              '        return None\n'
              '    target = _pick_combat_floor_upgrade_target(\n'
              '        session_roles, must_keep - {"aerobic"}\n'
              '    )\n'
              '    if target is None:\n'
              '        return None\n'
              '    if str(target.get("preferred_system") or "").strip().lower() != "aerobic":\n'
              '        return None\n'
              '    return target\n\n\n'
          )
          if "def _pick_sparse_combat_floor_upgrade_target(" not in text:
              text = text.replace(anchor, helper + anchor, 1)

          old = (
              '    target = _pick_combat_floor_upgrade_target(session_roles, must_keep)\n'
              '    sparse_override = False\n'
              '    if target is None and _is_sparse_combat_week(athlete_model):\n'
              '        # Sparse-week fallback may repurpose the sole ordinary conditioning slot\n'
              '        # after every existing pressure-floor safety blocker has already passed.\n'
              '        # It never creates another session and never runs when hard sparring is\n'
              '        # declared, so populated combat weeks keep their existing behaviour.\n'
              '        target = _pick_combat_floor_upgrade_target(session_roles, set())\n'
              '        sparse_override = target is not None\n'
          )
          new = (
              '    target = _pick_combat_floor_upgrade_target(session_roles, must_keep)\n'
              '    sparse_override = False\n'
              '    if target is None and _is_sparse_combat_week(week_entry, athlete_model):\n'
              '        # Narrow exception: only a sole ordinary aerobic must-keep may become\n'
              '        # the existing hard glycolytic role. Every other must-keep protection,\n'
              '        # plus every existing pressure-floor safety blocker, stays authoritative.\n'
              '        target = _pick_sparse_combat_floor_upgrade_target(session_roles, must_keep)\n'
              '        sparse_override = target is not None\n'
          )
          if old not in text:
              raise SystemExit("sparse fallback anchor missing")
          text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path("fightcamp/stage2_finalizer_packet_impl.py")
          text = p.read_text()
          anchor = (
              '        "blocked_tags",\n\n'
              '        # Deterministic late-camp strength dose truth. The resolver makes the\n'
          )
          replacement = (
              '        "blocked_tags",\n\n'
              '        # Sparse combat-week hard-conditioning contract. These are deterministic\n'
              '        # role-budget facts and must survive the canonical compactor.\n'
              '        "sparse_combat_week_hard_fallback",\n'
              '        "combat_pressure_floor",\n'
              '        "mandatory_hard_conditioning_exposure",\n'
              '        "prescribed_intensity_rpe",\n'
              '        "prescribed_dose",\n'
              '        "floor_purpose",\n'
              '        "floor_stop_rule",\n\n'
              '        # Deterministic late-camp strength dose truth. The resolver makes the\n'
          )
          if anchor not in text:
              raise SystemExit("canonical compactor anchor missing")
          text = text.replace(anchor, replacement, 1)
          p.write_text(text)
          PY

      - name: Run existing owner regressions
        run: |
          pytest -q \
            tests/test_combat_pressure_conditioning_floor.py \
            tests/test_stage2_finalizer_packet.py

      - name: Lint and compile
        run: |
          ruff check fightcamp/stage2_role_map.py fightcamp/stage2_finalizer_packet_impl.py
          python -m compileall -q fightcamp

      - name: Commit production fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/surgical-sparse-week-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fightcamp/stage2_role_map.py fightcamp/stage2_finalizer_packet_impl.py .github/workflows/surgical-sparse-week-followup.yml
          git commit -m "Tighten sparse-week hard conditioning fallback"
          git push origin HEAD:codex/sparse-week-hard-conditioning-surgical
