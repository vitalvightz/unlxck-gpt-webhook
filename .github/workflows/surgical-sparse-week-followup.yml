name: Surgical sparse-week follow-up

on:
  push:
    branches:
      - codex/sparse-week-hard-conditioning-surgical

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/sparse-week-hard-conditioning-surgical
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply surgical follow-up
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          role_map_path = Path('fightcamp/stage2_role_map.py')
          text = role_map_path.read_text()

          old_sparse = '''def _is_sparse_combat_week(athlete_model: dict) -> bool:
              """Return True only for the narrow no/very-limited combat-gym case.

              Any declared hard-sparring day keeps the existing populated-week path fully
              unchanged. Sparse fallback is therefore limited to zero hard-sparring days
              and at most one declared light/technical combat day.
              """
              if clean_list(athlete_model.get("hard_sparring_days", [])):
                  return False

              training_days = {
                  str(day).strip().lower()
                  for day in clean_list(athlete_model.get("training_days", []))
                  if str(day).strip()
              }
              support_days = {
                  str(day).strip().lower()
                  for day in clean_list(
                      athlete_model.get("support_work_days")
                      or athlete_model.get("technical_skill_days")
                      or []
                  )
                  if str(day).strip()
              }
              if training_days:
                  support_days &= training_days
              return len(support_days) <= 1


          '''.replace('          ', '')
          new_sparse = '''def _is_sparse_combat_week(week_entry: dict, athlete_model: dict) -> bool:
              """Return True only for zero resolved hard contact and <=1 light-combat day.

              Hard-contact truth comes from the already-resolved sparring plan owned by
              ``sparring_dose_planner``. Light-combat identity comes from the shared
              declared-combat ownership helper. This function does not reinterpret raw
              hard-sparring declarations.
              """
              if clean_list(week_entry.get("hard_sparring_plan", [])):
                  return False
              if clean_list(week_entry.get("effective_hard_sparring_days", [])):
                  return False

              light_days = declared_light_combat_weekdays(
                  athlete_model,
                  training_days=clean_list(athlete_model.get("training_days", [])),
              )
              return len(light_days) <= 1


          '''.replace('          ', '')
          if old_sparse not in text:
              raise SystemExit('current sparse helper anchor missing')
          text = text.replace(old_sparse, new_sparse, 1)

          target_anchor = '''def _convert_role_to_combat_pressure(role: dict, phase: str) -> None:
          '''.replace('          ', '')
          sparse_target_helper = '''def _pick_sparse_combat_floor_upgrade_target(
              session_roles: list[dict], must_keep: set[str]
          ) -> dict | None:
              """Relax only the sole aerobic must-keep for a genuinely sparse week.

              All other must-keep systems remain protected. In particular, this cannot
              turn a protected alactic/sharpness slot into glycolytic work.
              """
              if "aerobic" not in must_keep:
                  return None
              target = _pick_combat_floor_upgrade_target(
                  session_roles,
                  must_keep - {"aerobic"},
              )
              if target is None:
                  return None
              if str(target.get("preferred_system") or "").strip().lower() != "aerobic":
                  return None
              return target


          '''.replace('          ', '')
          if target_anchor not in text:
              raise SystemExit('sparse target insertion anchor missing')
          if 'def _pick_sparse_combat_floor_upgrade_target(' not in text:
              text = text.replace(target_anchor, sparse_target_helper + target_anchor, 1)

          old_fallback = '''    target = _pick_combat_floor_upgrade_target(session_roles, must_keep)
              sparse_override = False
              if target is None and _is_sparse_combat_week(athlete_model):
                  # Sparse-week fallback may repurpose the sole ordinary conditioning slot
                  # after every existing pressure-floor safety blocker has already passed.
                  # It never creates another session and never runs when hard sparring is
                  # declared, so populated combat weeks keep their existing behaviour.
                  target = _pick_combat_floor_upgrade_target(session_roles, set())
                  sparse_override = target is not None
          '''.replace('          ', '')
          new_fallback = '''    target = _pick_combat_floor_upgrade_target(session_roles, must_keep)
              sparse_override = False
              if target is None and _is_sparse_combat_week(week_entry, athlete_model):
                  # Narrow exception: only a sole ordinary aerobic must-keep may become
                  # the existing hard glycolytic role. Every other must-keep protection,
                  # plus every existing pressure-floor safety blocker, stays authoritative.
                  target = _pick_sparse_combat_floor_upgrade_target(session_roles, must_keep)
                  sparse_override = target is not None
          '''.replace('          ', '')
          if old_fallback not in text:
              raise SystemExit('current sparse fallback anchor missing')
          text = text.replace(old_fallback, new_fallback, 1)
          role_map_path.write_text(text)

          impl_path = Path('fightcamp/stage2_finalizer_packet_impl.py')
          text = impl_path.read_text()
          compact_anchor = '''        # Safety filters for low-aerobic recovery work
              "blocked_systems",
              "blocked_intensities",
              "blocked_tags",

              # Deterministic late-camp strength dose truth. The resolver makes the
          '''.replace('          ', '')
          compact_replacement = '''        # Safety filters for low-aerobic recovery work
              "blocked_systems",
              "blocked_intensities",
              "blocked_tags",

              # Sparse combat-week hard-conditioning contract. These are deterministic
              # role-budget facts and must survive the canonical compactor.
              "sparse_combat_week_hard_fallback",
              "combat_pressure_floor",
              "mandatory_hard_conditioning_exposure",
              "prescribed_intensity_rpe",
              "prescribed_dose",
              "floor_purpose",
              "floor_stop_rule",

              # Deterministic late-camp strength dose truth. The resolver makes the
          '''.replace('          ', '')
          if compact_anchor not in text:
              raise SystemExit('finalizer compactor anchor missing')
          text = text.replace(compact_anchor, compact_replacement, 1)
          impl_path.write_text(text)

          finalizer_path = Path('fightcamp/stage2_finalizer_packet.py')
          text = finalizer_path.read_text()
          old_preserver_start = text.index('_SPARSE_HARD_CONDITIONING_FIELDS = (')
          old_preserver_end = text.index('def build_stage2_finalizer_packet(', old_preserver_start)
          compact_lock = '''def _lock_sparse_hard_conditioning_contract(packet: dict[str, Any]) -> None:
              """Lock a sparse hard role after canonical finalizer compaction."""
              selected_plan = packet.get("selected_plan")
              if not isinstance(selected_plan, dict):
                  return
              compact_map = selected_plan.get("weekly_role_map")
              if not isinstance(compact_map, dict):
                  return

              has_sparse_role = any(
                  isinstance(role, dict) and role.get("sparse_combat_week_hard_fallback")
                  for week in compact_map.get("weeks", []) or []
                  if isinstance(week, dict)
                  for role in week.get("session_roles", []) or []
              )
              if not has_sparse_role:
                  return

              packet.setdefault("hard_rules", []).append(
                  "A session role with sparse_combat_week_hard_fallback=true is the "
                  "deterministic replacement for an otherwise underloaded sparse combat week. "
                  "It MUST remain a hard glycolytic/fight-pace exposure at its supplied "
                  "prescribed_intensity_rpe and prescribed_dose. Do not soften it into easy "
                  "aerobic work, recovery, rhythm work, or a light conditioning session. "
                  "Existing countdown, injury, fatigue, weight-cut and fight-week safety "
                  "rules remain authoritative and may remove or reduce it upstream."
              )


          '''.replace('          ', '')
          text = text[:old_preserver_start] + compact_lock + text[old_preserver_end:]
          old_call = '    _preserve_sparse_hard_conditioning_contract(packet, weekly_role_map)\n'
          new_call = '    _lock_sparse_hard_conditioning_contract(packet)\n'
          if old_call not in text:
              raise SystemExit('finalizer sparse call anchor missing')
          text = text.replace(old_call, new_call, 1)
          finalizer_path.write_text(text)

          test_path = Path('tests/test_sparse_combat_week_hard_conditioning.py')
          test_path.write_text('''from __future__ import annotations

from copy import deepcopy

from fightcamp.stage2_finalizer_packet import build_stage2_finalizer_packet
from fightcamp.stage2_role_map import (
    _build_weekly_role_map,
    _enforce_combat_pressure_floor,
)


def _week(phase: str = "GPP", *, must_keep: list[str] | None = None) -> dict:
    protected = ["aerobic"] if must_keep is None else list(must_keep)
    return {
        "week_index": 1,
        "phase": phase,
        "calendar_days": [{"weekday": "monday", "d_day": 35}],
        "hard_sparring_plan": [],
        "effective_hard_sparring_days": [],
        "must_keep": protected,
        "resolved_rule_state": {"must_keep": protected},
    }


def _aerobic_role() -> dict:
    return {
        "session_index": 1,
        "category": "conditioning",
        "role_key": "aerobic_base_day",
        "preferred_pool": "conditioning_slots",
        "preferred_system": "aerobic",
        "governance": {},
        "scheduled_day_hint": "monday",
    }


def _alactic_role() -> dict:
    return {
        "session_index": 2,
        "category": "conditioning",
        "role_key": "alactic_speed_day",
        "preferred_pool": "conditioning_slots",
        "preferred_system": "alactic",
        "governance": {},
        "scheduled_day_hint": "thursday",
    }


def _athlete(**overrides) -> dict:
    athlete = {
        "sport": "boxing",
        "training_days": ["monday", "tuesday", "wednesday", "thursday"],
        "hard_sparring_days": [],
        "support_work_days": [],
        "fatigue": "low",
        "cut_severity_bucket": "low",
        "injury_mode": "full_plan",
        "fight_date": "2027-07-18",
        "key_goals": [],
        "weaknesses": [],
    }
    athlete.update(overrides)
    return athlete


def _progression() -> dict:
    weeks = []
    for idx in range(6):
        weeks.append(
            {
                "week_index": idx + 1,
                "phase": "GPP",
                "phase_week_index": idx + 1,
                "phase_week_total": 6,
                "span_days": 7,
                "stage_key": "general_capacity",
                "session_counts": {"strength": 0, "conditioning": 1, "recovery": 0},
                "conditioning_sequence": ["aerobic"],
                "must_keep": ["aerobic"],
                "resolved_rule_state": {"must_keep": ["aerobic"]},
            }
        )
    return {"weeks": weeks}


def _sparse_roles(week: dict) -> list[dict]:
    return [
        role
        for role in week.get("session_roles", [])
        if role.get("sparse_combat_week_hard_fallback")
    ]


def test_zero_combat_sessions_repurposes_sole_aerobic_slot_to_hard_gpp() -> None:
    week = _week()
    roles = _enforce_combat_pressure_floor(week, [_aerobic_role()], [], _athlete())
    role = roles[0]
    assert role["preferred_system"] == "glycolytic"
    assert role["role_key"] == "controlled_repeatability_day"
    assert role["mandatory_hard_conditioning_exposure"] is True
    assert role["prescribed_intensity_rpe"] == "8"
    assert role["sparse_combat_week_hard_fallback"] is True
    assert week["combat_pressure_floor"]["source"] == "sparse_week_upgraded_conditioning_slot"


def test_one_light_combat_day_still_gets_hard_sparse_fallback() -> None:
    week = _week("SPP")
    roles = _enforce_combat_pressure_floor(
        week,
        [_aerobic_role()],
        [],
        _athlete(support_work_days=["wednesday"]),
    )
    role = roles[0]
    assert role["preferred_system"] == "glycolytic"
    assert role["role_key"] == "fight_pace_repeatability_day"
    assert role["prescribed_intensity_rpe"] == "8-9"
    assert role["sparse_combat_week_hard_fallback"] is True


def test_two_light_combat_days_do_not_activate_sparse_override() -> None:
    week = _week()
    roles = _enforce_combat_pressure_floor(
        week,
        [deepcopy(_aerobic_role())],
        [],
        _athlete(support_work_days=["tuesday", "thursday"]),
    )
    assert roles[0]["preferred_system"] == "aerobic"
    assert not roles[0].get("sparse_combat_week_hard_fallback")
    assert week["combat_pressure_floor"]["active"] is False


def test_resolved_hard_plan_prevents_sparse_override() -> None:
    week = _week()
    week["hard_sparring_plan"] = [
        {
            "day": "tuesday",
            "status": "convert_to_technical_suggested",
            "effective_load": "technical",
        }
    ]
    roles = _enforce_combat_pressure_floor(
        week,
        [_aerobic_role()],
        [],
        _athlete(hard_sparring_days=["tuesday"]),
    )
    assert roles[0]["preferred_system"] == "aerobic"
    assert not roles[0].get("sparse_combat_week_hard_fallback")


def test_sparse_override_never_breaks_alactic_must_keep() -> None:
    week = _week("SPP", must_keep=["alactic"])
    roles = _enforce_combat_pressure_floor(
        week,
        [_alactic_role()],
        [],
        _athlete(),
    )
    assert roles[0]["preferred_system"] == "alactic"
    assert not roles[0].get("sparse_combat_week_hard_fallback")
    assert week["combat_pressure_floor"]["active"] is False


def test_sparse_override_relaxes_only_aerobic_and_preserves_alactic() -> None:
    week = _week("SPP", must_keep=["aerobic", "alactic"])
    roles = _enforce_combat_pressure_floor(
        week,
        [_aerobic_role(), _alactic_role()],
        [],
        _athlete(),
    )
    assert roles[0]["preferred_system"] == "glycolytic"
    assert roles[0]["sparse_combat_week_hard_fallback"] is True
    assert roles[1]["preferred_system"] == "alactic"
    assert not roles[1].get("sparse_combat_week_hard_fallback")


def test_existing_safety_blockers_still_win_before_sparse_override() -> None:
    week = _week()
    roles = _enforce_combat_pressure_floor(
        week,
        [_aerobic_role()],
        [],
        _athlete(fatigue="high", readiness_flags=["high_fatigue"]),
    )
    assert roles[0]["preferred_system"] == "aerobic"
    assert week["combat_pressure_floor"]["active"] is False
    assert "high_fatigue" in week["combat_pressure_floor"]["reason_codes"]


def test_build_weekly_role_map_zero_combat_keeps_one_app_session_and_makes_it_hard() -> None:
    role_map = _build_weekly_role_map(
        _athlete(),
        _progression(),
        {"key": "general_fight_readiness"},
    )
    week = role_map["weeks"][0]
    sparse = _sparse_roles(week)
    assert len(sparse) == 1
    assert sparse[0]["preferred_system"] == "glycolytic"
    assert sparse[0]["mandatory_hard_conditioning_exposure"] is True
    assert len([role for role in week["session_roles"] if not role.get("coach_owned")]) == 1
    assert week["hard_sparring_plan"] == []


def test_build_weekly_role_map_one_light_day_preserves_coach_lock_and_one_app_session() -> None:
    role_map = _build_weekly_role_map(
        _athlete(support_work_days=["wednesday"]),
        _progression(),
        {"key": "general_fight_readiness"},
    )
    week = role_map["weeks"][0]
    sparse = _sparse_roles(week)
    assert len(sparse) == 1
    assert sparse[0]["preferred_system"] == "glycolytic"
    assert len([role for role in week["session_roles"] if not role.get("coach_owned")]) == 1

    light_roles = [
        role for role in week["session_roles"] if role.get("role_key") == "light_combat_day"
    ]
    assert len(light_roles) == 1
    assert light_roles[0]["coach_owned"] is True
    assert light_roles[0]["declared_day_locked"] is True
    assert light_roles[0]["scheduled_day_hint"] == "wednesday"


def test_finalizer_preserves_and_locks_sparse_hard_dose_via_canonical_compactor() -> None:
    week = _week()
    roles = _enforce_combat_pressure_floor(week, [_aerobic_role()], [], _athlete())
    week["session_roles"] = roles
    week["suppressed_roles"] = []
    week["declared_training_days"] = ["monday", "tuesday", "wednesday", "thursday"]
    weekly_role_map = {"weeks": [week]}
    packet = build_stage2_finalizer_packet(
        stage2_payload={},
        planning_brief={
            "athlete_snapshot": _athlete(),
            "weekly_role_map": weekly_role_map,
        },
    )
    compact_role = packet["selected_plan"]["weekly_role_map"]["weeks"][0]["session_roles"][0]
    assert compact_role["sparse_combat_week_hard_fallback"] is True
    assert compact_role["mandatory_hard_conditioning_exposure"] is True
    assert compact_role["prescribed_intensity_rpe"] == "8"
    assert "hard" in compact_role["prescribed_dose"].lower()
    assert any(
        "MUST remain a hard glycolytic/fight-pace exposure" in rule
        for rule in packet["hard_rules"]
    )
''')
          PY

      - name: Run targeted regressions
        run: |
          pytest -q \
            tests/test_sparse_combat_week_hard_conditioning.py \
            tests/test_combat_pressure_conditioning_floor.py \
            tests/test_stage2_finalizer_packet.py

      - name: Lint changed surfaces
        run: |
          ruff check \
            fightcamp/stage2_role_map.py \
            fightcamp/stage2_finalizer_packet.py \
            fightcamp/stage2_finalizer_packet_impl.py \
            tests/test_sparse_combat_week_hard_conditioning.py

      - name: Compile planner
        run: python -m compileall -q fightcamp

      - name: Commit surgical fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/surgical-sparse-week-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fightcamp/stage2_role_map.py \
                  fightcamp/stage2_finalizer_packet.py \
                  fightcamp/stage2_finalizer_packet_impl.py \
                  tests/test_sparse_combat_week_hard_conditioning.py \
                  .github/workflows/surgical-sparse-week-followup.yml
          git commit -m "Tighten sparse-week hard conditioning fallback"
          git push origin HEAD:codex/sparse-week-hard-conditioning-surgical
