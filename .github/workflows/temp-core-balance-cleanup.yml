name: temp-core-balance-cleanup

on:
  push:
    branches:
      - fix/core-balance-rehab-cost

permissions:
  contents: write

jobs:
  cleanup-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-balance-rehab-cost
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: python -m pip install -r requirements-dev-fast.txt
      - name: Remove stale import
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('fightcamp/strength.py')
          text = path.read_text(encoding='utf-8')
          old = '    count_support_only,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale import, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
      - name: Lint changed Python
        run: |
          ruff check fightcamp/strength.py fightcamp/strength_session_quality.py tests/test_strength_low_cost_support.py
          git diff --check
      - name: Run focused regressions
        run: |
          pytest -q \
            tests/test_strength_low_cost_support.py \
            tests/test_strength_metadata_selection.py \
            tests/test_strength_performance_caching.py \
            tests/test_selection_metadata_payload.py \
            -m "not spacy"
      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-core-balance-cleanup.yml
          git add fightcamp/strength.py
          git commit -m "Clean low-cost support accounting"
          git push origin HEAD:fix/core-balance-rehab-cost
