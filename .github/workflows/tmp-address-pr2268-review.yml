name: Address PR 2268 review blockers

on:
  push:
    branches:
      - fix/render-countdown-specific-sparring-cards
    paths:
      - .github/workflows/tmp-address-pr2268-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The three unrelated renderer failures are already fixed by the
          # test-only #2267 branch. Bring only that assertion file across so
          # #2268 can validate against the current renderer contract.
          git fetch origin agent/fix-week-overview-renderer-tests
          git checkout origin/agent/fix-week-overview-renderer-tests -- web/components/structured-plan-renderer.test.tsx

          python - <<'PY'
          from pathlib import Path

          structured = Path("web/lib/structured-plan.ts")
          text = structured.read_text()
          old = '''  if (dDay === 1) {
            return "Technical activation — no contact";
          }'''
          new = '''  if (dDay >= 0 && dDay <= 1) {
            return "Technical activation — no contact";
          }'''
          assert old in text, "D-1 activation branch not found"
          structured.write_text(text.replace(old, new, 1))

          countdown_test = Path("web/lib/structured-plan-sparring-countdown.test.ts")
          text = countdown_test.read_text()
          old_case = '    [1, "Technical activation — no contact"],\n'
          new_case = old_case + '    [0, "Technical activation — no contact"],\n'
          assert old_case in text, "D-1 countdown case not found"
          text = text.replace(old_case, new_case, 1)
          old_test = '''test("D-0 and explicit countdown-specific titles are not rewritten", () => {
            assert.equal(classifySessionlessDay(technicalDay(0)).title, "Technical-only combat");'''
          new_test = '''test("D-0 follows activation band while explicit countdown-specific titles are preserved", () => {
            assert.equal(
              classifySessionlessDay(technicalDay(0)).title,
              "Technical activation — no contact",
            );'''
          assert old_test in text, "obsolete D-0 assertion not found"
          countdown_test.write_text(text.replace(old_test, new_test, 1))

          renderer_test = Path("web/components/structured-plan-sparring-card.test.tsx")
          text = renderer_test.read_text()
          old_name = 'test("generic technical-only cards keep the existing Technical Combat title", () => {'
          new_name = 'test("generic D-17 technical-only cards use the fight-intensity title", () => {'
          assert old_name in text, "obsolete generic-card test name not found"
          text = text.replace(old_name, new_name, 1)
          old_expect = '  assert.equal(html.includes(\'<h3 class="sp-session-title">Technical Combat\'), true);'
          new_expect = '  assert.equal(html.includes(\'<h3 class="sp-session-title">Fight-intensity technical rounds\'), true);'
          assert old_expect in text, "obsolete Technical Combat expectation not found"
          renderer_test.write_text(text.replace(old_expect, new_expect, 1))
          PY

          rm .github/workflows/tmp-address-pr2268-review.yml
          git add web/lib/structured-plan.ts \
                  web/lib/structured-plan-sparring-countdown.test.ts \
                  web/components/structured-plan-sparring-card.test.tsx \
                  web/components/structured-plan-renderer.test.tsx \
                  .github/workflows/tmp-address-pr2268-review.yml
          git commit -m "Address PR #2268 review blockers"
          git push origin HEAD:fix/render-countdown-specific-sparring-cards
