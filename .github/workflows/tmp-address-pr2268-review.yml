name: Address PR 2268 review blockers

on:
  push:
    branches:
      - fix/render-countdown-specific-sparring-cards
    paths:
      - .github/workflows/tmp-address-pr2268-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # These three renderer assertions are already corrected in the
          # test-only #2267 branch and fail on the exact Main base of #2268.
          git fetch origin agent/fix-week-overview-renderer-tests
          git checkout origin/agent/fix-week-overview-renderer-tests -- web/components/structured-plan-renderer.test.tsx

          python - <<'PY'
          from pathlib import Path

          structured = Path("web/lib/structured-plan.ts")
          text = structured.read_text()
          old = "if (dDay === 1) {"
          new = "if (dDay >= 0 && dDay <= 1) {"
          assert text.count(old) == 1, "expected one D-1 activation branch"
          structured.write_text(text.replace(old, new, 1))

          countdown_test = Path("web/lib/structured-plan-sparring-countdown.test.ts")
          text = countdown_test.read_text()
          old_case = '[1, "Technical activation — no contact"],'
          assert text.count(old_case) == 1, "expected one D-1 countdown case"
          text = text.replace(
              old_case,
              old_case + '\n    [0, "Technical activation — no contact"],',
              1,
          )
          old_name = 'test("D-0 and explicit countdown-specific titles are not rewritten", () => {'
          new_name = 'test("D-0 follows activation band while explicit countdown-specific titles are preserved", () => {'
          assert text.count(old_name) == 1, "obsolete D-0 test name not found"
          text = text.replace(old_name, new_name, 1)
          old_assert = 'assert.equal(classifySessionlessDay(technicalDay(0)).title, "Technical-only combat");'
          new_assert = 'assert.equal(classifySessionlessDay(technicalDay(0)).title, "Technical activation — no contact");'
          assert text.count(old_assert) == 1, "obsolete D-0 expectation not found"
          countdown_test.write_text(text.replace(old_assert, new_assert, 1))

          card_test = Path("web/components/structured-plan-sparring-card.test.tsx")
          text = card_test.read_text()
          old_name = 'test("generic technical-only cards keep the existing Technical Combat title", () => {'
          new_name = 'test("generic D-17 technical-only cards use the fight-intensity title", () => {'
          assert text.count(old_name) == 1, "obsolete generic-card test name not found"
          text = text.replace(old_name, new_name, 1)
          old_title = '<h3 class="sp-session-title">Technical Combat'
          new_title = '<h3 class="sp-session-title">Fight-intensity technical rounds'
          assert text.count(old_title) == 1, "obsolete Technical Combat expectation not found"
          card_test.write_text(text.replace(old_title, new_title, 1))
          PY

          rm .github/workflows/tmp-address-pr2268-review.yml
          git add web/lib/structured-plan.ts \
                  web/lib/structured-plan-sparring-countdown.test.ts \
                  web/components/structured-plan-sparring-card.test.tsx \
                  web/components/structured-plan-renderer.test.tsx \
                  .github/workflows/tmp-address-pr2268-review.yml
          git commit -m "Address PR #2268 review blockers"
          git push origin HEAD:fix/render-countdown-specific-sparring-cards
