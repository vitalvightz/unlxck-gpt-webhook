name: Temp core movement-cap fix

on:
  push:
    branches:
      - fix/core-balance-rehab-cost
    paths:
      - .github/workflows/tmp-fix-core-movement-cap.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-balance-rehab-cost
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch movement-cap guard and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('fightcamp/strength.py')
          text = path.read_text()

          old = '''        selected_names = _selected_names(exercises)\n        bonus_entry = _best_candidate(\n            lambda cand, _score, _reasons, profile: (\n                bool(profile.get("core_balance_support"))\n                and _cached_guarded_decision(cand).action != "exclude"\n                and (\n                    not injuries\n                    or not _cached_injury_match(cand, ("name", "movement", "method"), ("exclude",))\n                )\n            ),\n            exclude_names=selected_names,\n        )\n'''
          new = '''        movement_counts: dict[str, int] = {}\n        for exercise in exercises:\n            movement = _cached_movement(exercise)\n            if movement != "unknown":\n                movement_counts[movement] = movement_counts.get(movement, 0) + 1\n\n        selected_names = _selected_names(exercises)\n        bonus_entry = _best_candidate(\n            lambda cand, _score, _reasons, profile: (\n                bool(profile.get("core_balance_support"))\n                and _cached_guarded_decision(cand).action != "exclude"\n                and (\n                    _cached_movement(cand) == "unknown"\n                    or movement_counts.get(_cached_movement(cand), 0) < 2\n                )\n                and (\n                    not injuries\n                    or not _cached_injury_match(cand, ("name", "movement", "method"), ("exclude",))\n                )\n            ),\n            exclude_names=selected_names,\n        )\n'''
          assert text.count(old) == 1, f'bonus selector replacement count={text.count(old)}'
          text = text.replace(old, new)

          old_post = '''    base_exercises = _run_real_poststep(\n        "core_balance_low_cost_bonus",\n        lambda: _append_core_balance_bonus(base_exercises),\n    )\n\n    _run_real_poststep("movement_normalization", lambda: [_cached_movement(ex) for ex in base_exercises])\n'''
          new_post = '''    base_exercises = _run_real_poststep(\n        "core_balance_low_cost_bonus",\n        lambda: _append_core_balance_bonus(base_exercises),\n    )\n    base_exercises = _run_real_poststep(\n        "movement_caps_after_core_balance_bonus",\n        lambda: _apply_movement_caps(base_exercises),\n    )\n\n    _run_real_poststep("movement_normalization", lambda: [_cached_movement(ex) for ex in base_exercises])\n'''
          assert text.count(old_post) == 1, f'poststep replacement count={text.count(old_post)}'
          text = text.replace(old_post, new_post)
          path.write_text(text)

          test_path = Path('tests/test_strength_low_cost_support.py')
          tests = test_path.read_text()
          addition = '''\n\ndef test_core_balance_bonus_cannot_bypass_existing_movement_cap(monkeypatch):\n    anchor_core = _support(\n        "Core Pattern Anchor",\n        movement="core",\n        tags=["anchor_core_score", "upper_body", "pull", "compound"],\n    )\n    core_one = _support(\n        "Pallof Hold One",\n        movement="core",\n        tags=["core_one_score", "core", "anti_rotation"],\n        equipment="bands",\n    )\n    core_two = _support(\n        "Pallof Hold Two",\n        movement="core",\n        tags=["core_two_score", "core", "stability"],\n        equipment="bands",\n    )\n    _patch_minimal_strength_runtime(\n        monkeypatch,\n        [anchor_core, core_one, core_two],\n        {"anchor_core_score": 10.0, "core_one_score": 9.0, "core_two_score": 8.0},\n    )\n    monkeypatch.setattr(\n        strength,\n        "calculate_exercise_numbers",\n        lambda *_args, **_kwargs: {"strength": 2},\n    )\n\n    prioritized = strength.generate_strength_block(\n        flags=_flags(weaknesses=["core stability"]),\n        weaknesses=["core stability"],\n    )\n\n    names = [exercise["name"] for exercise in prioritized["exercises"]]\n    movements = [exercise.get("movement") for exercise in prioritized["exercises"]]\n    assert len(names) == 2\n    assert movements.count("core") == 2\n    assert "Pallof Hold Two" not in names\n'''
          assert 'test_core_balance_bonus_cannot_bypass_existing_movement_cap' not in tests
          test_path.write_text(tests.rstrip() + addition + '\n')
          PY
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff pydantic
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Validate
        run: |
          git diff --check
          ruff check fightcamp/strength.py fightcamp/strength_session_quality.py tests/test_strength_low_cost_support.py
          pytest -q tests/test_strength_low_cost_support.py tests/test_strength_metadata_selection.py tests/test_strength_performance_caching.py tests/test_selection_metadata_payload.py -m "not spacy"
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/tmp-fix-core-movement-cap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve movement caps for core bonus"
          git push origin HEAD:fix/core-balance-rehab-cost
