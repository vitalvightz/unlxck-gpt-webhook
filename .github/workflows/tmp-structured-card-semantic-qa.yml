name: Temp structured card semantic QA
on:
  push:
    branches:
      - fix/structured-card-semantic-qa
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/structured-card-semantic-qa
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare temporary patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/tmp_patch_structured_semantic_qa.py')
          s = p.read_text()
          s, n = re.subn(
              r'\np = Path\("api/structured_plan_generation\.py"\).*?\np = Path\("web/lib/block-display-guardrails\.ts"\)',
              '\np = Path("web/lib/block-display-guardrails.ts")',
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1
          lines = s.splitlines()
          found = False
          for i, line in enumerate(lines):
              if "s, n = re.subn(r'selectCompactStopRule" in line:
                  lines[i] = "s, n = re.subn(r'selectCompactStopRule\\(\\s*stopRules,\\s*planSafetyTexts\\s*\\)', lambda _m: 'stopRules.map((rule) => rule.trim().replace(/^stop(?:\\\\s+rule)?\\\\s*:\\\\s*/i, \\\"\\\").trim()).find(Boolean) || null', s, count=1)"
                  found = True
                  break
          assert found
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Apply patch
        run: python scripts/tmp_patch_structured_semantic_qa.py
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest
      - name: Python validation
        run: |
          python -m ruff check api/structured_plan_semantic_qa.py api/stage2_automation.py api/structured_plan_safety.py tests/test_structured_plan_semantic_qa.py tests/test_structured_plan_safety.py
          python -m pytest -q tests/test_structured_plan_semantic_qa.py tests/test_structured_plan_stop_rules.py tests/test_structured_plan_safety.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Web validation
        working-directory: web
        run: |
          npm ci
          npx tsx --test lib/block-display-guardrails.test.ts
          npx tsc --noEmit
      - name: Diff validation
        run: git diff --check
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api tests web
          git commit -m 'fix: add semantic QA for athlete-facing cards'
          git rm .github/workflows/tmp-structured-card-semantic-qa.yml scripts/tmp_patch_structured_semantic_qa.py
          git commit -m 'chore: remove temporary semantic QA patch files'
          git push origin HEAD:fix/structured-card-semantic-qa
