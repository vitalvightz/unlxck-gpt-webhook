name: Update easing copy tests

on:
  push:
    branches:
      - agent/remove-easing-hold-copy

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/remove-easing-hold-copy

      - name: Update assertions and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("web/lib/today-authoritative.test.ts"): (
                  '  assert.match(resolved.banner.detail, /marking it easing does not lift the hold/);',
                  '  assert.match(resolved.banner.detail, /until it is cleared or medically cleared/);\n'
                  '  assert.doesNotMatch(resolved.banner.detail, /marking it easing does not lift the hold/);',
              ),
              Path("web/lib/today.test.ts"): (
                  '  assert.match(banner?.detail ?? "", /easing does not lift/);',
                  '  assert.match(banner?.detail ?? "", /until it is cleared or medically cleared/);\n'
                  '  assert.doesNotMatch(banner?.detail ?? "", /easing does not lift/);',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {text.count(old)}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          git rm -f .github/workflows/update-easing-copy-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update severe injury copy tests"
          git push origin HEAD:agent/remove-easing-hold-copy
