name: Validate JSON Banks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      
      - name: Run bank validator
        run: python tools/validate_banks.py

      # Human-readable inventory remains available in logs for taxonomy review.
      - name: Audit tag registry
        run: python tools/audit_tag_registry.py

      # Persisted bank data must already be canonical. This catches reintroduced
      # aliases, setup/nonsemantic tag tokens, metadata field names in the
      # vocabulary, and the strength metadata pseudo-tag fallback.
      - name: Check tag data migration is up to date
        run: python tools/migrate_tag_registry_data.py --check

      # Blocking focused gate: vocabulary, scoring, runtime controls, generated
      # injury/safety tags, and reviewed bank-only decisions must stay closed.
      - name: Enforce tag authority
        run: python tools/check_tag_registry.py

      # Blocking gate: the rehab bank must satisfy its data contract. Unlike the
      # wider cross-bank validator above, this exits non-zero on any schema error.
      - name: Validate rehab bank data contract
        run: python tools/validate_rehab_bank.py

      # The rehab bank's derived fields (drill ids, keyword-matched function
      # classes) are generated, not hand-written. Fail if they drifted.
      - name: Check rehab bank migration is up to date
        run: python tools/migrate_rehab_bank_schema.py --check
