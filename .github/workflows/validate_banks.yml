name: Validate JSON Banks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      
      - name: Run bank validator
        run: python tools/validate_banks.py

      # Blocking gate: the rehab bank must satisfy its data contract. Unlike the
      # cross-bank audit above, this exits non-zero on any schema error.
      - name: Validate rehab bank data contract
        run: python tools/validate_rehab_bank.py

      # The rehab bank's derived fields (drill ids, keyword-matched function
      # classes) are generated, not hand-written. Fail if they drifted.
      - name: Check rehab bank migration is up to date
        run: python tools/migrate_rehab_bank_schema.py --check

  canonicalize-style-bank-metadata:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'codex/consolidate-style-strength-bank' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: codex/consolidate-style-strength-bank
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Canonicalize metadata encoding
        run: python .github/scripts/canonicalize_style_bank_metadata.py

      - name: Restore temporary cleanup plumbing
        run: |
          git show origin/Main:.github/workflows/validate_banks.yml > .github/workflows/validate_banks.yml
          rm .github/scripts/canonicalize_style_bank_metadata.py

      - name: Commit metadata cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bank_inferred_tags.json .github/workflows/validate_banks.yml .github/scripts/canonicalize_style_bank_metadata.py
          if git diff --cached --quiet; then
            echo "No metadata cleanup needed"
            exit 0
          fi
          git commit -m "Canonicalize style bank metadata diff"
          git push origin HEAD:codex/consolidate-style-strength-bank
