name: Validate JSON Banks

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - '**'

concurrency:
  group: validate-banks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"

      - name: Run bank validator
        run: python tools/validate_banks.py

      - name: Audit tag registry
        run: python tools/audit_tag_registry.py

      - name: Check tag data migration is up to date
        run: python tools/migrate_tag_registry_data.py --check

      - name: Enforce tag authority
        run: python tools/check_tag_registry.py

      - name: Validate rehab bank data contract
        run: python tools/validate_rehab_bank.py

      - name: Audit injury vocabulary consistency
        run: python tools/audit_injury_vocabulary.py

      - name: Check rehab bank migration is up to date
        run: python tools/migrate_rehab_bank_schema.py --check

      - name: Validate rehab review coverage
        run: python tools/validate_rehab_metadata_review.py

      - name: Validate clinical rehab policies
        run: |
          python -m pip install 'pydantic>=2,<3'
          python tools/validate_rehab_clinical.py
