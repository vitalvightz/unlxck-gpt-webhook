name: Validate JSON Banks

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      
      - name: Run bank validator
        run: python tools/validate_banks.py

      # Blocking gate: the rehab bank must satisfy its data contract. Unlike the
      # cross-bank audit above, this exits non-zero on any schema error.
      - name: Validate rehab bank data contract
        run: python tools/validate_rehab_bank.py

      # The rehab bank's derived fields (drill ids, keyword-matched function
      # classes) are generated, not hand-written. Fail if they drifted.
      - name: Check rehab bank migration is up to date
        run: python tools/migrate_rehab_bank_schema.py --check

  consolidate-style-strength-bank:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/consolidate-style-strength-bank'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: codex/consolidate-style-strength-bank
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Consolidate style strength bank
        run: python .github/scripts/consolidate_style_strength_bank.py

      - name: Validate transformed code and data
        shell: bash
        run: |
          python -m compileall -q fightcamp/strength.py fightcamp/injury_filtering.py tests/test_style_logic.py tests/test_bank_schema_validation.py tests/test_strength_metadata_selection.py
          python - <<'PY'
          import json
          from pathlib import Path
          bank = json.loads(Path('data/exercise_bank.json').read_text(encoding='utf-8'))
          names = [item['name'] for item in bank]
          assert len(names) == len(set(names))
          required = {
              'Wrist Roller Extensions',
              'Barbell Thruster',
              'Turkish Get-Up',
              'Counter-Striker Split-Line Punch Isometric Hold',
              'Pressure-Fighter Staggered Body-Shot Med-Ball Throw',
          }
          assert required <= set(names)
          assert not Path('data/style_specific_exercises').exists()
          PY

      - name: Restore temporary migration plumbing
        shell: bash
        run: |
          git show origin/Main:.github/workflows/validate_banks.yml > .github/workflows/validate_banks.yml
          rm -f .github/scripts/consolidate_style_strength_bank.py
          rm -f .github/workflows/consolidate-style-strength-bank.yml

      - name: Commit consolidation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/exercise_bank.json data/bank_inferred_tags.json data/injury_exclusion_map.json fightcamp/strength.py fightcamp/injury_filtering.py tests/test_d3_sandbag_source_guard.py tests/test_equipment_availability.py tests/test_session_restraint.py tests/test_late_camp_selector_rebalance.py tests/test_strength_low_cost_support.py tests/test_trap_bar_squat_preference.py tests/test_strength_metadata_selection.py tests/test_style_logic.py tests/test_bank_schema_validation.py .github/workflows/validate_banks.yml
          git rm --ignore-unmatch -- data/style_specific_exercises .github/scripts/consolidate_style_strength_bank.py .github/workflows/consolidate-style-strength-bank.yml
          git diff --cached --check
          git commit -m "refactor: consolidate style strength exercises [style-bank-migration]"
          git push origin HEAD:codex/consolidate-style-strength-bank
