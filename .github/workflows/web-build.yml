name: Web Build

on:
  push:
    branches:
      - Main
  pull_request:
    branches:
      - "**"

concurrency:
  group: web-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coaching-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements-dev-fast.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-dev-fast.txt
      - run: npm ci --prefix web
      - name: Verify the persisted athlete-visible coaching cards
        run: |
          test -d web/node_modules/tsx
          python -m pytest tests/test_exercise_coaching_release.py tests/test_exercise_coaching_context.py tests/test_measurable_exercise_coaching.py tests/test_concise_exercise_coaching.py -q

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Dependency audit (high/critical only)
        run: npm run audit:high

      - name: Build frontend with CI-safe API base URL
        env:
          # Placeholder public values only — no real secrets. NEXT_PUBLIC_* are
          # inlined at build time so the smoke server can boot the Supabase
          # client without crashing. Smoke tests block all real network traffic.
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
        run: npm run build

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Frontend smoke + accessibility tests
        env:
          # `next start` re-evaluates rewrites() at runtime, so it needs the API
          # base URL present. Placeholder only; tests never hit a real backend.
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
