name: Apply pre-hard strength integration patch

on:
  push:
    branches:
      - codex/cap-pre-hard-spar-strength

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cap-pre-hard-spar-strength
          fetch-depth: 0
      - name: Patch canonical role-map owner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('fightcamp/stage2_role_map.py')
          text = path.read_text()

          import_anchor = '''from .allocator_priority import (\n    allocation_sort_key,\n    late_camp_week_reference_d_day,\n    readiness_compression_floor_with_late_cut,\n)\n'''
          import_replacement = import_anchor + '''from .pre_hard_contact_strength import apply_pre_hard_contact_strength_exposure_cap\n'''
          if 'from .pre_hard_contact_strength import apply_pre_hard_contact_strength_exposure_cap' not in text:
              if import_anchor not in text:
                  raise SystemExit('allocator import anchor not found')
              text = text.replace(import_anchor, import_replacement, 1)

          call_anchor = '''    weekly_role_map = apply_fight_day_override_to_weekly_role_map(weekly_role_map, athlete_model)\n    # Stamp deterministic athlete-facing labels so Stage 1 owns the session\n'''
          call_replacement = '''    weekly_role_map = apply_fight_day_override_to_weekly_role_map(weekly_role_map, athlete_model)\n    # Normal role-budget consequence of the shared collision policy: if the\n    # highest-priority strength exposure must sit immediately before resolved\n    # effective hard contact, keep one meaningful strength exposure and mark the\n    # surviving role for downstream dose resolution. No two-days-before rule.\n    weekly_role_map = apply_pre_hard_contact_strength_exposure_cap(\n        weekly_role_map, athlete_model\n    )\n    # Stamp deterministic athlete-facing labels so Stage 1 owns the session\n'''
          if 'weekly_role_map = apply_pre_hard_contact_strength_exposure_cap(' not in text:
              if call_anchor not in text:
                  raise SystemExit('fight-day override call anchor not found')
              text = text.replace(call_anchor, call_replacement, 1)

          path.write_text(text)
          workflow = Path('.github/workflows/zz-apply-pre-hard-strength-patch.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Syntax check
        run: python -m py_compile fightcamp/stage2_role_map.py fightcamp/pre_hard_contact_strength.py fightcamp/prescription_resolver.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wire pre-hard strength policy into role-map owner"
          git push origin HEAD:codex/cap-pre-hard-spar-strength
