name: Finish pre-hard strength PR

on:
  push:
    branches:
      - codex/cap-pre-hard-spar-strength

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cap-pre-hard-spar-strength
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Patch finalizer, goal contract, and architecture contract
        run: |
          python - <<'PY'
          from pathlib import Path

          finalizer = Path('fightcamp/stage2_finalizer_packet_impl.py')
          text = finalizer.read_text()
          anchor = '''            "If a session role carries effective_strength_envelope, treat it as a hard ceiling: do not render more sets than effective_strength_envelope.max_sets, more reps than max_reps (for the loaded anchor/secondary lifts), or a higher RPE than rpe_cap_high. If effective_strength_envelope.loaded_allowed is false, render no loaded strength lifting on that day — neural/primer, readiness, or mobility work only.",\n'''
          addition = anchor + '''            "If effective_strength_envelope.complete_exercise_allow_list is true, effective_strength_envelope.allowed_exercise_names is the complete S&C exercise allow-list for that strength role. Render only those named exercises; do not restore omitted candidates, add another loaded lift, or invent another strength, power, plyometric, trunk, or support exercise for that session. If effective_strength_envelope.forbid_slow_eccentric_emphasis is true, do not restore a slow/tempo eccentric prescription from the base exercise-bank text.",\n'''
          if 'effective_strength_envelope.complete_exercise_allow_list is true' not in text:
              if anchor not in text:
                  raise SystemExit('finalizer envelope hard-rule anchor not found')
              text = text.replace(anchor, addition, 1)
              finalizer.write_text(text)

          goal = Path('fightcamp/goal_preservation.py')
          text = goal.read_text()
          goal_anchor = '''    "fight_week_override": "fight_proximity",\n}'''
          goal_replacement = '''    "fight_week_override": "fight_proximity",\n    "pre_hard_contact_strength_exposure_cap": "pre_hard_contact_managed_stress",\n}'''
          if '"pre_hard_contact_strength_exposure_cap": "pre_hard_contact_managed_stress"' not in text:
              if goal_anchor not in text:
                  raise SystemExit('goal-preservation compression-map anchor not found')
              text = text.replace(goal_anchor, goal_replacement, 1)
              goal.write_text(text)

          contract = Path('PLANNER_ARCHITECTURE_CONTRACT.md')
          text = contract.read_text()
          old_row = '''| Weekly role budget / which app-owned roles survive | `stage2_role_map.py`, `stage2_payload.py`, late-fight permission/budget code | Normal camp: `stage2_role_map.py`; D-13 inward: late-fight permission/budget path | Finalizer renders only surviving roles | Renderer/finalizer restoring suppressed roles to make a week look complete |'''
          new_row = '''| Weekly role budget / which app-owned roles survive | `stage2_role_map.py` (with subordinate `pre_hard_contact_strength.py` helper), `stage2_payload.py`, late-fight permission/budget code | Normal camp: `stage2_role_map.py`; D-13 inward: late-fight permission/budget path | Finalizer renders only surviving roles; the subordinate pre-hard-contact helper may apply the role-map owner's one-strength-exposure consequence after canonical placement | Renderer/finalizer restoring suppressed roles to make a week look complete; the helper inventing its own contact/spacing rule |'''
          if 'subordinate `pre_hard_contact_strength.py` helper' not in text:
              if old_row not in text:
                  raise SystemExit('architecture role-budget row anchor not found')
              text = text.replace(old_row, new_row, 1)

          old_flow = '''  -> stage2_role_map._build_weekly_role_map\n       (role budget/compression, then _assign_declared_day_hints placement\n        through shared combat_load_policy legality)\n  -> normal_calendar_placement.fill_missing_session_days'''
          new_flow = '''  -> stage2_role_map._build_weekly_role_map\n       (role budget/compression, then _assign_declared_day_hints placement\n        through shared combat_load_policy legality; after placement, the\n        subordinate pre-hard-contact helper may cap the week to one meaningful\n        strength exposure only when that canonical policy returned\n        pre_hard_contact_managed_stress)\n  -> normal_calendar_placement.fill_missing_session_days'''
          if 'subordinate pre-hard-contact helper may cap the week' not in text:
              if old_flow not in text:
                  raise SystemExit('architecture execution-flow anchor not found')
              text = text.replace(old_flow, new_flow, 1)
          contract.write_text(text)

          test_path = Path('tests/test_pre_hard_contact_strength.py')
          test_text = test_path.read_text()
          if 'test_goal_deferral_contract_recognises_pre_hard_strength_cap' not in test_text:
              test_text += '''\n\ndef test_goal_deferral_contract_recognises_pre_hard_strength_cap() -> None:\n    from fightcamp.goal_preservation import _deferral_constraints\n\n    brief = {\n        "athlete_snapshot": {"days_until_fight": 24},\n        "weekly_role_map": {\n            "weeks": [\n                {\n                    "week_index": 1,\n                    "calendar_days": [{"weekday": "Monday", "d_day": 23}],\n                    "session_roles": [],\n                    "suppressed_roles": [\n                        {\n                            "category": "strength",\n                            "role_key": "secondary_strength_day",\n                            "compression_reason_codes": [\n                                PRE_HARD_CONTACT_STRENGTH_CAP_REASON\n                            ],\n                        }\n                    ],\n                }\n            ]\n        },\n    }\n    missing = [{"min_d_day": 20, "max_d_day": 24}]\n    constraints = _deferral_constraints({"goal": "strength"}, brief, missing)\n    assert constraints\n    assert constraints[0]["reason_code"] == "pre_hard_contact_managed_stress"\n    assert constraints[0]["source_reason_code"] == PRE_HARD_CONTACT_STRENGTH_CAP_REASON\n'''
              test_path.write_text(test_text)

          workflow = Path('.github/workflows/zz-finish-pre-hard-strength-pr.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Install focused test dependencies
        env:
          PIP_RETRIES: "5"
          PIP_DEFAULT_TIMEOUT: "60"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint changed Python
        run: |
          ruff check \
            fightcamp/pre_hard_contact_strength.py \
            fightcamp/prescription_resolver.py \
            fightcamp/stage2_role_map.py \
            fightcamp/stage2_finalizer_packet_impl.py \
            fightcamp/goal_preservation.py \
            tests/test_pre_hard_contact_strength.py

      - name: Run focused regressions
        run: |
          pytest -q \
            tests/test_pre_hard_contact_strength.py \
            tests/test_prescription_resolver.py \
            tests/test_prescription_resolver_e2e.py \
            tests/test_combat_load_policy.py \
            tests/test_goal_repair_effective_contact_policy.py \
            -k 'not production_d16_wrapped_barbell_back_squat_rep_overage_blocks_and_requests_repair'

      - name: Commit completed implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finish pre-hard strength contract and focused regressions"
          git push origin HEAD:codex/cap-pre-hard-spar-strength
