name: Fix PR 2435 audit blockers

on:
  push:
    branches:
      - codex/cap-pre-hard-spar-strength

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cap-pre-hard-spar-strength
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Apply fixes
        run: |
          python .github/scripts/fix_pr2435_audit.py
          python .github/scripts/fix_pr2435_followup.py
          python .github/scripts/fix_pr2435_followup2.py

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint changed Python
        run: >-
          ruff check fightcamp/pre_hard_contact_strength.py fightcamp/prescription_resolver.py
          fightcamp/stage2_role_map.py fightcamp/late_camp_role_morph.py
          fightcamp/stage2_validator.py fightcamp/stage2_finalizer_packet_impl.py
          fightcamp/goal_preservation.py tests/test_pre_hard_contact_strength.py

      - name: Run focused regressions
        run: >-
          pytest -q tests/test_pre_hard_contact_strength.py tests/test_prescription_resolver.py
          tests/test_prescription_resolver_e2e.py tests/test_calendar_integrity.py
          tests/test_late_camp_role_morph.py tests/test_goal_repair_effective_contact_policy.py
          tests/test_stage2_validator.py
          -k 'not production_d16_wrapped_barbell_back_squat_rep_overage_blocks_and_requests_repair'

      - name: Commit fixes
        run: |
          rm -f .github/workflows/zz-fix-pr2435-audit.yml \
            .github/scripts/fix_pr2435_audit.py \
            .github/scripts/fix_pr2435_followup.py \
            .github/scripts/fix_pr2435_followup2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close PR 2435 audit blockers"
          git push origin HEAD:codex/cap-pre-hard-spar-strength
