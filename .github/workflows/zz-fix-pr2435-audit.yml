name: Fix PR 2435 audit blockers

on:
  push:
    branches:
      - codex/cap-pre-hard-spar-strength

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cap-pre-hard-spar-strength
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Apply lifecycle, validator, repair and low-cost fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Do not decide the pre-hard strength consequence before final calendar integrity.
          role_map = Path('fightcamp/stage2_role_map.py')
          text = role_map.read_text()
          text = text.replace('from .pre_hard_contact_strength import apply_pre_hard_contact_strength_exposure_cap\n', '')
          early = '''    # Normal role-budget consequence of the shared collision policy: if the\n    # highest-priority strength exposure must sit immediately before resolved\n    # effective hard contact, keep one meaningful strength exposure and mark the\n    # surviving role for downstream dose resolution. No two-days-before rule.\n    weekly_role_map = apply_pre_hard_contact_strength_exposure_cap(\n        weekly_role_map, athlete_model\n    )\n'''
          if early not in text:
              raise SystemExit('early pre-hard role-map call not found')
          text = text.replace(early, '', 1)
          role_map.write_text(text)

          morph = Path('fightcamp/late_camp_role_morph.py')
          text = morph.read_text()
          old = '''    from .calendar_integrity import apply_final_calendar_integrity\n\n    return apply_final_calendar_integrity(\n        weekly_role_map,\n        remorph_callback=_apply_late_camp_role_morph_once,\n    )\n'''
          new = '''    from .calendar_integrity import apply_final_calendar_integrity\n    from .pre_hard_contact_strength import apply_pre_hard_contact_strength_exposure_cap\n\n    weekly_role_map = apply_final_calendar_integrity(\n        weekly_role_map,\n        remorph_callback=_apply_late_camp_role_morph_once,\n    )\n    # The pre-hard-contact consequence depends on the finished calendar, not an\n    # earlier placement guess. Running it here also makes goal-repair trials pass\n    # through the same one-strength-exposure policy before dose resolution.\n    return apply_pre_hard_contact_strength_exposure_cap(weekly_role_map)\n'''
          if old not in text:
              raise SystemExit('late-camp morph final-integrity return anchor not found')
          morph.write_text(text.replace(old, new, 1))

          # The normal-camp helper must never take ownership of D-13 inward.
          helper = Path('fightcamp/pre_hard_contact_strength.py')
          text = helper.read_text()
          old = '''    if profile is None or d_day is None:\n        return None\n'''
          new = '''    if profile is None or d_day is None:\n        return None\n    # D-14 and farther out belongs to the normal planner. D-13 inward is owned\n    # by the finished late-fight path and must not be recompressed here.\n    if d_day < 14:\n        return None\n'''
          if old not in text:
              raise SystemExit('pre-hard D-day guard anchor not found')
          helper.write_text(text.replace(old, new, 1))

          # 2) "Low-cost" must be proven, not inferred from absent/unknown metadata.
          resolver = Path('fightcamp/prescription_resolver.py')
          text = resolver.read_text()
          old = '''_HIGH_COST_LEVELS = frozenset({"high", "very_high", "very high", "severe", "extreme"})\n_PRE_HARD_COST_FIELDS = ("impact_cost", "landing_cost", "eccentric_cost", "soreness_risk")\n'''
          new = '''_VERIFIED_LOW_COST_LEVELS = frozenset(\n    {"none", "low", "very low", "minimal", "negligible", "not applicable", "n/a"}\n)\n_PRE_HARD_COST_FIELDS = ("impact_cost", "landing_cost", "eccentric_cost", "soreness_risk")\n'''
          if old not in text:
              raise SystemExit('pre-hard cost constants anchor not found')
          text = text.replace(old, new, 1)
          old = '''def _pre_hard_high_cost(slot: dict[str, Any]) -> bool:\n    for field in _PRE_HARD_COST_FIELDS:\n        value = _cost_value(slot, field).replace("_", " ")\n        if value in _HIGH_COST_LEVELS:\n            return True\n    return False\n'''
          new = '''def _pre_hard_verified_low_cost(slot: dict[str, Any]) -> bool:\n    """Require affirmative low/none cost metadata for the optional second item."""\n    values = [\n        _cost_value(slot, field).replace("_", " ")\n        for field in _PRE_HARD_COST_FIELDS\n    ]\n    return all(value and value in _VERIFIED_LOW_COST_LEVELS for value in values)\n'''
          if old not in text:
              raise SystemExit('pre-hard high-cost helper anchor not found')
          text = text.replace(old, new, 1)
          old = '''        if kind in {"power", "support"}:\n            if additional_used or _pre_hard_high_cost(slot):\n                continue\n            allowed.append(slot)\n            additional_used = True\n'''
          new = '''        if kind in {"power", "support"}:\n            if additional_used or not _pre_hard_verified_low_cost(slot):\n                continue\n            allowed.append(slot)\n            additional_used = True\n'''
          if old not in text:
              raise SystemExit('pre-hard optional-item selection anchor not found')
          resolver.write_text(text.replace(old, new, 1))

          # 3) Deterministically enforce the complete pre-hard exercise allow-list.
          validator = Path('fightcamp/stage2_validator.py')
          text = validator.read_text()
          old = '''            blocks = blocks_by_day.get(d_day)\n            if not blocks:\n                continue\n            prescriptions = [\n'''
          new = '''            blocks = blocks_by_day.get(d_day)\n            if not blocks:\n                continue\n\n            # A pre-hard-contact strength envelope can narrow the whole S&C\n            # exercise selection, not only sets/reps on loaded lifts. Enforce\n            # that complete allow-list deterministically so the finalizer cannot\n            # restore a removed plyometric/support exercise or invent a new one.\n            if envelope.get("complete_exercise_allow_list") is True:\n                allowed_names = [\n                    str(name).strip()\n                    for name in (envelope.get("allowed_exercise_names") or [])\n                    if str(name).strip()\n                ]\n                for block in blocks:\n                    for rendered_line in block.get("lines") or []:\n                        if not _late_fight_line_is_exercise_like(rendered_line):\n                            continue\n                        if _late_fight_line_is_generic_allowed(rendered_line):\n                            continue\n                        rendered_label = _rendered_exercise_label(rendered_line)\n                        if _normalize_render_line(rendered_label).startswith(\n                            ("rest", "load", "tempo", "rpe", "sets", "reps")\n                        ):\n                            continue\n                        if any(_line_has_exercise(rendered_line, name) for name in allowed_names):\n                            continue\n                        identity = (\n                            d_day,\n                            "exercise_allow_list",\n                            _normalize_render_line(rendered_line),\n                        )\n                        if identity in seen:\n                            continue\n                        seen.add(identity)\n                        warnings.append(\n                            {\n                                "code": "late_camp_effective_prescription_exceeded",\n                                "message": (\n                                    f"D-{d_day} renders S&C exercise '{rendered_label}' outside "\n                                    "the resolved complete exercise allow-list."\n                                ),\n                                "severity": "blocker",\n                                "confidence": "high",\n                                "line": rendered_line,\n                                "scheduled_d_day": d_day,\n                                "exercise": rendered_label,\n                                "rendered_exercise": rendered_label,\n                                "role_key": role.get("role_key"),\n                                "violation_dimensions": ["exercise_allow_list"],\n                                "allowed_exercises": allowed_names,\n                                "effective_prescription": "exercise not allowed for this session",\n                                "dose_adjustment_reason": envelope.get("dose_adjustment_reason"),\n                            }\n                        )\n\n            prescriptions = [\n'''
          if old not in text:
              raise SystemExit('validator effective-envelope anchor not found')
          validator.write_text(text.replace(old, new, 1))

          # Keep the frozen ownership contract truthful about when this consequence runs.
          contract = Path('PLANNER_ARCHITECTURE_CONTRACT.md')
          text = contract.read_text()
          old = '''| Weekly role budget / which app-owned roles survive | `stage2_role_map.py` (with subordinate `pre_hard_contact_strength.py` helper), `stage2_payload.py`, late-fight permission/budget code | Normal camp: `stage2_role_map.py`; D-13 inward: late-fight permission/budget path | Finalizer renders only surviving roles; the subordinate pre-hard-contact helper may apply the role-map owner's one-strength-exposure consequence after canonical placement | Renderer/finalizer restoring suppressed roles to make a week look complete; the helper inventing its own contact/spacing rule |'''
          new = '''| Weekly role budget / which app-owned roles survive | `stage2_role_map.py` (with subordinate `pre_hard_contact_strength.py` helper), `stage2_payload.py`, late-fight permission/budget code | Normal camp: `stage2_role_map.py`; D-13 inward: late-fight permission/budget path | Finalizer renders only surviving roles; the subordinate pre-hard-contact helper applies the role-map owner's one-strength-exposure consequence only after final calendar integrity has fixed the normal-camp schedule | Renderer/finalizer restoring suppressed roles to make a week look complete; the helper inventing its own contact/spacing rule |'''
          if old not in text:
              raise SystemExit('architecture ownership row anchor not found')
          text = text.replace(old, new, 1)
          old = '''  -> stage2_role_map._build_weekly_role_map\n       (role budget/compression, then _assign_declared_day_hints placement\n        through shared combat_load_policy legality; after placement, the\n        subordinate pre-hard-contact helper may cap the week to one meaningful\n        strength exposure only when that canonical policy returned\n        pre_hard_contact_managed_stress)\n  -> normal_calendar_placement.fill_missing_session_days\n       (placement completion, same shared legality)\n  -> apply_camp_week_fillers            (support inserts, gated by shared legality)\n  -> splice finished D-13 tail when applicable\n  -> apply_late_camp_role_morph\n       (countdown dose, then apply_final_calendar_integrity — the governor is the\n        last deterministic stage and re-runs dose-only morph if it relocates a role)\n  -> stamp labels\n'''
          new = '''  -> stage2_role_map._build_weekly_role_map\n       (role budget/compression, then _assign_declared_day_hints placement\n        through shared combat_load_policy legality)\n  -> normal_calendar_placement.fill_missing_session_days\n       (placement completion, same shared legality)\n  -> apply_camp_week_fillers            (support inserts, gated by shared legality)\n  -> splice finished D-13 tail when applicable\n  -> apply_late_camp_role_morph\n       (countdown dose, then apply_final_calendar_integrity — the governor fixes\n        the final calendar and re-runs dose-only morph if it relocates a role;\n        only after that does the subordinate pre-hard-contact helper apply the\n        normal role-budget consequence on D-14+ days)\n  -> stamp labels\n'''
          if old not in text:
              raise SystemExit('architecture execution-flow anchor not found')
          contract.write_text(text.replace(old, new, 1))

          # Regressions for all audit findings.
          tests = Path('tests/test_pre_hard_contact_strength.py')
          text = tests.read_text()
          import_anchor = '''from fightcamp.prescription_resolver import apply_effective_strength_prescriptions\n'''
          import_replacement = '''from fightcamp.prescription_resolver import apply_effective_strength_prescriptions\nfrom fightcamp.late_camp_role_morph import apply_late_camp_role_morph\nfrom fightcamp.stage2_validator import _late_camp_effective_prescription_warnings\n'''
          if 'from fightcamp.late_camp_role_morph import apply_late_camp_role_morph' not in text:
              if import_anchor not in text:
                  raise SystemExit('test import anchor not found')
              text = text.replace(import_anchor, import_replacement, 1)

          additions = r'''


def test_pre_hard_policy_runs_after_final_calendar_integrity_via_morph() -> None:
    weekly = _map()
    apply_late_camp_role_morph(weekly)
    role = _role(weekly)
    assert role["pre_hard_contact_managed_stress"] is True
    assert role["pre_hard_contact_effective_hard_distance"] == 1


def test_normal_pre_hard_policy_does_not_take_ownership_inside_d13() -> None:
    weekly = _map(strength_d_day=13, hard_d_day=12)
    before = deepcopy(weekly)
    apply_pre_hard_contact_strength_exposure_cap(weekly)
    assert weekly == before


def test_unknown_cost_support_is_not_treated_as_verified_low_cost() -> None:
    weekly = _map()
    apply_pre_hard_contact_strength_exposure_cap(weekly)
    unknown_support = _low_cost_support_slot()
    unknown_support["selected"].pop("selection_metadata", None)
    apply_effective_strength_prescriptions(
        weekly_role_map=weekly,
        candidate_pools=_candidate_pools(_anchor_slot(), unknown_support),
        athlete_model={"fatigue": "low"},
    )
    names = [item["name"] for item in _role(weekly)["effective_strength_prescriptions"]]
    assert names == ["Romanian Deadlift (RDL)"]


def test_repair_like_second_strength_role_is_recompressed_by_final_morph() -> None:
    weekly = _map()
    apply_late_camp_role_morph(weekly)
    week = weekly["weeks"][0]
    week["session_roles"].append(
        _strength("Thursday", session_index=2, strength_session_index=2)
    )
    apply_late_camp_role_morph(weekly)
    strength_roles = [
        role for role in week["session_roles"] if role.get("category") == "strength"
    ]
    assert len(strength_roles) == 1
    assert strength_roles[0]["role_key"] == "primary_strength_day"
    assert any(
        PRE_HARD_CONTACT_STRENGTH_CAP_REASON
        in (row.get("compression_reason_codes") or [])
        for row in week.get("suppressed_roles") or []
    )


def test_complete_pre_hard_allow_list_blocks_removed_exercise_in_render() -> None:
    brief = {
        "weekly_role_map": {
            "weeks": [
                {
                    "week_index": 1,
                    "session_roles": [
                        {
                            "category": "strength",
                            "role_key": "primary_strength_day",
                            "effective_strength_envelope": {
                                "scheduled_d_day": 23,
                                "loaded_allowed": True,
                                "rpe_cap_high": 7,
                                "max_sets": 3,
                                "max_reps": 3,
                                "complete_exercise_allow_list": True,
                                "allowed_exercise_names": ["Romanian Deadlift (RDL)"],
                                "dose_adjustment_reason": "pre_hard_contact_strength_retention",
                            },
                            "effective_strength_prescriptions": [
                                {
                                    "name": "Romanian Deadlift (RDL)",
                                    "dose_role_kind": "anchor",
                                    "effective_loaded": True,
                                    "effective_max_sets": 3,
                                    "effective_max_reps": 3,
                                    "effective_rpe_cap": 7,
                                }
                            ],
                        }
                    ],
                }
            ]
        }
    }
    rendered = "\n".join(
        [
            "D-23 (Monday) — Strength",
            "- Romanian Deadlift (RDL): 3 x 3 @ RPE 6",
            "- Single-Leg Forward Hops: 3 x 5",
        ]
    )
    warnings = _late_camp_effective_prescription_warnings(brief, rendered)
    allow_list_findings = [
        item
        for item in warnings
        if "exercise_allow_list" in (item.get("violation_dimensions") or [])
    ]
    assert len(allow_list_findings) == 1
    assert allow_list_findings[0]["code"] == "late_camp_effective_prescription_exceeded"
    assert allow_list_findings[0]["rendered_exercise"] == "Single-Leg Forward Hops"
'''
          if 'test_complete_pre_hard_allow_list_blocks_removed_exercise_in_render' not in text:
              text += additions
          tests.write_text(text)

          # Remove this one-shot workflow in the implementation commit.
          workflow = Path('.github/workflows/zz-fix-pr2435-audit.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Install focused test dependencies
        env:
          PIP_RETRIES: "5"
          PIP_DEFAULT_TIMEOUT: "60"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint changed Python
        run: |
          ruff check \
            fightcamp/pre_hard_contact_strength.py \
            fightcamp/prescription_resolver.py \
            fightcamp/stage2_role_map.py \
            fightcamp/late_camp_role_morph.py \
            fightcamp/stage2_validator.py \
            fightcamp/stage2_finalizer_packet_impl.py \
            fightcamp/goal_preservation.py \
            tests/test_pre_hard_contact_strength.py

      - name: Run focused regressions
        run: |
          pytest -q \
            tests/test_pre_hard_contact_strength.py \
            tests/test_prescription_resolver.py \
            tests/test_prescription_resolver_e2e.py \
            tests/test_calendar_integrity.py \
            tests/test_late_camp_role_morph.py \
            tests/test_goal_preservation.py \
            tests/test_goal_repair_effective_contact_policy.py \
            tests/test_stage2_validator.py \
            -k 'not production_d16_wrapped_barbell_back_squat_rep_overage_blocks_and_requests_repair'

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close PR 2435 audit blockers"
          git push origin HEAD:codex/cap-pre-hard-spar-strength
