[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: short summary of non-passing tests. --strict-markers: typo'd markers fail
# loudly instead of silently doing nothing.
addopts = "-ra --strict-markers"
markers = [
  "spacy: test exercises the spaCy/negspacy injury-parsing path (loads en_core_web_sm)",
]

[tool.ruff]
target-version = "py311"
extend-exclude = [
  ".venv",
  "web/.next",
  "web/node_modules",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
