<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>UNLXCK — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: "Space Grotesk", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); background: radial-gradient(circle at top left, rgba(181, 18, 43, .16), transparent 30%), linear-gradient(180deg, #080809, #0d0f12 55%, #09090a); color: #f5f7fa; }
      main { width: min(100%, 520px); padding: clamp(28px, 7vw, 48px); border: 1px solid #2a2f37; border-radius: 24px; background: linear-gradient(180deg, rgba(21, 24, 28, .98), rgba(13, 15, 18, .98)); box-shadow: 0 24px 70px rgba(0, 0, 0, .4); }
      img { display: block; width: 72px; height: 72px; margin-bottom: 28px; border-radius: 18px; }
      .label { margin: 0 0 10px; color: #ff8da1; font: 600 11px/1.2 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 0; max-width: 10ch; font-size: clamp(34px, 9vw, 54px); line-height: .98; letter-spacing: -.045em; }
      p { margin: 20px 0 0; color: #a7adb7; font-size: 16px; line-height: 1.65; }
      form { margin-top: 30px; }
      button { width: 100%; min-height: 52px; border: 1px solid #ca1834; border-radius: 10px; background: #b5122b; color: #fff; font: 700 15px/1 system-ui, sans-serif; cursor: pointer; }
      button:focus-visible { outline: 2px solid #f5f7fa; outline-offset: 3px; }
      small { display: block; margin-top: 18px; color: #767e89; font-size: 12px; line-height: 1.5; }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; }
        body { background: linear-gradient(180deg, #fdfbf8, #f6f1ea); color: #201b19; }
        main { border-color: #ddd5cb; background: #fff; box-shadow: 0 18px 40px rgba(79, 60, 52, .08); }
        p { color: #5d5450; }
        small { color: #8b7e75; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192x192.png" alt="UNLXCK" width="72" height="72" />
      <p class="label">Connection offline</p>
      <h1>UNLXCK can’t connect right now.</h1>
      <p>Your account data and fight-camp plans require a connection. Nothing personal is stored on this offline screen.</p>
      <form action="/dashboard" method="get">
        <input type="hidden" name="source" value="offline-retry" />
        <button type="submit">Retry connection</button>
      </form>
      <small>If you are back online, retrying will return you to your athlete dashboard.</small>
    </main>
  </body>
</html>
