<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>UNLXCK — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: "Space Grotesk", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: calc(28px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); background: #080809; color: #fff; }
      main { width: min(100%, 400px); padding: 32px; border: 1px solid #ffffff1c; border-radius: 16px; background: #101012; box-shadow: 0 24px 64px #0008; }
      header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 22px; margin-bottom: 26px; border-bottom: 1px solid #ffffff12; }
      img { display: block; width: 28px; height: 28px; object-fit: contain; }
      .label { margin: 0; color: #b2b2ba; font: 500 10px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: .18em; }
      h1 { margin: 0; font-size: clamp(27px, 7.3vw, 34px); font-weight: 500; line-height: 1.03; letter-spacing: -.045em; }
      .brand { display: block; margin-bottom: 8px; font-size: clamp(46px, 12vw, 58px); font-weight: 700; letter-spacing: -.065em; }
      p { margin: 20px 0 28px; color: #b4b4be; font-size: 14px; line-height: 1.65; }
      form { margin: 0; }
      button { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; min-height: 52px; padding: 14px 18px; border: 1px solid #e04451; border-radius: 7px; background: #b5122b; color: #fff; font: 600 14px/1.3 system-ui, sans-serif; cursor: pointer; }
      button:hover { background: #ca1733; }
      button:disabled { opacity: .7; cursor: progress; }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
      small { display: block; margin-top: 16px; color: #a2a2ad; text-align: center; font-size: 12px; line-height: 1.5; }
      @media (max-width: 380px) { main { padding: 26px 24px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAKCSURBVGhD7ZlNqE5BGMdvwkKyEQvFRvnYSEnKQixsZKUsWLAjO3EXvkspsbCwsLJmRT5KSZFSiuTjrm5uyUY33Q2SyP09eo6Zmp57zpmLOefM0fnVqfd9Zp6Z/3+e8/XOOzIyMDCQFcBiG+sNIrIVeGfj2SMi84Dz4rDtWQNsBJ578b0yICLHgB8qGvgJTPfCgIisAR76FXfi+2EAOAR8dsKnA/F5GwCWA7dLVj1/A8Be4KNf9RoT+RkATgeCC4HAe+AZv2nPALDExmIAN70BJ/4GsBQ47r63auAEcF9EVti2KoBrTugksC+IX+jCwFE36ZSIHLDtZQC3gLvAMhPvzoAHuAestv1CgFU2pnRqIJwM+AIctn1j5GCgOIJqPNInrM2pIhsDphrnbE4VwMWSsTozUFRC7/k2pwrgkssJXyd6ZWCluyUX5GLglM2JARwBvvlqdG0gWgERmS8iG8IYsA544qsRtiUlkYE5wARwVUQWmPjZpg2M/qsBBRhz/d8Am03b9vB7UlJUQAFe+dPF5f/xtfNXJKzAaz9OYOQxsNb2TUoTBky+vpYctP2TkfAUmmHAj6HY/slosgLuyP85oORsYFZ3k//BQHEbtWO0YSB2DYzanDKAlxXjNG7gZMXEeihPdcfB5oUA+4Gv5jW6NQM7dIIqEy4+XvVA8gsQyZ+0eUkB9uhSR0RMAdtM3pVZiH8b2yRIArArmLRKjG6b7xaRhcAdFys7bXz/F3brpVGAncD3iAn9PFEj3v+WfgAssnM0jr766gVZZ6KqLRB/XUTm2rFbA9gCfKoROuMIjF2243UCsMltN0ZNBOLP2HE6RUTWAx+8wDr0XxqbPzDQEb8AA/Cy7T+uJdgAAAAASUVORK5CYII=" alt="" width="28" height="28" />
        <p class="label">CONNECTION</p>
      </header>
      <h1><span class="brand">UNLXCK</span>your connection.</h1>
      <p>Your plan is waiting. Reconnect to pick up where you left off. Nothing personal is stored on this screen.</p>
      <form method="get">
        <button type="submit"><span id="retry-label">Retry connection</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 12 12 4M4 4h8v8" stroke="currentColor" stroke-width="1.5" /></svg></button>
      </form>
      <small id="offline-hint" role="status" aria-live="polite">We’ll return you to this page once the connection is confirmed.</small>
    </main>
    <script>
      (function () {
        var form = document.querySelector("form");
        var hint = document.getElementById("offline-hint");
        var button = document.querySelector("button");
        var label = document.getElementById("retry-label");
        // A worker navigation fallback keeps the requested URL in the address bar.
        var destination = location.pathname === "/offline.html" ? "/dashboard" : location.pathname + location.search + location.hash;
        var checking = false;
        var navigating = false;
        var timer;
        var controller;
        var delay = 3000;
        var revision = 0;
        function schedule() {
          clearTimeout(timer);
          if (navigator.onLine && !navigating) timer = setTimeout(function () { retry(false); }, delay);
        }
        async function retry(manual) {
          if (checking || navigating) return;
          if (!navigator.onLine) {
            hint.textContent = "You’re still offline. We’ll check again when your connection returns.";
            return;
          }
          // One automatic navigation per minute if API is up but the app is not.
          if (!manual) {
            try { if (Date.now() - Number(history.state && history.state.unlxckRecoveryReloadAt) < 60000) return; } catch (_) { return; }
          }
          checking = true;
          clearTimeout(timer);
          controller = new AbortController();
          var currentRevision = revision;
          var timeout = setTimeout(function () { controller.abort(); }, 8000);
          button.disabled = true;
          label.textContent = "Checking connection…";
          hint.textContent = "Confirming the connection to UNLXCK…";
          try {
            var response = await fetch("/api/health", { cache: "no-store", credentials: "same-origin", redirect: "error", signal: controller.signal });
            if (!response.ok || !(response.headers.get("content-type") || "").includes("application/json")) throw new Error("unavailable");
            var body = await response.json();
            if (!body || body.ok !== true || body.app !== "unlxck-fight-camp-api" || !navigator.onLine || controller.signal.aborted || currentRevision !== revision) throw new Error("unavailable");
            try { history.replaceState(Object.assign({}, history.state, { unlxckRecoveryReloadAt: Date.now() }), ""); } catch (_) { if (!manual) throw new Error("reload guard unavailable"); }
            navigating = true;
            hint.textContent = "Connection confirmed. Unlxcking your page…";
            // Replacing the same URL with a hash can be a same-document
            // navigation. Reload the requested document to leave the fallback.
            if (location.pathname === "/offline.html") location.replace(destination);
            else location.reload();
          } catch (_) {
            hint.textContent = "Still can’t reach UNLXCK. We’ll keep checking, or you can retry.";
            delay = Math.min(delay * 2, 30000);
          } finally {
            clearTimeout(timeout);
            checking = false;
            if (!navigating) {
              button.disabled = false;
              label.textContent = "Retry connection";
              schedule();
            }
          }
        }
        window.addEventListener("online", function () { retry(false); });
        window.addEventListener("offline", function () {
          revision += 1;
          clearTimeout(timer);
          if (controller) controller.abort();
          hint.textContent = "You’re offline. We’ll reconnect when your connection returns.";
        });
        form.addEventListener("submit", function (event) { event.preventDefault(); retry(true); });
        window.addEventListener("pagehide", function () { clearTimeout(timer); if (controller) controller.abort(); });
        if (navigator.onLine) retry(false);
      })();
    </script>
  </body>
</html>
